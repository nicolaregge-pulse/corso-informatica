<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cruscotto progetti 4TI</title>
<style>
:root{--bg:#f4f7fb;--fg:#1a2330;--mu:#5b6573;--card:#fff;--bd:#d6e0ea;--ok:#1a7f37;--ko:#c0392b;--wa:#b7791f;--blu:#1f6feb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eee;--mu:#a9a9a9;--card:#1f2227;--bd:#353a42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
.w{max-width:1200px;margin:0 auto;padding:16px}h1{font-size:24px;margin:4px 0}.mu{color:var(--mu);font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:14px;margin-top:12px}@media(max-width:600px){.g{grid-template-columns:1fr}}
.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.p h2{margin:0 0 4px;font-size:20px}.stato{display:inline-block;padding:4px 10px;border-radius:20px;font-weight:700;font-size:14px;color:#fff}
.tile{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tile div{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-width:110px}.tile b{display:block;font-size:20px}.tile span{font-size:12px;color:var(--mu)}
table{border-collapse:collapse;width:100%;font-size:14px}td{border-bottom:1px solid var(--bd);padding:4px 6px;vertical-align:top}
a{color:var(--blu)}.btn{display:inline-block;border:1px solid var(--bd);border-radius:8px;padding:5px 10px;text-decoration:none;margin:2px 4px 2px 0;font-size:14px}
h3{font-size:15px;margin:12px 0 4px}.msg{background:var(--bg);border-radius:8px;padding:8px;font-size:14px;white-space:pre-wrap;max-height:120px;overflow:auto}
</style>
</head>
<body><div class="w">
<h1>Cruscotto dei progetti 4TI</h1>
<div class="mu" id="agg">Legge GitHub in diretta · si aggiorna da solo ogni 10 minuti · <a href="#" id="ora">aggiorna adesso</a></div>
<div class="g" id="g"></div>
</div>
<script>
  // privacy 28/10/2026: il nome utente GitHub dell'allievo non sta nella pagina, solo la sua impronta
  function hashLogin(s) { var x = 5381; s = String(s || '').toLowerCase(); for (var i = 0; i < s.length; i++) { x = (Math.imul(x, 33) ^ s.charCodeAt(i)) >>> 0; } return x; }

(function () {
'use strict';
// I progetti dei ragazzi: per aggiungerne uno basta una riga.
var PROGETTI = [
  { nome: 'C.D.L.', progetto: 'Automa meteo (Python, GitHub Actions, dashboard)', repo: 'chasedeleon/automa-meteo-python', allievo: 2184155024, chat: 2,
    sito: 'https://chasedeleon.github.io/automa-meteo-python/', percorso: 'https://nicolaregge-pulse.github.io/corso-informatica/verifica/?b=4ti-automa-meteo' },
  { nome: 'G.A.', progetto: 'Router-firewall virtuale RV-1 (stile MikroTik)', repo: 'nicolaregge-pulse/firewall-virtuale', allievo: 3602430627, chat: 1,
    sito: 'https://nicolaregge-pulse.github.io/firewall-virtuale/' }
];
var API = 'https://api.github.com/repos/';
function e(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function ora(iso) { return new Date(iso).toLocaleString('it-IT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
function fa(iso) { var m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'adesso' : m < 60 ? m + ' min fa' : m < 1440 ? Math.round(m / 60) + ' ore fa' : Math.round(m / 1440) + ' giorni fa'; }
function get(path) { return fetch(API + path, { headers: { Accept: 'application/vnd.github+json' } }).then(function (r) { if (!r.ok) throw new Error(r.status === 403 ? 'limite di GitHub raggiunto: riprova tra un po\'' : 'errore ' + r.status); return r.json(); }); }
function chi(c, p) { var b = c.body || ''; if (/Generated by \[Claude Code\]/.test(b)) return 'Claude'; if (hashLogin(c.user.login) === p.allievo) return p.nome; if (c.user.login === 'nicolaregge-pulse') return 'Prof'; return c.user.login; }
function carica(p, box) {
  var oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  var dalle = new Date(Date.now() - 7 * 864e5).toISOString();
  Promise.all([
    get(p.repo + '/commits?per_page=40'),
    get(p.repo + '/issues/' + p.chat + '/comments?per_page=100&since=' + dalle),
    get(p.repo + '/actions/runs?per_page=6').catch(function () { return { workflow_runs: [] }; }),
    get(p.repo + '/pulls?state=open').catch(function () { return []; })
  ]).then(function (r) {
    var commits = r[0], chat = r[1], runs = r[2].workflow_runs || [], prs = r[3];
    var suoi = commits.filter(function (c) { return c.author && hashLogin(c.author.login) === p.allievo; });
    var suoiOggi = suoi.filter(function (c) { return new Date(c.commit.author.date) >= oggi; });
    var ultimoSuo = suoi[0];
    var msgSuoi = chat.filter(function (c) { return chi(c, p) === p.nome; });
    var ultimo = chat[chat.length - 1];
    var stato, col;
    if (!ultimo) { stato = 'nessun messaggio nella chat'; col = 'var(--mu)'; }
    else if (chi(ultimo, p) === p.nome) { stato = 'ASPETTA UNA RISPOSTA da ' + fa(ultimo.created_at); col = 'var(--ko)'; }
    else if (Date.now() - new Date(ultimo.created_at) > 20 * 60000) { stato = 'fermo da ' + fa(ultimo.created_at).replace(' fa', ''); col = 'var(--wa)'; }
    else { stato = 'al lavoro: tocca a ' + p.nome; col = 'var(--ok)'; }
    var automa = runs.filter(function (x) { return x.name !== 'pages build and deployment'; })[0];
    var h = '<h2>' + e(p.nome) + '</h2><div class="mu">' + e(p.progetto) + '</div>' +
      '<p><span class="stato" style="background:' + col + '">' + e(stato) + '</span></p>' +
      '<div class="tile"><div><span>Commit suoi oggi</span><b>' + suoiOggi.length + '</b></div><div><span>Commit suoi in tutto</span><b>' + suoi.length + '</b></div>' +
      '<div><span>Suoi messaggi (7 giorni)</span><b>' + msgSuoi.length + '</b></div>' +
      '<div><span>Ultimo commit suo</span><b style="font-size:14px">' + (ultimoSuo ? fa(ultimoSuo.commit.author.date) : '—') + '</b></div>' +
      (automa ? '<div><span>Ultima esecuzione: ' + e(automa.name) + '</span><b style="font-size:14px;color:' + (automa.conclusion === 'success' ? 'var(--ok)' : automa.conclusion ? 'var(--ko)' : 'var(--wa)') + '">' + (automa.conclusion === 'success' ? 'riuscita' : automa.conclusion || 'in corso') + ' · ' + fa(automa.created_at) + '</b></div>' : '') + '</div>' +
      '<div><a class="btn" href="https://github.com/' + p.repo + '/pull/' + p.chat + '" target="_blank">Apri la chat</a><a class="btn" href="https://github.com/' + p.repo + '/commits" target="_blank">Tutti i commit</a><a class="btn" href="' + p.sito + '" target="_blank">Il suo sito</a>' + (p.percorso ? '<a class="btn" href="' + p.percorso + '" target="_blank">Percorso guidato</a>' : '') + '</div>' +
      (prs.filter(function (x) { return x.number !== p.chat; }).length ? '<h3>Da unire (le deve accettare lui)</h3><table>' + prs.filter(function (x) { return x.number !== p.chat; }).map(function (x) { return '<tr><td><a href="' + x.html_url + '" target="_blank">#' + x.number + ' ' + e(x.title) + '</a></td><td class="mu">aperta ' + fa(x.created_at) + '</td></tr>'; }).join('') + '</table>' : '') +
      (ultimo ? '<h3>Ultimo messaggio nella chat · ' + e(chi(ultimo, p)) + ' · ' + ora(ultimo.created_at) + '</h3><div class="msg">' + e((ultimo.body || '').replace(/\n---\n_Generated by[\s\S]*$/, '').slice(0, 600)) + '</div>' : '') +
      '<h3>I suoi ultimi commit</h3><table>' + (suoi.slice(0, 6).map(function (c) { return '<tr><td class="mu" style="white-space:nowrap">' + ora(c.commit.author.date) + '</td><td>' + e(c.commit.message.split('\n')[0]) + '</td></tr>'; }).join('') || '<tr><td class="mu">nessun commit suo ancora</td></tr>') + '</table>' +
      '<h3>La chat, ultimi messaggi</h3><table>' + chat.slice(-8).reverse().map(function (c) { var w = chi(c, p); return '<tr><td class="mu" style="white-space:nowrap">' + ora(c.created_at) + '</td><td><b style="color:' + (w === p.nome ? 'var(--blu)' : 'inherit') + '">' + e(w) + '</b></td><td>' + e((c.body || '').replace(/\n---\n_Generated by[\s\S]*$/, '').replace(/\s+/g, ' ').slice(0, 110)) + '</td></tr>'; }).join('') + '</table>';
    box.innerHTML = h;
  }).catch(function (err) { box.innerHTML = '<h2>' + e(p.nome) + '</h2><p style="color:var(--ko)">Non riesco a leggere GitHub: ' + e(err.message) + '</p>'; });
}
function tutto() {
  var g = document.getElementById('g'); g.innerHTML = '';
  PROGETTI.forEach(function (p) { var b = document.createElement('section'); b.className = 'p'; b.innerHTML = '<h2>' + e(p.nome) + '</h2><p class="mu">carico…</p>'; g.appendChild(b); carica(p, b); });
  document.getElementById('agg').firstChild.textContent = 'Legge GitHub in diretta · ultimo aggiornamento ' + new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + ' · si aggiorna da solo ogni 10 minuti · ';
}
document.getElementById('ora').onclick = function (ev) { ev.preventDefault(); tutto(); };
tutto(); setInterval(tutto, 600000);
})();
</script>
</body>
</html>
