<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor 1INF</title><style>
:root{--bg:#fbfaf7;--card:#fff;--tx:#111;--mu:#555;--ln:#ddd;--acc:#1f6feb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#9aa4ae;--ln:#30363d;--acc:#58a6ff}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#9aa4ae;--ln:#30363d;--acc:#58a6ff}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,Segoe UI,Arial,sans-serif}.w{max-width:1150px;margin:0 auto;padding:16px}
h1{font-size:clamp(24px,6vw,32px);margin:8px 0 2px}h2{font-size:21px;margin:18px 0 6px}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;margin:10px 0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--ln);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--acc);color:#fff}
.n{font-size:22px;font-weight:900;text-align:center}.ok{color:#2f9e57}.ko{color:#e0413a}tr.fuori td{background:rgba(224,65,58,.12)}
.bt{display:inline-block;background:#1f6feb;color:#fff;font-weight:800;text-decoration:none;border-radius:10px;padding:8px 14px;margin:4px 6px 4px 0}
</style></head><body><div class="w">
<h1>Il monitor della lezione: 1INF</h1><p class="mu"><span id="data">13/10/2026</span> · cosa c'era sullo schermo di ogni computer durante i giri del prof (Veyon). Solo fatti.</p>
<p><a class="bt" target="_blank" href="../1inf-voti/">I voti</a><a class="bt" target="_blank" href="../1inf-backlog/">Il backlog</a></p>
<div id="giri"><p class="mu">Carico…</p></div>
</div><script>
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function carica(){fetch('monitor.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
 document.getElementById('giri').innerHTML=(document.getElementById("data").textContent=d.data||""),d.giri.slice().reverse().map(function(g){var f=g.righe.filter(function(r){return r.fuori}).length;
  return '<h2>Giro delle '+e(g.ora)+(f?' · <span class="ko">'+f+' fuori compito</span>':'')+'</h2><div class="card"><table><thead><tr><th>PC</th><th>Alunno</th><th>Sullo schermo</th></tr></thead><tbody>'+
  g.righe.map(function(r){return '<tr class="'+(r.fuori?'fuori':'')+'"><td>'+e(r.pc)+'</td><td><b>'+e(r.alunno)+'</b></td><td>'+e(r.cosa)+'</td></tr>'}).join('')+'</tbody></table></div>'}).join('')}).catch(function(){})}
carica();setInterval(carica,60000);
</script></body></html>
