<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Cruscotto 2INF</title><style>body{margin:0;background:#fbfaf7;color:#111;font:16px/1.45 system-ui,Segoe UI,Arial,sans-serif}.w{max-width:1100px;margin:0 auto;padding:16px}
.box{background:#fff;border:2px solid #1f6feb;border-radius:12px;padding:16px;max-width:420px}input{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px;width:100%;box-sizing:border-box;margin:8px 0}
button{font:inherit;font-weight:800;background:#1f6feb;color:#fff;border:0;border-radius:10px;padding:10px 18px}#err{color:#c0392b}#agg{color:#5b6573;font-size:14px}</style><style id="st"></style></head><body><div class="w">
<h1>Cruscotto del prof — 2INF · 13/10/2026</h1><div id="agg"></div>
<div class="box" id="chiusa"><p><b>Solo per il prof.</b> Scrivi la password dell'area docente.</p><input id="pw" type="password" autocomplete="current-password"><button id="ok">Apri</button><p id="err"></p></div>
<div id="aperta"></div></div><script>
var PW=null;try{PW=sessionStorage.getItem('cruscotto-pw')}catch(e){}
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function apri(X,pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(X.salt),iterations:X.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 var t=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(X.iv)},k,b64(X.ct));return JSON.parse(new TextDecoder().decode(t))}
async function carica(pw){var X=await (await fetch('dati.json?t='+Date.now(),{cache:'no-store'})).json();var d=await apri(X,pw);
 document.getElementById('st').textContent=d.stile;document.getElementById('aperta').innerHTML=d.corpo;document.getElementById('chiusa').hidden=true;
 document.getElementById('agg').textContent='Si aggiorna da solo ogni minuto · ultimo controllo '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
async function prova(){var pw=document.getElementById('pw').value;try{await carica(pw);PW=pw;try{sessionStorage.setItem('cruscotto-pw',pw)}catch(e){}}catch(e){document.getElementById('err').textContent='Password sbagliata.'}}
document.getElementById('ok').onclick=prova;document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')prova()});
if(PW)carica(PW).catch(function(){PW=null});
setInterval(function(){if(PW)carica(PW).catch(function(){})},60000);
</script></body></html>
