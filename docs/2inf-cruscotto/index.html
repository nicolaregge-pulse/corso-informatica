function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function apri(pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(X.salt),iterations:X.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 var t=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(X.iv)},k,b64(X.ct));return JSON.parse(new TextDecoder().decode(t))}
async function prova(){try{var d=await apri(document.getElementById('pw').value);document.getElementById('st').textContent=d.stile;document.getElementById('aperta').innerHTML=d.corpo;document.getElementById('chiusa').hidden=true}
