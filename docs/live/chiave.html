<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chiave del cruscotto</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2128;--mu:#5c6670;--ln:#d6dbe0;--acc:#0b5cc9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#9aa4ae;--ln:#30363d;--acc:#79b0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,Segoe UI,Arial,sans-serif;padding:16px}
.w{max-width:640px;margin:0 auto}h1{font-size:26px}
input,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);min-height:46px}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:15px;min-height:70px}
button{font:inherit;font-weight:800;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;min-height:48px;margin:8px 8px 8px 0;cursor:pointer}
.mu{color:var(--mu);font-size:15px}
</style></head><body><div class="w">
<h1>Chiave per Apps Script</h1>
<p>Scrivi il codice del docente. La pagina calcola, dentro il tuo browser, la chiave da incollare nelle proprietà dello script (nome <b>LV_CHIAVE</b>). Il codice non esce dal browser e non va scritto in chat.</p>
<input type="password" id="c" placeholder="Codice del docente" autocomplete="off" aria-label="Codice del docente">
<button id="b" type="button">Calcola la chiave</button>
<div id="m" class="mu"></div>
<textarea id="k" readonly style="display:none" aria-label="Chiave"></textarea>
<button id="cp" type="button" style="display:none">Copia la chiave</button>
</div><script>
(function(){
var SALT=new TextEncoder().encode('cruscotto-docente-v1');
function $(i){return document.getElementById(i);}
function calcola(){var c=$('c').value;if(!c)return;$('m').textContent='Calcolo...';
 crypto.subtle.importKey('raw',new TextEncoder().encode(c),'PBKDF2',false,['deriveBits']).then(function(km){return crypto.subtle.deriveBits({name:'PBKDF2',salt:SALT,iterations:150000,hash:'SHA-256'},km,256);}).then(function(bits){
  var a=new Uint8Array(bits),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);$('k').value=btoa(s);$('k').style.display='block';$('cp').style.display='';$('c').value='';$('m').textContent='Fatto. Copia la chiave e incollala come valore della proprietà LV_CHIAVE.';
 }).catch(function(){$('m').textContent='Errore nel calcolo (serve una pagina https).';});}
$('b').onclick=calcola;$('c').onkeydown=function(e){if(e.key==='Enter')calcola();};
$('cp').onclick=function(){var t=$('k');t.select();try{navigator.clipboard.writeText(t.value);$('m').textContent='Copiata.';}catch(e){document.execCommand('copy');}};
})();
</script></body></html>
