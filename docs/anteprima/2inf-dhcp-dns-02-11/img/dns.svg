<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Il DNS è la rubrica che traduce un nome in un numero IP" font-family="Arial,sans-serif" font-size="20"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker></defs><rect width="640" height="300" fill="#fff"/><rect x="200" y="20" width="240" height="150" rx="12" fill="#fff4c2" stroke="#1f6feb" stroke-width="3"/><text x="320" y="50" text-anchor="middle" font-weight="700" fill="#111">LA RUBRICA (DNS)</text><text x="320" y="85" text-anchor="middle" font-size="17" fill="#111">nome del sito  ->  numero IP</text><text x="320" y="115" text-anchor="middle" font-size="17" fill="#111">nome A  ->  numero A</text><text x="320" y="145" text-anchor="middle" font-size="17" fill="#111">nome B  ->  numero B</text><rect x="20" y="215" width="170" height="70" rx="12" fill="#fff4c2" stroke="#1f6feb" stroke-width="3"/><text x="105" y="257" text-anchor="middle" font-weight="700" fill="#111">Il mio PC</text><line x1="195" y1="235" x2="300" y2="175" stroke="#1f6feb" stroke-width="4" marker-end="url(#a)"/><text x="247" y="230" text-anchor="middle" font-size="17" fill="#111">Che numero ha il nome?</text><line x1="340" y1="175" x2="440" y2="235" stroke="#1f6feb" stroke-width="4" marker-end="url(#a)"/><rect x="450" y="215" width="170" height="70" rx="12" fill="#d9f2e0" stroke="#1f6feb" stroke-width="3"/><text x="535" y="257" text-anchor="middle" font-weight="700" fill="#111">Il numero IP</text><text x="320" y="292" text-anchor="middle" font-size="15" fill="#333">Il DNS risponde con il numero.</text></svg>