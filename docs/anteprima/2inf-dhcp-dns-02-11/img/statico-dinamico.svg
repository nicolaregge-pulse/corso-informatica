<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="IP statico scritto a mano, IP dinamico prestato dal DHCP" font-family="Arial,sans-serif" font-size="20"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker></defs><rect width="640" height="300" fill="#fff"/><rect x="20" y="20" width="290" height="260" rx="14" fill="#e8f1ff" stroke="#1f6feb" stroke-width="3"/><text x="165" y="55" text-anchor="middle" font-weight="700" fill="#111">IP STATICO</text><text x="165" y="95" text-anchor="middle" font-size="17" fill="#111">Scritto a mano</text><text x="165" y="125" text-anchor="middle" font-size="17" fill="#111">Non cambia mai</text><text x="165" y="170" text-anchor="middle" font-size="17" fill="#111">Come la tua casa:</text><text x="165" y="195" text-anchor="middle" font-size="17" fill="#111">il numero civico è sempre quello</text><rect x="330" y="20" width="290" height="260" rx="14" fill="#d9f2e0" stroke="#1a7f37" stroke-width="3"/><text x="475" y="55" text-anchor="middle" font-weight="700" fill="#111">IP DINAMICO</text><text x="475" y="95" text-anchor="middle" font-size="17" fill="#111">Prestato dal DHCP</text><text x="475" y="125" text-anchor="middle" font-size="17" fill="#111">Può cambiare</text><text x="475" y="170" text-anchor="middle" font-size="17" fill="#111">Come una camera d'albergo:</text><text x="475" y="195" text-anchor="middle" font-size="17" fill="#111">ogni volta può essere diversa</text></svg>