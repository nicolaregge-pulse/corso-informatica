<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Il PC chiede un indirizzo al router e il router lo presta" font-family="Arial,sans-serif" font-size="20"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker></defs><rect width="640" height="300" fill="#fff"/><rect x="30" y="100" width="170" height="90" rx="12" fill="#fff4c2" stroke="#1f6feb" stroke-width="3"/><text x="115" y="152" text-anchor="middle" font-weight="700" fill="#111">Il mio PC</text><rect x="440" y="100" width="170" height="90" rx="12" fill="#d9f2e0" stroke="#1f6feb" stroke-width="3"/><text x="525" y="141" text-anchor="middle" font-weight="700" fill="#111">Il router</text><text x="525" y="167" text-anchor="middle" font-size="16" fill="#333">(fa il DHCP)</text><line x1="205" y1="125" x2="435" y2="125" stroke="#1f6feb" stroke-width="4" marker-end="url(#a)"/><text x="320" y="115" text-anchor="middle" font-size="17" fill="#111">1. Mi dai un indirizzo?</text><line x1="435" y1="170" x2="205" y2="170" stroke="#1f6feb" stroke-width="4" marker-end="url(#a)"/><text x="320" y="192" text-anchor="middle" font-size="17" fill="#111">2. Ecco: 192.168.1.25</text><text x="320" y="255" text-anchor="middle" font-size="18" fill="#111">Te lo presto per un po' di tempo (il contratto).</text></svg>