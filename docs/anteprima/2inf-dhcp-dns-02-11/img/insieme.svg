<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Prima il DHCP, poi il DNS, poi il sito" font-family="Arial,sans-serif" font-size="20"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/></marker></defs><rect width="640" height="300" fill="#fff"/><rect x="20" y="20" width="170" height="70" rx="12" fill="#d9f2e0" stroke="#1f6feb" stroke-width="3"/><text x="105" y="51" text-anchor="middle" font-weight="700" fill="#111">1. DHCP</text><text x="105" y="77" text-anchor="middle" font-size="16" fill="#333">mi dà IP e DNS</text><rect x="235" y="20" width="170" height="70" rx="12" fill="#fff4c2" stroke="#1f6feb" stroke-width="3"/><text x="320" y="51" text-anchor="middle" font-weight="700" fill="#111">2. DNS</text><text x="320" y="77" text-anchor="middle" font-size="16" fill="#333">nome -> numero</text><rect x="450" y="20" width="170" height="70" rx="12" fill="#e8f1ff" stroke="#1f6feb" stroke-width="3"/><text x="535" y="51" text-anchor="middle" font-weight="700" fill="#111">3. Il sito</text><text x="535" y="77" text-anchor="middle" font-size="16" fill="#333">mi risponde</text><line x1="190" y1="55" x2="232" y2="55" stroke="#1f6feb" stroke-width="4" marker-end="url(#a)"/><line x1="405" y1="55" x2="447" y2="55" stroke="#1f6feb" stroke-width="4" marker-end="url(#a)"/><rect x="20" y="130" width="600" height="150" rx="12" fill="#f6f7f9" stroke="#999" stroke-width="2"/><text x="40" y="165" font-size="18" fill="#111">Scrivo il nome del sito nel browser.</text><text x="40" y="195" font-size="18" fill="#111">Il DHCP mi aveva già dato il mio IP e il DNS da usare.</text><text x="40" y="225" font-size="18" fill="#111">Il DNS trova il numero del sito.</text><text x="40" y="255" font-size="18" fill="#111">Il PC si collega a quel numero e la pagina si apre.</text></svg>