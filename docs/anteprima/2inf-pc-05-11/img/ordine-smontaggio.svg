<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Ordine dello smontaggio" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><text x="360" y="50" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="700">Ordine dello smontaggio</text><rect x="40" y="120" width="189" height="120" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="3"/><circle cx="62" cy="120" r="16" fill="#1f6feb"/><text x="62" y="126" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="134.5" y="165" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="700">Cavi del</text><text x="134.5" y="187" font-size="15" fill="#1f2328" text-anchor="middle">disco</text><line x1="231" y1="180" x2="251" y2="180" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><rect x="253" y="120" width="189" height="120" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="3"/><circle cx="275" cy="120" r="16" fill="#1f6feb"/><text x="275" y="126" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="347.5" y="165" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="700">Cavi del</text><text x="347.5" y="187" font-size="15" fill="#1f2328" text-anchor="middle">DVD</text><line x1="444" y1="180" x2="464" y2="180" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><rect x="466" y="120" width="189" height="120" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="3"/><circle cx="488" cy="120" r="16" fill="#1f6feb"/><text x="488" y="126" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="560.5" y="165" font-size="15" fill="#1f2328" text-anchor="middle" font-weight="700">RAM</text><text x="360" y="300" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">Rimontare = stesso elenco, al contrario (da destra a sinistra).</text><text x="360" y="335" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="700">CPU, ventola, disco e DVD: NON si tolgono.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
