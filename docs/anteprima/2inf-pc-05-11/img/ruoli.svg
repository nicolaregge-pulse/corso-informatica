<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="ruoli" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="70" y="70" width="260" height="260" rx="12" fill="#fff" stroke="#2d6a4f" stroke-width="4"/><text x="200" y="115" font-size="26" fill="#2d6a4f" text-anchor="middle" font-weight="700">MANI</text><text x="200" y="175" font-size="18" fill="#1f2328" text-anchor="middle">smonta e monta</text><text x="200" y="215" font-size="18" fill="#1f2328" text-anchor="middle">usa il cacciavite</text><text x="200" y="255" font-size="18" fill="#1f2328" text-anchor="middle">sta alla tastiera</text><rect x="390" y="70" width="260" height="260" rx="12" fill="#fff" stroke="#1f6feb" stroke-width="4"/><text x="520" y="115" font-size="26" fill="#1f6feb" text-anchor="middle" font-weight="700">OCCHI</text><text x="520" y="175" font-size="18" fill="#1f2328" text-anchor="middle">legge il passo</text><text x="520" y="215" font-size="18" fill="#1f2328" text-anchor="middle">compila la scheda</text><text x="520" y="255" font-size="18" fill="#1f2328" text-anchor="middle">controlla la checklist</text><path d="M335,200 L385,200" stroke="#57606a" stroke-width="4" marker-end="url(#fr)"/><path d="M385,230 L335,230" stroke="#57606a" stroke-width="4" marker-end="url(#fr)"/><text x="360" y="370" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="700">A ogni fase vi scambiate i ruoli.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
