<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Scheda della coppia" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="20" y="18" width="680" height="362" rx="8" fill="#fff" stroke="#8c959f" stroke-width="2"/><rect x="20" y="18" width="680" height="34" rx="8" fill="#1f6feb"/><rect x="20" y="40" width="680" height="12" fill="#1f6feb"/><text x="36" y="41" font-size="17" fill="#fff" text-anchor="start" font-weight="700">Scheda della coppia</text><text x="40" y="90" font-size="18" fill="#1f2328" text-anchor="start" font-weight="700">Compila la scheda in fondo alla pagina.</text><text x="40" y="120" font-size="15" fill="#5b6573" text-anchor="start">Il tuo nome e cognome</text><rect x="40" y="126" width="300" height="32" rx="4" fill="#fff" stroke="#1f6feb" stroke-width="2"/><text x="48" y="148" font-size="16" fill="#1f2328" text-anchor="start">Nome Cognome</text><text x="380" y="120" font-size="15" fill="#5b6573" text-anchor="start">Il compagno</text><rect x="380" y="126" width="300" height="32" rx="4" fill="#fff" stroke="#1f6feb" stroke-width="2"/><text x="388" y="148" font-size="16" fill="#1f2328" text-anchor="start">Nome Cognome</text><text x="40" y="210" font-size="17" fill="#1f2328" text-anchor="start">Poi premi il bottone verde:</text><rect x="40" y="230" width="300" height="36" rx="6" fill="#1a7f37" stroke="#c0392b" stroke-width="4"/><text x="190.0" y="254" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Manda al prof</text><line x1="420" y1="248" x2="350" y2="248" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><text x="430" y="254" font-size="17" fill="#1f2328" text-anchor="start">un clic solo</text><text x="40" y="320" font-size="17" fill="#1f2328" text-anchor="start">Si apre una scheda «Consegna arrivata al prof»: hai finito.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
