text-anchor="start">3. poi tira dalla spina,</text><text x="390" y="255" font-size="17" fill="#c0392b" text-anchor="start" font-weight="700">    MAI dal filo.</text><text x="390" y="300" font-size="17" fill="#1f6feb" text-anchor="start" font-weight="700">Chi ha il ruolo «Occhi»</text><text x="390" y="328" font-size="17" fill="#1f6feb" text-anchor="start" font-weight="700">segna; «Mani» stacca.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
