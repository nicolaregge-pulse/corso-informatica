<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="apri-case" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="160" y="60" width="260" height="300" rx="8" fill="#dfe3e8" stroke="#57606a" stroke-width="3"/><rect x="420" y="70" width="30" height="280" rx="4" fill="#adb5bd" stroke="#57606a" stroke-width="2"/><rect x="426" y="180" width="18" height="60" rx="4" fill="#1a7f37" stroke="#1b4332" stroke-width="2"/><line x1="520" y1="210" x2="452" y2="210" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><text x="530" y="200" font-size="17" fill="#c0392b" text-anchor="start" font-weight="700">leva o gancio</text><text x="530" y="225" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">(niente viti)</text><text x="290" y="200" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="700">retro del PC</text><line x1="300" y1="330" x2="200" y2="330" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><text x="60" y="378" font-size="16" fill="#1f2328" text-anchor="start">Tira la leva (o premi il gancio), poi fai scorrere il pannello laterale verso il retro.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
