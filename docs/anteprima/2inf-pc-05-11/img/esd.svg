<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="esd" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="60" y="90" width="260" height="260" rx="8" fill="#dfe3e8" stroke="#57606a" stroke-width="3"/><rect x="60" y="90" width="30" height="260" rx="2" fill="#adb5bd" stroke="#57606a" stroke-width="2"/><circle cx="150" cy="210" r="34" fill="#f1c27d" stroke="#8d5524" stroke-width="2"/><text x="150" y="216" font-size="15" fill="#5b3a1a" text-anchor="middle" font-weight="700">mano</text><line x1="150" y1="176" x2="95" y2="150" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><text x="360" y="120" font-size="19" fill="#1f2328" text-anchor="start" font-weight="700">Prima di toccare i pezzi:</text><text x="360" y="160" font-size="18" fill="#1f2328" text-anchor="start">tocca il metallo del case</text><text x="360" y="190" font-size="18" fill="#1f2328" text-anchor="start">(oppure metti il braccialetto</text><text x="360" y="220" font-size="18" fill="#1f2328" text-anchor="start">antistatico, se c'è).</text><text x="360" y="270" font-size="18" fill="#c0392b" text-anchor="start" font-weight="700">Così scarichi l'elettricità</text><text x="360" y="300" font-size="18" fill="#c0392b" text-anchor="start" font-weight="700">statica e non rompi la RAM.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
