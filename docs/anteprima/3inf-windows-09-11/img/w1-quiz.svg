<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Quiz su Moduli Google" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="20" y="18" width="680" height="362" rx="8" fill="#fff" stroke="#8c959f" stroke-width="2"/><rect x="20" y="18" width="680" height="34" rx="8" fill="#1f6feb"/><rect x="20" y="40" width="680" height="12" fill="#1f6feb"/><text x="36" y="41" font-size="17" fill="#fff" text-anchor="start" font-weight="700">Quiz su Moduli Google</text><text x="40" y="95" font-size="18" fill="#1f2328" text-anchor="start" font-weight="700">10 domande. Servono 7 giuste. Puoi rifarlo.</text><text x="40" y="140" font-size="16" fill="#1f2328" text-anchor="start">Dove c'è «(scegli 2 risposte)»</text><text x="40" y="165" font-size="16" fill="#1f2328" text-anchor="start">metti DUE crocette.</text><rect x="40" y="230" width="200" height="36" rx="6" fill="#1a7f37" stroke="#c0392b" stroke-width="4"/><text x="140.0" y="254" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Invia</text><text x="40" y="300" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">Il bottone verde della pagina apre il quiz in una scheda nuova.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
