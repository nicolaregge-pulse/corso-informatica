<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Scegli A o B"><rect width="800" height="470" fill="#eef1f4"/><rect x="10" y="10" width="780" height="450" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><text x="400" y="60" font-size="28" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Scegli il tuo percorso</text><rect x="60" y="100" width="320" height="230" rx="10" fill="#fde8e8" stroke="#57606a" stroke-width="2"/><text x="220" y="160" font-size="60" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">A</text><text x="220" y="210" font-size="22" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Prima il ripasso</text><text x="220" y="240" font-size="22" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">della Sicurezza (3 passi)</text><text x="220" y="290" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">poi Lazarus</text><rect x="420" y="100" width="320" height="230" rx="10" fill="#e3f7e3" stroke="#57606a" stroke-width="2"/><text x="580" y="160" font-size="60" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">B</text><text x="580" y="210" font-size="22" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Lazarus subito</text><text x="580" y="240" font-size="22" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">il convertitore di misure</text><text x="580" y="290" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">parti ora!</text><rect x="55" y="95" width="330" height="240" rx="12" fill="none" stroke="#d1242f" stroke-width="5"/><text x="400" y="390" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Il Professore ti dice A o B. Premi il tuo bottone.</text><text x="30" y="445" font-size="18" fill="#d1242f" font-family="Arial,Helvetica,sans-serif">Schema disegnato, non uno screenshot</text></svg>