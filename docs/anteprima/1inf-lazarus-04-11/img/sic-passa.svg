<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Ora Lazarus"><rect width="800" height="470" fill="#eef1f4"/><rect x="10" y="10" width="780" height="450" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><rect x="40" y="90" width="300" height="150" rx="10" fill="#e3f7e3" stroke="#57606a" stroke-width="2"/><text x="190" y="150" font-size="26" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Sicurezza</text><text x="190" y="190" font-size="34" fill="#1a7f37" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">FATTO</text><path d="M350,165 L440,165" stroke="#d1242f" stroke-width="6"/><path d="M440,145 L480,165 L440,185 z" fill="#d1242f"/><rect x="490" y="90" width="270" height="150" rx="10" fill="#e8f0ff" stroke="#57606a" stroke-width="2"/><text x="625" y="150" font-size="26" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Lazarus</text><text x="625" y="190" font-size="17" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">passo 1: crea il progetto</text><text x="400" y="300" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Entro la fine dell'ora: il primo bottone funziona!</text><text x="400" y="340" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Poi continui con i passi di tutti.</text><text x="30" y="445" font-size="18" fill="#d1242f" font-family="Arial,Helvetica,sans-serif">Schema disegnato, non uno screenshot</text></svg>