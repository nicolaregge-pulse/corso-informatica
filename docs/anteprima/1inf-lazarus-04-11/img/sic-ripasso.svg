<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Pericolo danno rischio"><rect width="800" height="470" fill="#eef1f4"/><rect x="10" y="10" width="780" height="450" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><text x="400" y="55" font-size="28" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Le parole della Sicurezza</text><rect x="40" y="85" width="230" height="120" rx="10" fill="#fff8d6" stroke="#57606a" stroke-width="2"/><text x="155" y="125" font-size="24" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">PERICOLO</text><text x="155" y="160" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">può far male</text><text x="155" y="185" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">(cavo per terra)</text><rect x="285" y="85" width="230" height="120" rx="10" fill="#fde8e8" stroke="#57606a" stroke-width="2"/><text x="400" y="125" font-size="24" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">DANNO</text><text x="400" y="160" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">ha fatto male</text><text x="400" y="185" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">davvero</text><rect x="530" y="85" width="230" height="120" rx="10" fill="#e3f7e3" stroke="#57606a" stroke-width="2"/><text x="645" y="125" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">PREVENZIONE</text><text x="645" y="160" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">PRIMA: succede</text><text x="645" y="185" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">meno spesso</text><rect x="40" y="225" width="230" height="120" rx="10" fill="#e8f0ff" stroke="#57606a" stroke-width="2"/><text x="155" y="265" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">PROTEZIONE</text><text x="155" y="300" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">DURANTE: fa</text><text x="155" y="325" font-size="18" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">meno male (casco)</text><rect x="285" y="225" width="475" height="120" rx="10" fill="#fff8d6" stroke="#57606a" stroke-width="2"/><text x="300" y="262" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Datore di lavoro = primo responsabile</text><text x="300" y="292" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">RLS = lo eleggono i colleghi</text><text x="300" y="322" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Medico competente = le visite</text><text x="400" y="395" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Leggi tutto, poi ricopia il riquadro giallo.</text><text x="30" y="445" font-size="18" fill="#d1242f" font-family="Arial,Helvetica,sans-serif">Schema disegnato, non uno screenshot</text></svg>