<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="La frase come un treno di pezzi" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><text x="360" y="50" font-size="21" fill="#1f2328" text-anchor="middle" font-weight="700">Una frase = pezzi di testo uniti con il +</text><rect x="20" y="90" width="138" height="70" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="3"/><text x="89.0" y="120" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">Edit1.Text</text><text x="89.0" y="147" font-size="15" fill="#1f6feb" text-anchor="middle" font-weight="700">= '7'</text><text x="166" y="132" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="700">+</text><rect x="176" y="90" width="190" height="70" rx="10" fill="#fff" stroke="#8c959f" stroke-width="3"/><text x="271.0" y="120" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">' km in metri sono '</text><text x="374" y="132" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="700">+</text><rect x="384" y="90" width="138" height="70" rx="10" fill="#fff" stroke="#1a7f37" stroke-width="3"/><text x="453.0" y="120" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">IntToStr(metri)</text><text x="453.0" y="147" font-size="15" fill="#1a7f37" text-anchor="middle" font-weight="700">= '7000'</text><text x="530" y="132" font-size="26" fill="#c0392b" text-anchor="middle" font-weight="700">+</text><rect x="540" y="90" width="138" height="70" rx="10" fill="#fff" stroke="#8c959f" stroke-width="3"/><text x="609.0" y="120" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="700">' metri'</text><line x1="360" y1="175" x2="360" y2="215" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><rect x="90" y="225" width="540" height="50" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/><text x="360" y="258" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="700">'7 km in metri sono 7000 metri'</text><text x="360" y="315" font-size="17" fill="#1f6feb" text-anchor="middle" font-weight="700">StrToInt: da testo a numero (per il conto)</text><text x="360" y="345" font-size="17" fill="#1a7f37" text-anchor="middle" font-weight="700">IntToStr: da numero a testo (per la frase)</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
