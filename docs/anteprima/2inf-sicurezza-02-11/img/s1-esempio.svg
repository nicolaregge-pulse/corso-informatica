<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Esempio: un finto tecnico del gas bussa e tu apri la porta"><rect width="520" height="300" rx="14" fill="#ffffff" stroke="#c9d1dc" stroke-width="2"/><text x="260" y="34" font-size="24" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700">Esempio: il finto uomo del gas</text><rect x="30" y="60" width="130" height="190" rx="12" fill="#cfe3ff" stroke="#1f2328" stroke-width="3"/><circle cx="140" cy="160" r="7" fill="#1f2328"/><text x="95" y="285" font-size="18" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif">La tua porta</text><circle cx="250" cy="90" r="22" fill="#c0392b"/><path d="M216 160 Q216 118 250 118 Q284 118 284 160 Z" fill="#c0392b"/><rect x="300" y="70" width="200" height="70" rx="12" fill="#fff4c2" stroke="#1f2328" stroke-width="3"/><text x="400" y="100" font-size="20" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif">«Sono del gas,</text><text x="400" y="126" font-size="20" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif">devo controllare!»</text><line x1="250" y1="190" x2="182" y2="190" stroke="#2da44e" stroke-width="5"/><polygon points="170,190 186,180 186,200" fill="#2da44e"/><text x="330" y="205" font-size="22" fill="#c0392b" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700">Tu apri.</text><text x="330" y="236" font-size="18" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif">La porta era forte.</text><text x="330" y="262" font-size="18" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700">Hai aperto tu.</text></svg>