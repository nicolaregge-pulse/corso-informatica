<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img" aria-label="Il ladro ha la password ma non il telefono con il codice, quindi non entra"><rect width="520" height="260" rx="14" fill="#ffffff" stroke="#c9d1dc" stroke-width="2"/><text x="260" y="30" font-size="24" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700">Verifica in due passaggi (2FA)</text><circle cx="60" cy="66" r="22" fill="#c0392b"/><path d="M26 136 Q26 94 60 94 Q94 94 94 136 Z" fill="#c0392b"/><text x="60" y="162" font-size="20" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700">Ladro</text><rect x="130" y="60" width="130" height="44" rx="12" fill="#ffd9d2" stroke="#1f2328" stroke-width="3"/><text x="195" y="89" font-size="18" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif">ha la password</text><line x1="265" y1="82" x2="318" y2="82" stroke="#1f2328" stroke-width="5"/><polygon points="330,82 314,72 314,92" fill="#1f2328"/><path d="M359 84 v-14 a22 22 0 0 1 44 0 v14" fill="none" stroke="#1f2328" stroke-width="7"/><rect x="345" y="80" width="72" height="56" rx="12" fill="#2da44e" stroke="#1f2328" stroke-width="3"/><rect x="330" y="140" width="170" height="52" rx="12" fill="#fff4c2" stroke="#1f2328" stroke-width="3"/><text x="415" y="164" font-size="18" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700">Chiede il codice</text><text x="415" y="184" font-size="18" fill="#1f2328" text-anchor="middle" font-family="system-ui,Arial,sans-serif">sul TUO telefono</text><rect x="60" y="150" width="56" height="100" rx="10" fill="#e8f0fe" stroke="#1f2328" stroke-width="3"/><rect x="68" y="162" width="40" height="64" fill="#fff" stroke="#1f2328" stroke-width="2"/><circle cx="88" cy="238" r="5" fill="#1f2328"/><line x1="173" y1="193" x2="217" y2="237" stroke="#c0392b" stroke-width="9"/><line x1="173" y1="237" x2="217" y2="193" stroke="#c0392b" stroke-width="9"/><text x="300" y="236" font-size="19" fill="#2da44e" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-weight="700">Il ladro non ha il telefono: NON entra.</text></svg>