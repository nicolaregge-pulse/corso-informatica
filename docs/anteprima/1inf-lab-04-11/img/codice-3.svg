<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Il codice dell&#x27;ora 3"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1242f"/></marker></defs><rect width="800" height="470" fill="#eef1f4"/><rect x="10" y="10" width="780" height="450" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><rect x="10" y="10" width="780" height="34" rx="10" fill="#d0d7de" stroke="#57606a" stroke-width="3"/><text x="24" y="35" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Il codice dell&#x27;ora 3</text><rect x="40" y="70" width="720" height="328" rx="6" fill="#0d1117" stroke="#57606a" stroke-width="2"/><text x="54" y="100" font-size="18" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Consolas,Menlo,monospace">procedure TForm1.Button1Click(Sender: TObject);</text><text x="54" y="128" font-size="18" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Consolas,Menlo,monospace">var</text><text x="54" y="156" font-size="18" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Consolas,Menlo,monospace">  prezzo, dati, resto, b10, b5, m2, m1: Integer;</text><text x="54" y="184" font-size="18" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Consolas,Menlo,monospace">begin</text><text x="54" y="212" font-size="18" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Consolas,Menlo,monospace">  prezzo := StrToIntDef(Edit2.Text, 0);</text><text x="54" y="240" font-size="18" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Consolas,Menlo,monospace">  dati := StrToIntDef(Edit3.Text, 0);</text><text x="54" y="268" font-size="18" fill="#e6edf3" font-weight="normal" text-anchor="start" font-family="Consolas,Menlo,monospace">  resto := dati - prezzo;</text><text x="54" y="296" font-size="18" fill="#e6edf3" font-wei