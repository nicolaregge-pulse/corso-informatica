<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Chi ha finito"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1242f"/></marker></defs><rect width="800" height="470" fill="#eef1f4"/><rect x="10" y="10" width="780" height="450" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><rect x="10" y="10" width="780" height="34" rx="10" fill="#d0d7de" stroke="#57606a" stroke-width="3"/><text x="24" y="35" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Chi ha finito</text><rect x="80" y="90" width="640" height="100" rx="6" fill="#fff8d6" stroke="#57606a" stroke-width="2"/><text x="94" y="122" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Rileggi le schede che</text><text x="94" y="150" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">hai sbagliato nel quiz</text><rect x="80" y="230" width="640" height="60" rx="6" fill="#fff8d6" stroke="#57606a" stroke-width="2"/><text x="94" y="262" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Poi guarda il tuo andamento</text><rect x="75" y="85" width="650" height="110" rx="10" fill="none" stroke="#d1242f" stroke-width="5"/><text x="30" y="420" font-size="20" fill="#d1242f" font-weight="bold" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Aspetta il Prof senza uscire</text></svg>