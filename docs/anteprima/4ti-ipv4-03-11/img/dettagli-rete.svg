<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Schema: Centro connessioni di rete, clic sulla connessione, bottone Dettagli" font-family="Segoe UI,Arial,sans-serif"><rect width="640" height="300" fill="#fff" stroke="#c9d1da" rx="12"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="700">Senza scrivere comandi: 3 clic</text><rect x="14" y="44" width="190" height="170" rx="8" fill="#f3f6fa" stroke="#222" stroke-width="2"/><text x="24" y="68" font-size="14" font-weight="700">1. Tasto Windows</text><text x="24" y="90" font-size="13">scrivi:</text><rect x="24" y="98" width="170" height="26" rx="4" fill="#fff" stroke="#888"/><text x="30" y="116" font-size="13">Centro connessioni di rete</text><text x="24" y="150" font-size="13">e premi Invio</text><rect x="225" y="44" width="190" height="170" rx="8" fill="#f3f6fa" stroke="#222" stroke-width="2"/><text x="235" y="68" font-size="14" font-weight="700">2. Clicca il nome blu</text><text x="235" y="90" font-size="13">accanto a «Connessioni:»</text><text x="235" y="130" font-size="15" fill="#0b57d0" text-decoration="underline">Ethernet</text><rect x="228" y="112" width="84" height="26" rx="4" fill="none" stroke="#ff4d4d" stroke-width="4"/><rect x="436" y="44" width="190" height="170" rx="8" fill="#f3f6fa" stroke="#222" stroke-width="2"/><text x="446" y="68" font-size="14" font-weight="700">3. Bottone «Dettagli…»</text><rect x="446" y="86" width="100" height="28" rx="4" fill="#e5e5e5" stroke="#222"/><text x="496" y="105" text-anchor="middle" font-size="14">Dettagli…</text><rect x="442" y="82" width="108" height="36" rx="5" fill="none" stroke="#ff4d4d" stroke-width="4"/><text x="446" y="150" font-size="12">Vedi: Indirizzo IPv4,</text><text x="446" y="166" font-size="12">Maschera, Gateway,</text><text x="446" y="182" font-size="12">Server DNS, DHCP</text><text x="320" y="248" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">Ti servono questi numeri per le schede</text><text x="320" y="272" text-anchor="middle" font-size="13" fill="#555">Schema disegnato, non uno screenshot. Se la parola è in inglese, la pagina è la stessa.</text></svg>