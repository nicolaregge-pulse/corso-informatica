<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="Schema del Prompt dei comandi: scrivi ipconfig e cerca la riga Indirizzo IPv4" font-family="Segoe UI,Arial,sans-serif"><rect width="640" height="300" fill="#fff" stroke="#c9d1da" rx="12"/><rect x="20" y="20" width="600" height="220" rx="8" fill="#111"/><rect x="20" y="20" width="600" height="26" rx="8" fill="#444"/><text x="34" y="38" font-size="14" fill="#fff">Prompt dei comandi</text><text x="34" y="74" font-family="Consolas,monospace" font-size="16" fill="#ddd">C:\Users\tuo-nome&gt; </text><text x="196" y="74" font-family="Consolas,monospace" font-size="16" fill="#ffe066" font-weight="700">ipconfig</text><text x="34" y="112" font-family="Consolas,monospace" font-size="15" fill="#aaa">Scheda Ethernet:</text><text x="34" y="140" font-family="Consolas,monospace" font-size="15" fill="#aaa">   Indirizzo IPv6 . . . . : fe80::...</text><rect x="26" y="152" width="588" height="28" rx="6" fill="none" stroke="#ff4d4d" stroke-width="4"/><text x="34" y="172" font-family="Consolas,monospace" font-size="15" fill="#fff" font-weight="700">   Indirizzo IPv4 . . . . : 192.168.38.70</text><text x="34" y="204" font-family="Consolas,monospace" font-size="15" fill="#aaa">   Subnet mask  . . . . . : 255.255.255.0</text><text x="34" y="228" font-family="Consolas,monospace" font-size="15" fill="#aaa">   Gateway predefinito  . : 192.168.38.254</text><text x="320" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#c0392b">1) scrivi ipconfig e premi Invio  2) cerca la riga col riquadro rosso: è il tuo numero</text><text x="320" y="288" text-anchor="middle" font-size="13" fill="#555">I numeri qui sono un esempio: i tuoi saranno diversi.</text></svg>
