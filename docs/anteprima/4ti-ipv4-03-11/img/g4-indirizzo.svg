<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="Schema: clicca il messaggio dell ultimo commit e copia l indirizzo dalla barra" font-family="Segoe UI,Arial,sans-serif"><rect width="640" height="220" fill="#fff" stroke="#c9d1da" rx="12"/><rect x="20" y="16" width="600" height="34" rx="17" fill="#f1f3f4" stroke="#222" stroke-width="2"/><text x="40" y="38" font-size="14" fill="#333">https://github.com/tuo-nome/progetto/commit/a1b2c3d</text><rect x="30" y="20" width="440" height="26" rx="13" fill="none" stroke="#ff4d4d" stroke-width="4"/><text x="480" y="38" font-size="13" fill="#c0392b" font-weight="700">&#8592; questo è l'indirizzo</text><rect x="20" y="70" width="600" height="80" rx="8" fill="#f6f8fa" stroke="#222" stroke-width="2"/><text x="36" y="98" font-size="13" fill="#555">L'ultima riga in alto, col tuo messaggio:</text><text x="36" y="128" font-size="16" fill="#0b57d0" text-decoration="underline" font-weight="700">Rete: aggiunta la sezione su IPv4 e gateway</text><rect x="28" y="108" width="400" height="28" rx="5" fill="none" stroke="#ff4d4d" stroke-width="4"/><text x="320" y="180" text-anchor="middle" font-size="14" font-weight="700">Clicca quel messaggio blu: poi l'indirizzo in alto è quello del tuo commit</text><text x="320" y="204" text-anchor="middle" font-size="13" fill="#555">Schema disegnato, non uno screenshot.</text></svg>