<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-label="Schema: bottone verde in alto, finestra con il messaggio, bottone verde nella finestra" font-family="Segoe UI,Arial,sans-serif"><rect width="640" height="260" fill="#fff" stroke="#c9d1da" rx="12"/><rect x="20" y="16" width="600" height="46" rx="8" fill="#f6f8fa" stroke="#222" stroke-width="2"/><rect x="430" y="24" width="180" height="30" rx="6" fill="#1a7f37"/><text x="520" y="45" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">Commit changes…</text><rect x="424" y="20" width="192" height="38" rx="7" fill="none" stroke="#ff4d4d" stroke-width="4"/><text x="36" y="45" font-size="15" font-weight="700">1. Premi il bottone verde in alto a destra</text><rect x="120" y="76" width="400" height="150" rx="10" fill="#fff" stroke="#222" stroke-width="3"/><text x="136" y="100" font-size="14" font-weight="700">2. Si apre una finestra: scrivi il messaggio</text><rect x="136" y="110" width="368" height="30" rx="4" fill="#fffbe0" stroke="#888"/><text x="144" y="130" font-size="13">Rete: aggiunta la sezione su IPv4 e gateway</text><text x="136" y="170" font-size="14" font-weight="700">3. Poi il bottone verde nella finestra</text><rect x="136" y="180" width="150" height="30" rx="6" fill="#1a7f37"/><text x="211" y="200" text-anchor="middle" font-size="14" fill="#fff" font-weight="700">Commit changes</text><rect x="131" y="175" width="160" height="40" rx="7" fill="none" stroke="#ff4d4d" stroke-width="4"/><text x="320" y="250" text-anchor="middle" font-size="13" fill="#555">Schema disegnato, non uno screenshot. Se il sito è in italiano: «Salva le modifiche».</text></svg>