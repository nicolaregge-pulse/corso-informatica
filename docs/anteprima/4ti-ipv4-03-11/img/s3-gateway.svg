<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Il gateway collega la rete a Internet; il DHCP assegna i numeri; il DNS traduce i nomi" font-family="Segoe UI,Arial,sans-serif"><rect width="640" height="200" fill="#fff" stroke="#c9d1da" rx="12"/><rect x="20" y="60" width="130" height="80" rx="10" fill="#d9f4dc" stroke="#222" stroke-width="3"/><text x="85" y="96" text-anchor="middle" font-size="18" font-weight="700">Il tuo PC</text><text x="85" y="118" text-anchor="middle" font-size="14">192.168.38.70</text><line x1="150" y1="100" x2="235" y2="100" stroke="#222" stroke-width="3"/><polygon points="235,100 225,94 225,106" fill="#222"/><rect x="240" y="60" width="150" height="80" rx="10" fill="#fff3cd" stroke="#222" stroke-width="3"/><text x="315" y="96" text-anchor="middle" font-size="18" font-weight="700">Gateway</text><text x="315" y="118" text-anchor="middle" font-size="14">192.168.38.254</text><line x1="390" y1="100" x2="470" y2="100" stroke="#222" stroke-width="3"/><polygon points="470,100 460,94 460,106" fill="#222"/><rect x="475" y="60" width="145" height="80" rx="10" fill="#e7f1ff" stroke="#222" stroke-width="3"/><text x="547" y="96" text-anchor="middle" font-size="18" font-weight="700">Altre reti</text><text x="547" y="118" text-anchor="middle" font-size="14">Internet</text><text x="320" y="30" text-anchor="middle" font-size="16">Per uscire dalla tua rete i pacchetti passano dal gateway</text><text x="130" y="170" text-anchor="middle" font-size="14">DHCP: ti dà questi numeri da solo</text><text x="480" y="170" text-anchor="middle" font-size="14">DNS: trasforma i nomi in numeri</text></svg>