<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="Tre passi: modifica, messaggio, commit" font-family="Segoe UI,Arial,sans-serif"><rect width="640" height="200" fill="#fff" stroke="#c9d1da" rx="12"/><rect x="15" y="60" width="140" height="80" rx="10" fill="#fff3cd" stroke="#222" stroke-width="3"/><text x="85" y="96" text-anchor="middle" font-size="18" font-weight="700">1. Modifica</text><text x="85" y="118" text-anchor="middle" font-size="14">il file del progetto</text><line x1="155" y1="100" x2="205" y2="100" stroke="#222" stroke-width="3"/><polygon points="205,100 195,94 195,106" fill="#222"/><rect x="210" y="60" width="140" height="80" rx="10" fill="#e7f1ff" stroke="#222" stroke-width="3"/><text x="280" y="96" text-anchor="middle" font-size="18" font-weight="700">2. Messaggio</text><text x="280" y="118" text-anchor="middle" font-size="14">chiaro e breve</text><line x1="350" y1="100" x2="400" y2="100" stroke="#222" stroke-width="3"/><polygon points="400,100 390,94 390,106" fill="#222"/><rect x="405" y="60" width="215" height="80" rx="10" fill="#d9f4dc" stroke="#222" stroke-width="3"/><text x="512" y="96" text-anchor="middle" font-size="18" font-weight="700">3. Commit</text><text x="512" y="118" text-anchor="middle" font-size="14">e salvi su GitHub</text><text x="320" y="170" text-anchor="middle" font-size="15">Esempio di messaggio: «Rete: aggiunta la sezione su IPv4 e gateway»</text></svg>