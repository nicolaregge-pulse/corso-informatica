<rect width="800" height="360" fill="#eef1f4"/><rect x="10" y="10" width="780" height="340" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><rect x="10" y="10" width="780" height="34" rx="10" fill="#d0d7de" stroke="#57606a" stroke-width="3"/><text x="24" y="35" font-size="18" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Blocco note · server.txt</text><rect x="40" y="60" width="720" height="70" rx="4" fill="#fff" stroke="#8c959f" stroke-width="2"/><text x="60" y="108" font-size="34" fill="#0b6e99" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">192.168.10.5:5050</text><rect x="50" y="66" width="420" height="58" rx="10" fill="none" stroke="#d1242f" stroke-width="5" stroke-dasharray="10 6"/><text x="40" y="170" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Una sola riga: IP del PC del Prof, due punti, porta.</text><text x="40" y="210" font-size="20" fill="#1f2328"  text-anchor="start" font-family="Segoe UI,Arial,sans-serif">L'IP lo scrive il Prof alla lavagna (questo è solo un esempio).</text><text x="40" y="250" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">La porta è 5050.</text><text x="40" y="290" font-size="20" fill="#1f2328"  text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Salva il file con nome server.txt, accanto al programma.</text><text x="40" y="325" font-size="20" fill="#6e40c9" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Per provare da solo sul tuo PC: 127.0.0.1:5050</text></svg>