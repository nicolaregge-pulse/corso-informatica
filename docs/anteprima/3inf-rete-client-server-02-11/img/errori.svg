<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="Connessione rifiutata contro timeout">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d1242f"/></marker></defs>
<rect width="800" height="360" fill="#eef1f4"/><rect x="10" y="10" width="780" height="340" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><rect x="10" y="10" width="780" height="34" rx="10" fill="#d0d7de" stroke="#57606a" stroke-width="3"/><text x="24" y="35" font-size="18" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Che cosa vedi sul client</text><text x="40" y="80" font-size="24" fill="#b45309" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">A) Risposta SUBITO: «connessione rifiutata»</text><rect x="40" y="100" width="150" height="90" rx="10" fill="#dbeafe" stroke="#57606a" stroke-width="3"/><rect x="90" y="190" width="50" height="14" rx="10" fill="#9aa5b1" stroke="#57606a" stroke-width="3"/><rect x="70" y="204" width="90" height="10" rx="10" fill="#57606a" stroke="#57606a" stroke-width="3"/><text x="115" y="155" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">CLIENT</text><rect x="600" y="100" width="150" height="90" rx="10" fill="#dcfce7" stroke="#57606a" stroke-width="3"/><rect x="650" y="190" width="50" height="14" rx="10" fill="#9aa5b1" stroke="#57606a" stroke-width="3"/><rect x="630" y="204" width="90" height="10" rx="10" fill="#57606a" stroke="#57606a" stroke-width="3"/><text x="675" y="155" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">PC server</text><line x1="195" y1="150" x2="595" y2="150" stroke="#d1242f" stroke-width="5" marker-end="url(#ar)"/><text x="395" y="140" font-size="18" fill="#1f2328"  text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">chiedo la porta 5000</text><line x1="595" y1="185" x2="200" y2="185" stroke="#b42318" stroke-width="5" marker-end="url(#ar)"/><text x="395" y="215" font-size="18" fill="#b42318" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">«qui non ascolta nessuno» (rifiutata)</text><text x="40" y="265" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">Causa: il SERVER non è avviato oppure la PORTA è sbagliata.</text><text x="40" y="310" font-size="21" fill="#6e40c9" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">B) Silenzio, poi dopo molti secondi «timeout»: l'IP è sbagliato o un FIREWALL blocca.</text></svg>