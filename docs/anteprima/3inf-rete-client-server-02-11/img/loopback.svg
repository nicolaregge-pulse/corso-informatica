<rect width="800" height="360" fill="#eef1f4"/><rect x="10" y="10" width="780" height="340" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><rect x="10" y="10" width="780" height="34" rx="10" fill="#d0d7de" stroke="#57606a" stroke-width="3"/><text x="24" y="35" font-size="18" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Segoe UI,Arial,sans-serif">127.0.0.1 = loopback: tutto dentro il tuo PC</text><rect x="60" y="70" width="680" height="250" rx="10" fill="#f0f9ff" stroke="#0b6e99" stroke-width="4"/><text x="400" y="105" font-size="20" fill="#0b6e99" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">UN SOLO COMPUTER</text><rect x="100" y="130" width="220" height="90" rx="10" fill="#dbeafe" stroke="#57606a" stroke-width="3"/><text x="210" y="185" font-size="24" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">CLIENT</text><rect x="480" y="130" width="220" height="90" rx="10" fill="#dcfce7" stroke="#57606a" stroke-width="3"/><text x="590" y="185" font-size="24" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">SERVER</text><line x1="322" y1="175" x2="478" y2="175" stroke="#d1242f" stroke-width="5" marker-end="url(#ar)"/><text x="400" y="160" font-size="18" fill="#1f2328"  text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">127.0.0.1:5050</text><text x="400" y="260" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">I dati girano nel sistema operativo.</text><text x="400" y="295" font-size="20" fill="#1f2328"  text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">Non escono dalla scheda di rete, non toccano il cavo.</text></svg>