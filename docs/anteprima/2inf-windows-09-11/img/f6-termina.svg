<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Gestione attività · Termina attività" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="20" y="18" width="680" height="362" rx="8" fill="#fff" stroke="#8c959f" stroke-width="2"/><rect x="20" y="18" width="680" height="34" rx="8" fill="#1f6feb"/><rect x="20" y="40" width="680" height="12" fill="#1f6feb"/><text x="36" y="41" font-size="17" fill="#fff" text-anchor="start" font-weight="700">Gestione attività · Termina attività</text><text x="36" y="85" font-size="14" fill="#1f2328" text-anchor="start" font-weight="700">Nome                       CPU     Memoria ▼</text><rect x="36" y="100" width="600" height="30" rx="4" fill="#fff" stroke="#d0d7de" stroke-width="1"/><text x="46" y="121" font-size="15" fill="#1f2328" text-anchor="start">Blocco note                    0%       3 MB</text><rect x="36" y="134" width="600" height="30" rx="4" fill="#ddf4ff" stroke="#c0392b" stroke-width="3"/><text x="46" y="155" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">Paint                              0%       25 MB</text><rect x="420" y="300" width="200" height="36" rx="6" fill="#1a7f37" stroke="#c0392b" stroke-width="4"/><text x="520.0" y="324" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">Termina attività</text><text x="36" y="190" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">1. Clicca Paint (che hai aperto tu).</text><text x="36" y="220" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">2. Premi «Termina attività».</text><text x="36" y="250" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">Solo Paint: nessun altro processo.</text><text x="712" y="3