<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Accesso a Windows" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="20" y="18" width="680" height="362" rx="8" fill="#fff" stroke="#8c959f" stroke-width="2"/><rect x="20" y="18" width="680" height="34" rx="8" fill="#1f6feb"/><rect x="20" y="40" width="680" height="12" fill="#1f6feb"/><text x="36" y="41" font-size="17" fill="#fff" text-anchor="start" font-weight="700">Accesso a Windows</text><text x="40" y="100" font-size="17" fill="#1f2328" text-anchor="start">1. Clicca l'omino, poi «Esci».</text><text x="40" y="135" font-size="17" fill="#1f2328" text-anchor="start" font-weight="700">2. Scegli REGGE e premi Invio.</text><text x="40" y="200" font-size="16" fill="#c0392b" text-anchor="start" font-weight="700">REGGE non ha la password.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
