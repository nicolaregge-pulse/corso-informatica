<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-label="Trova l'errore: testo più testo attacca, StrToInt fa la somma vera"><rect width="600" height="350" fill="#ffffff"/><rect x="10" y="10" width="580" height="330" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="3"/><rect x="10" y="10" width="580" height="40" rx="12" fill="#d0d7de" stroke="#57606a" stroke-width="3"/><text x="26" y="38" font-size="21" font-weight="bold" fill="#1f2328" font-family="Arial,Helvetica,'Noto Sans',sans-serif">Trova l'errore</text>
<rect x="30" y="70" width="540" height="110" rx="10" fill="#ffe0e0" stroke="#c0392b" stroke-width="3"/><text x="50" y="102" font-size="20" fill="#1f2328" font-family="Arial,Helvetica,'Noto Sans',sans-serif">Edit1.Text + Edit2.Text</text><text x="50" y="134" font-size="20" fill="#1f2328" font-family="Arial,Helvetica,'Noto Sans',sans-serif">'5' + '3' = '53'</text><text x="530" y="140" font-size="54" fill="#c0392b" text-anchor="end" font-weight="bold" font-family="Arial,Helvetica,'Noto Sans',sans-serif">✘</text><text x="50" y="166" font-size="17" fill="#5b0f0f" font-family="Arial,Helvetica,'Noto Sans',sans-serif">due testi: il + li attacca</text>
<rect x="30" y="200" width="540" height="120" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="3"/><text x="50" y="232" font-size="18" fill="#1f2328" font-family="Arial,Helvetica,'Noto Sans',sans-serif">StrToInt(Edit1.Text) + StrToInt(Edit2.Text)</text><text x="50" y="266" font-size="20" fill="#1f2328" font-family="Arial,Helvetica,'Noto Sans',sans-serif">5 + 3 = 8</text><text x="530" y="276" font-size="54" fill="#1a7f37" text-anchor="end" font-weight="bold" font-family="Arial,Helvetica,'Noto Sans',sans-serif">✔</text><text x="50" y="300" font-size="17" fill="#0f3d1c" font-family="Arial,Helvetica,'Noto Sans',sans-serif">prima StrToInt, poi il conto, poi IntToStr</text></svg>
