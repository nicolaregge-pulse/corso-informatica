<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Recuperi"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d1242f"/></marker></defs><rect width="800" height="470" fill="#eef1f4"/><rect x="10" y="10" width="780" height="450" rx="10" fill="#fff" stroke="#57606a" stroke-width="3"/><rect x="10" y="10" width="780" height="34" rx="10" fill="#d0d7de" stroke="#57606a" stroke-width="3"/><text x="24" y="35" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Recuperi</text><rect x="80" y="90" width="640" height="100" rx="6" fill="#fff8d6" stroke="#57606a" stroke-width="2"/><text x="94" y="122" font-size="20" fill="#1f2328" font-weight="bold" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Nel cruscotto, accanto al tuo nome:</text><text x="94" y="150" font-size="20" fill="#1f2328" font-weight="normal" text-anchor="start" font-family="Arial,Helvetica,sans-serif">«da recuperare» e l&#x27;ora</text><rect x="160" y="240" width="480" height="44" rx="6" fill="#e1e1e1" stroke="#57606a" stroke-width="2"/><text x="400" y="270" font-size="21" fill="#1f2328" font-weight="bold" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Quiz dell&#x27;ora che manca</text><rect x="75" y="85" width="650" height="110" rx="10" fill="none" stroke="#d1242f" stroke-width="5"/><rect x="155" y="235" width="490" height="54" rx="10" fill="none" stroke="#d1242f" stroke-width="5"/><text x="30" y="420" font-size="20" fill="#d1242f" font-weight="bold" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Apri SOLO il quiz dell&#x27;ora che ti manca</text></svg>