<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="tavolo" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="60" y="210" width="600" height="120" rx="8" fill="#e9d8b4" stroke="#a47d1a" stroke-width="3"/><text x="360" y="350" font-size="16" fill="#5c4400" text-anchor="middle" font-weight="700">il vostro tavolo</text><rect x="260" y="228" width="200" height="70" rx="6" fill="#fff" stroke="#1f6feb" stroke-width="2"/><rect x="285" y="252" width="150" height="24" rx="2" fill="#1b4332" stroke="#081c15" stroke-width="1"/><text x="360" y="292" font-size="15" fill="#1f6feb" text-anchor="middle" font-weight="700">qui la RAM</text><text x="360" y="80" font-size="22" fill="#1f2328" text-anchor="middle" font-weight="700">Si toglie solo la RAM.</text><text x="360" y="115" font-size="18" fill="#1f2328" text-anchor="middle">Disco e DVD restano nel rack: si staccano solo i cavi.</text><text x="360" y="160" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">Non servono attrezzi: niente viti, solo leve, ganci e clic.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
