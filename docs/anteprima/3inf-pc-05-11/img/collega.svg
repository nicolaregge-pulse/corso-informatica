e</text><text x="430" y="150" font-size="19" fill="#1f2328" text-anchor="start" font-weight="700">Chiudi il case</text><text x="430" y="180" font-size="18" fill="#1f2328" text-anchor="start">finché fa clic.</text><text x="430" y="230" font-size="19" fill="#1f2328" text-anchor="start" font-weight="700">Poi attacca i cavi:</text><text x="430" y="260" font-size="18" fill="#c0392b" text-anchor="start" font-weight="700">la corrente per ultima.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
