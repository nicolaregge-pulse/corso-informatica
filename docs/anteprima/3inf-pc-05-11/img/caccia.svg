<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="caccia al guasto" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><text x="360" y="50" font-size="20" fill="#1f2328" text-anchor="middle" font-weight="700">Caccia al guasto: 4 mosse</text><rect x="30" y="120" width="150" height="120" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="3"/><circle cx="52" cy="120" r="16" fill="#1f6feb"/><text x="52" y="126" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="105" y="172" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">Sintomo</text><text x="105" y="205" font-size="13" fill="#57606a" text-anchor="middle">che cosa vedo?</text><line x1="182" y1="180" x2="200" y2="180" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><rect x="202" y="120" width="150" height="120" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="3"/><circle cx="224" cy="120" r="16" fill="#1f6feb"/><text x="224" y="126" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="277" y="172" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">Ipotesi</text><text x="277" y="205" font-size="13" fill="#57606a" text-anchor="middle">che cosa può essere?</text><line x1="354" y1="180" x2="372" y2="180" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><rect x="374" y="120" width="150" height="120" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="3"/><circle cx="396" cy="120" r="16" fill="#1f6feb"/><text x="396" y="126" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="449" y="172" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">Prova</text><text x="449" y="205" font-size="13" fill="#57606a" text-anchor="middle">controllo UNA cosa</text><line x1="526" y1="180" x2="544" y2="180" stroke="#c0392b" stroke-width="4" marker-end="url(#fr)"/><rect x="546" y="120" width="150" height="120" rx="10" fill="#fff" stroke="#1f6feb" stroke-width="3"/><circle cx="568" cy="120" r="16" fill="#1f6feb"/><text x="568" y="126" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="621" y="172" font-size="19" fill="#1f2328" text-anchor="middle" font-weight="700">Soluzione</text><text x="621" y="205" font-size="13" fill="#57606a" text-anchor="middle">riparo e riprovo</text><text x="360" y="300" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="700">La prova non funziona? Torna al passo 2 con un'altra ipotesi.</text><text x="360" y="335" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">Prima di aprire il case: PC spento e spina staccata.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
