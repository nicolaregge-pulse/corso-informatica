<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="rete" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="280" y="60" width="160" height="50" rx="6" fill="#e6edf3" stroke="#57606a" stroke-width="2"/><text x="360" y="92" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="700">SWITCH</text><line x1="110" y1="210" x2="360" y2="110" stroke="#1a7f37" stroke-width="4"/><rect x="15" y="210" width="190" height="80" rx="8" fill="#fff" stroke="#57606a" stroke-width="2"/><text x="110" y="238" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="700">PC accanto (banco 1)</text><text x="110" y="270" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="700">192.168.10.11</text><line x1="360" y1="210" x2="360" y2="110" stroke="#1a7f37" stroke-width="4"/><rect x="265" y="210" width="190" height="80" rx="8" fill="#ddf4ff" stroke="#c0392b" stroke-width="4"/><text x="360" y="238" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="700">Il vostro PC (banco 2)</text><text x="360" y="270" font-size="17" fill="#c0392b" text-anchor="middle" font-weight="700">192.168.10.12</text><line x1="610" y1="210" x2="360" y2="110" stroke="#1a7f37" stroke-width="4"/><rect x="515" y="210" width="190" height="80" rx="8" fill="#fff" stroke="#57606a" stroke-width="2"/><text x="610" y="238" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="700">Altro PC (banco 3)</text><text x="610" y="270" font-size="17" fill="#1f2328" text-anchor="middle" font-weight="700">192.168.10.13</text><text x="40" y="320" font-size="15" fill="#1f2328" text-anchor="start" font-weight="700">Indirizzo IP: le prime 3 parti UGUALI (stessa rete), l'ultima DIVERSA (ogni PC il suo).</text><text x="40" y="345" font-size="15" fill="#1f2328" text-anchor="start">Maschera 255.255.255.0 = le prime 3 parti dicono la rete.</text><text x="40" y="370" font-size="15" fill="#1f2328" text-anchor="start">Gateway = la porta verso fuori (router).  DNS = la rubrica dei nomi (google.com).</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
