<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="tasti-bios" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs><rect width="720" height="400" fill="#f4f6f9"/><rect x="70" y="150" width="90" height="70" rx="10" fill="#fff" stroke="#c0392b" stroke-width="4"/><text x="115" y="195" font-size="24" fill="#c0392b" text-anchor="middle" font-weight="700">Canc</text><rect x="190" y="150" width="90" height="70" rx="10" fill="#fff" stroke="#c0392b" stroke-width="4"/><text x="235" y="195" font-size="24" fill="#c0392b" text-anchor="middle" font-weight="700">F2</text><rect x="310" y="150" width="90" height="70" rx="10" fill="#fff" stroke="#57606a" stroke-width="2"/><text x="355" y="195" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="700">F12</text><rect x="430" y="150" width="90" height="70" rx="10" fill="#fff" stroke="#57606a" stroke-width="2"/><text x="475" y="195" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="700">Esc</text><rect x="550" y="150" width="90" height="70" rx="10" fill="#fff" stroke="#57606a" stroke-width="2"/><text x="595" y="195" font-size="24" fill="#1f2328" text-anchor="middle" font-weight="700">F10</text><text x="360" y="80" font-size="18" fill="#1f2328" text-anchor="middle" font-weight="700">Accendi e premi SUBITO, più volte, il tasto del BIOS:</text><text x="360" y="110" font-size="17" fill="#1f2328" text-anchor="middle">di solito Canc (Del) oppure F2. Lo scrive lo schermo all'avvio.</text><text x="360" y="270" font-size="17" fill="#1f2328" text-anchor="middle">F12 (o Esc) = menu di avvio: scegli da dove parte il PC, una volta sola.</text><text x="360" y="300" font-size="17" fill="#1f2328" text-anchor="middle">F10 = salva ed esci dal BIOS.</text><text x="712" y="394" font-size="11" fill="#6e7781" text-anchor="end">schema disegnato</text></svg>
