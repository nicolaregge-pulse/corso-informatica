<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="data:,">
<title>Copia la pagina Presenze stage</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14202b;--mut:#4a5968;--line:#cdd5dd;--acc:#0b57d0;--accd:#fff;--ok:#0a7a3d;--ko:#a32020}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#1a232c;--ink:#e8eef4;--mut:#a9b7c4;--line:#33424f;--acc:#8ab4f8;--accd:#10161c;--ok:#7fd69b;--ko:#ff9b9b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-wrap:anywhere}
main{max-width:640px;margin:0 auto;padding:14px 16px 60px}h1{font-size:26px;line-height:1.2;margin:8px 0}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
label{display:block;font-weight:700;margin:12px 0 4px}select{width:100%;min-height:52px;font:inherit;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{display:block;text-align:center;text-decoration:none;min-height:52px;padding:12px 16px;border-radius:12px;border:2px solid var(--acc);background:var(--acc);color:var(--accd);font-weight:700;font-size:18px;font-family:inherit;cursor:pointer;margin-top:12px;width:100%}
.btn.sec{background:transparent;color:var(--acc)}.msg{font-weight:700;min-height:26px}.msg.ko{color:var(--ko)}.msg.ok{color:var(--ok)}.small{color:var(--mut);font-size:15px}
</style></head><body><main>
<h1>Copia la pagina Presenze stage</h1>
<p>Questa pagina prepara il codice della tua pagina <b>Presenze stage</b>. Poi salvi il file <b>presenze.html</b> nella cartella del tuo sito.</p>
<section>
<label for="n">1. Scegli il tuo nome</label><select id="n"><option value="">Scegli...</option></select>
<button class="btn" id="d" type="button">2. Scarica il file presenze.html</button>
<p class="msg" id="m" role="status" aria-live="polite"></p>
<button class="btn sec" id="c" type="button">Oppure: copia il codice</button>
<label for="t" style="margin-top:16px">Il codice (se serve, premi dentro e usa Ctrl+A, poi Ctrl+C)</label>
<textarea id="t" rows="4" readonly style="width:100%%;font:14px monospace;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)"></textarea>
</section>
<p class="small">Il codice è pubblico. Non contiene password: la password la scegli tu la prima volta che premi «Modifica (solo io)».</p>
<script>
var N=["Alessandro A.","Denis A.","David A.","Eric C.","Nicolo' C.","Mirko D.","Ariel D.","Mahmoud E.","Rafi F.","Emmanuel F.","Andrea G.","Simone G.","Zhan L.","Tomas L.","Filippo M.","Beatrice N.","Kelvin P.","Kevin R.","Gabriele R.","Dani S.","Samuele U.","Noah V."];
var $=function(i){return document.getElementById(i)},n=$("n"),m=$("m"),cache=null;
N.forEach(function(x){var o=document.createElement("option");o.value=x;o.textContent=x;n.appendChild(o)});
function codice(){if(!n.value){m.className="msg ko";m.textContent="Scegli prima il tuo nome.";return Promise.resolve(null)}
 var p=cache?Promise.resolve(cache):fetch("presenze-allievo.html?t="+Date.now()).then(function(r){return r.text()}).then(function(t){cache=t;return t});
 return p.then(function(t){return t.replace('"@@ALLIEVO@@"',JSON.stringify(n.value))})}
$("c").addEventListener("click",function(){codice().then(function(t){if(!t)return;$("t").value=t;
 var ok=function(){m.className="msg ok";m.textContent="Copiato. Ora apri il Blocco note, incolla con Ctrl+V e salva il file con il nome presenze.html."},ko=function(){$("t").select();try{document.execCommand("copy");ok()}catch(e){m.className="msg ko";m.textContent="Non riesco a copiare. Usa il bottone per scaricare il file."}};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,ko);else ko()}).catch(function(){m.className="msg ko";m.textContent="Non riesco a leggere il codice. Riprova."})});
$("d").addEventListener("click",function(){codice().then(function(t){if(!t)return;var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/html"}));a.download="presenze.html";document.body.appendChild(a);a.click();document.body.removeChild(a);m.className="msg ok";m.textContent="Fatto. Il file presenze.html è nella cartella Download. Mettilo nella cartella del tuo sito."})});
</script></main></body></html>
