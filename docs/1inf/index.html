var VECCHIO=6*60*1000, GIRO=120*1000;
function h(t,a){var e=document.createElement(t);if(a)for(var k in a){if(k==='c')e.className=a[k];else if(k==='h')e.href=a[k];else e.setAttribute(k,a[k]);}
 for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null)continue;e.appendChild(typeof c==='string'?document.createTextNode(c):c);}return e;}
function L(k){var v=D.etichette[k];return Array.isArray(v)?v:[v];}
function lab(k,tag){var v=L(k);var e=h(tag||'span',null,v[0]);for(var i=1;i<v.length;i++){e.appendChild(h('span',{c:'sec'},v[i]));}return e;}
function eta(ms){var m=Math.max(0,Math.floor(ms/60000));if(m<60)return m+(m===1?' minuto':' minuti');var o=Math.floor(m/60);if(o<48)return o+(o===1?' ora':' ore')+' e '+(m%60)+(m%60===1?' minuto':' minuti');var g=Math.floor(o/24);return g+(g===1?' giorno':' giorni');}
function render(){
 var now=Date.now(), dato=new Date(D.dato.iso).getTime(), et=now-dato;
 document.title='Cruscotto '+D.classe+(DOC?' (docente)':'');
 var h1=document.getElementById('h1');h1.textContent='';h1.appendChild(lab('titolo'));h1.appendChild(document.createTextNode(' '+D.classe+(DOC?' - versione docente':'')));
 document.getElementById('lez').textContent='Lezione di riferimento: '+D.lezione.giorno_it+', ore '+D.lezione.ore.join(', ')+' ('+D.lezione.materia+')';
 document.getElementById('ora').textContent='Dato delle '+D.dato.ora.slice(0,5)+' del '+D.dato.giorno_it;
 document.getElementById('ora2').textContent='Ora del dato: '+D.dato.cosa+'. Controllo fatto alle '+new Date(now).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'. '+(DOC?'Questo file e\' fisso: per dati nuovi si rigenera con cruscotto_classe_v1_1.py.':'La pagina si aggiorna da sola ogni 2 minuti.');
 var b=document.getElementById('ban');
 if(et>VECCHIO){b.className='ban on';b.textContent='DATI VECCHI: il dato ha '+eta(et)+' (limite 6 minuti). Non sono dati in tempo reale.';}else{b.className='ban';b.textContent='';}
 var so=document.getElementById('sosp');if(D.lezione.sospesa){so.style.display='block';so.textContent=D.lezione.sospesa;}else so.style.display='none';
 // serve te
 var bs=document.getElementById('bs');bs.textContent='';bs.appendChild(lab('serve'));bs.appendChild(document.createTextNode(' ('+D.serve_te.length+')'));bs.className='serve'+(D.serve_te.length?'':' zero');
 var pan=document.getElementById('pan');pan.textContent='';
 if(D.serve_te.length){var ul=h('ul');D.serve_te.forEach(function(s){ul.appendChild(h('li',null,s.testo));});pan.appendChild(ul);}else pan.appendChild(h('p',null,'Nessuna criticità nei dati letti.'));
 bs.onclick=function(){pan.classList.toggle('on');};
 // kpi
 var k=document.getElementById('kpi');k.textContent='';D.kpi.forEach(function(x){k.appendChild(h('div',{c:'k'},h('span',{c:'mu'},x.nome),h('b',null,x.valore),h('span',{c:'sm'},x.nota)));});
 // presenti e assenti
 document.getElementById('hp').textContent='';document.getElementById('hp').appendChild(lab('presenti'));document.getElementById('hp').appendChild(document.createTextNode(' ('+D.presenti.length+')'));
 document.getElementById('ha').textContent='';document.getElementById('ha').appendChild(lab('assenti'));document.getElementById('ha').appendChild(document.createTextNode(' ('+D.assenti.length+')'));
 var pr=document.getElementById('pres');pr.textContent='';D.presenti.forEach(function(p){pr.appendChild(card(p,dato));});
 var as=document.getElementById('ass');as.textContent='';D.assenti.forEach(function(p){as.appendChild(card(p,dato));});
 if(!D.assenti.length)as.appendChild(h('p',{c:'mu'},'Nessun assente segnato da DIDAweb per questa lezione.'));
 // PC
 var pc=document.getElementById('pcs');pc.textContent='';
 if(D.pc&&D.pc.length){var t=h('table');var tr=h('tr');['PC','Utente','Stato','Tipo','Lazarus'].forEach(function(x){tr.appendChild(h('th',null,x));});t.appendChild(tr);
  D.pc.forEach(function(x){var r=h('tr');[x.pc+'',x.utente||'(non noto)',x.stato,x.tipo||'-',x.lazarus||'-'].forEach(function(c,i){var td=h('td',null,c);if(i==2&&c==='PROBLEMA')td.className='rosso';r.appendChild(td);});t.appendChild(r);});
  pc.appendChild(h('details',null,h('summary',null,'Stato dei PC dell\'aula ('+D.pc.length+')'),t));}
 var of=document.getElementById('of');of.textContent='';
 if(D.ore_fatte&&D.ore_fatte.length){var t2=h('table');var tr2=h('tr');['Materia','Ore fatte','Previste','Ultima data'].forEach(function(x){tr2.appendChild(h('th',null,x));});t2.appendChild(tr2);
  D.ore_fatte.forEach(function(x){t2.appendChild(h('tr',null,h('td',null,x.materia),h('td',null,x.fatte),h('td',null,x.previste),h('td',null,x.ultima)));});
  of.appendChild(h('details',null,h('summary',null,'Ore fatte'),t2));}
 var fo=document.getElementById('fonti');fo.textContent='';var ul2=h('ul');D.fonti.forEach(function(f){ul2.appendChild(h('li',null,f.nome+': '+f.ora));});fo.appendChild(ul2);
 fo.appendChild(h('p',null,'Lezione di riferimento: '+D.lezione.fonte+'.'));
 if(DOC&&D.docente){fo.appendChild(h('p',null,'Controllo delle assenze: '+D.docente.controllo_globale+'.'));fo.appendChild(h('p',null,'Controllo del voto proposto: '+D.docente.coerenza_voti+'.'));fo.appendChild(h('p',null,'Export Fabbrica letto: '+D.docente.export));D.docente.avvisi.forEach(function(x){fo.appendChild(h('p',{c:'rosso'},'AVVISO: '+x));});}
 document.getElementById('piede').textContent='Cruscotto v'+D.versione+'. I voti proposti sono proposte dell\'assistente: il docente le conferma. '+(DOC?'Versione per il docente: contiene cognomi e note, NON va nel sito.':'Nel sito i ragazzi compaiono solo con nome e iniziale.');
}
function card(p,dato){
 var cl=p.presenza==='assente'?'no':(p.presenza==='da_verificare'||p.presenza==='parziale'?'al':'ok');
 var nome=(DOC&&p.docente)?p.docente.cognome_nome:p.nome;
 var bd=h('span',{c:'bd'+(cl==='ok'?'':(cl==='no'?' r':' g'))},p.presenza==='presente'?'presente':(p.presenza==='assente'?'assente':(p.presenza==='parziale'?'assente ore '+p.ore_assenti.join(', '):'presenza da verificare')));
 var c=h('div',{c:'card '+cl},h('h3',null,h('span',null,nome),bd));
 function riga(k,corpo){var d=h('div',{c:'l'},h('b',null,L(k)[0]));if(Array.isArray(corpo)){var u=h('ul');corpo.forEach(function(x){u.appendChild(h('li',null,x));});d.appendChild(u);}else d.appendChild(corpo);return d;}
 c.appendChild(riga('fatto',p.fatto.length?p.fatto:['Ancora niente di registrato']));
 c.appendChild(riga('manca',p.manca.length?p.manca:['Niente: sei in pari']));
 var v=h('span',null,p.vai.testo);var vd=h('div',null,v);if(p.vai.link)vd.appendChild(h('a',{c:'go',h:p.vai.link,target:'_blank',rel:'noopener'},'Apri'));
 c.appendChild(riga('vai',vd));
 var f='nessuna attività registrata';
 if(p.fermo){var ft=new Date(p.fermo.iso).getTime();f='ultima attività: '+p.fermo.ultima+' ('+p.fermo.cosa+'); fermo da '+eta(dato-ft)+' prima del dato';if(dato<ft)f='ultima attività: '+p.fermo.ultima;}
 c.appendChild(riga('fermo',h('span',null,f)));
 var vy=p.veyon,vt;
 if(vy.osservazioni){vt=h('span',vy.fuori_compito?{c:'rosso'}:null,'Veyon del '+vy.giorno+': '+vy.osservazioni+' osservazioni'+(vy.fuori_compito?', di cui '+vy.fuori_compito+' FUORI COMPITO':', nessuna fuori compito')+' ');vt.appendChild(h('span',{c:'t sm'},'(da bobine, da verificare)'));}
 else vt=h('span',{c:'mu'},'Nessun dato Veyon per la lezione del '+vy.giorno+' (non provato)');
 c.appendChild(riga('veyon',vt));
 if(p.pc)c.appendChild(riga('pc',h('span',p.pc.stato==='PROBLEMA'?{c:'rosso'}:null,'PC '+p.pc.numeri.join(', ')+': '+p.pc.stato+(p.pc.tipo.length?' ('+p.pc.tipo.join(', ')+')':'')+'; Lazarus: '+(p.pc.lazarus.join(', ')||'non scritto'))));
 var vo=p.voto,x=h('span',null,'fascia '+vo.fascia+' ('+vo.n_voti+' voti in '+vo.n_materie+' materie, '+vo.sotto60+' sotto 60). Metodo: '+vo.metodo+'.');
 c.appendChild(riga('voto',x));
 if(DOC&&p.docente){var q=p.docente,dc=h('div',{c:'dc'});
  dc.appendChild(h('div',null,h('b',null,'Voto proposto: '+(q.voto==null?'nessun dato':q.voto.toString().replace('.',','))),' ',h('span',{c:'t'},q.coerente?'(uguale al ricalcolo dai voti DIDAweb)':'(NON coerente: ricalcolo '+q.ricalcolo+')')));
  if(q.conto)dc.appendChild(h('div',null,'Conto: '+q.conto));
  if(q.valutazione)dc.appendChild(h('div',{c:'t'},q.valutazione));
  if(q.conflitto)dc.appendChild(h('div',{c:'rosso'},'DA VERIFICARE: '+q.conflitto));
  if(q.assenza_totale)dc.appendChild(h('div',null,'Assenze: '+q.assenza_totale.ore_assenti+' ore su '+q.assenza_totale.ore_con_dato+' ('+q.assenza_totale.perc+'%)'+(q.giustificato.length?'; giustificata: '+q.giustificato.join('/'):'')));
  if(q.quiz_percent.length)dc.appendChild(h('div',null,'Quiz (miglior tentativo): '+q.quiz_percent.map(function(z){return z.titolo.slice(0,30)+' '+z.pct+'%';}).join(' | ')));
  if(q.note.length){var u2=h('ul');q.note.forEach(function(n){u2.appendChild(h('li',null,n.data+': '+n.testo));});dc.appendChild(h('div',null,'Note:',u2));}
  if(q.veyon_testi.length){var u3=h('ul');q.veyon_testi.forEach(function(n){u3.appendChild(h('li',n.fuori_compito?{c:'rosso'}:null,(n.ora?n.ora+' ':'')+n.testo));});dc.appendChild(h('div',null,'Veyon (testo da bobine):',u3));}
  if(q.pc_dettaglio.length)dc.appendChild(h('div',null,'PC: '+q.pc_dettaglio.map(function(z){return z.pc+' '+(z.problema||'')}).join(' | ')));
  if(q.qualitativo)dc.appendChild(h('div',{c:'t'},'Elementi qualitativi: '+q.qualitativo));
  c.appendChild(dc);}
 return c;
}
render();
if(!DOC){setInterval(function(){
 fetch('dati-cruscotto.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.schema==='cruscotto-classe-1'){D=j;}render();}).catch(function(){render();});
},GIRO);}else{setInterval(render,GIRO);}
})();
</script></body></html>
