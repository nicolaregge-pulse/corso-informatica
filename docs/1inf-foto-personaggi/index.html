<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>1INF · foto e personaggi</title>
<style>body{margin:0;background:#fbfaf7;color:#111;font:17px/1.4 system-ui,Segoe UI,Arial,sans-serif}.w{max-width:1200px;margin:0 auto;padding:16px}
.box{background:#fff;border:2px solid #1f6feb;border-radius:12px;padding:16px;max-width:420px}input{font:inherit;padding:10px;border:1px solid #bbb;border-radius:8px;width:100%;box-sizing:border-box;margin:8px 0}
button{font:inherit;font-weight:800;background:#1f6feb;color:#fff;border:0;border-radius:10px;padding:10px 18px}
.g{display:flex;flex-wrap:wrap;gap:12px}.c{background:#fff;border:3px solid #2f9e44;border-radius:12px;padding:8px;width:276px}.c.no{border-color:#c92a2a}
.c b{display:block;margin-bottom:6px}.c img,.c .m{width:128px;height:128px;object-fit:cover;border-radius:8px;display:inline-block;vertical-align:top}
.m{background:#ffe3e3;color:#c92a2a;font-weight:700;display:inline-flex!important;align-items:center;justify-content:center;text-align:center}
.t{font-size:12px;color:#5b6573;display:flex;gap:16px;margin-top:2px}</style></head>
<body><div class="w"><h1>1INF · foto originale e personaggio</h1><p id="agg" style="color:#5b6573"></p>
<div class="box" id="chiusa"><p><b>Solo per il prof.</b> Password dell'area docente.</p><input id="pw" type="password" autocomplete="current-password"><button id="ok">Apri</button><p id="err" style="color:#c0392b"></p></div>
<div class="g" id="g"></div></div>
<script>
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function apri(X,pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(X.salt),iterations:X.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(X.iv)},k,b64(X.ct))))}
async function carica(pw){var X=await(await fetch('dati.json?t='+Date.now(),{cache:'no-store'})).json();var d=await apri(X,pw);
 document.getElementById('chiusa').hidden=true;var S=d.situazione,ok=S.filter(function(x){return x.personaggio}).length;
 document.getElementById('agg').textContent=ok+' allievi su '+S.length+' hanno foto e personaggio · si aggiorna da sola ogni minuto';
 document.getElementById('g').innerHTML=S.map(function(x){return '<div class="c'+(x.personaggio?'':' no')+'"><b>'+e(x.nome)+'</b>'+(x.foto?'<img src="'+x.foto+'" alt="foto">':'<span class="m">manca la foto</span>')+' '+(x.personaggio?'<img src="'+x.personaggio+'" alt="personaggio">':'<span class="m">manca il personaggio</span>')+'<div class="t"><span style="width:128px">foto originale</span><span>personaggio</span></div></div>'}).join('')}
var PW=null;try{PW=sessionStorage.getItem('cruscotto-pw')}catch(e){}
async function prova(){var pw=document.getElementById('pw').value;try{await carica(pw);PW=pw;try{sessionStorage.setItem('cruscotto-pw',pw)}catch(e){}}catch(e){document.getElementById('err').textContent='Password sbagliata.'}}
document.getElementById('ok').onclick=prova;document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')prova()});
if(PW)carica(PW).catch(function(){PW=null});setInterval(function(){if(PW)carica(PW).catch(function(){})},60000);
</script></body></html>
