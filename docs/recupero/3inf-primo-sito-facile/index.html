<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Il mio primo sito — facile</title>
<style>
:root{--bg:#fdf6e3;--txt:#1b1b1b;--blu:#0b4f8a;--verde:#1f883d;--giallo:#ffd23f;--rosso:#d1242f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Verdana,Tahoma,Arial,sans-serif;letter-spacing:.04em;word-spacing:.12em}
.w{max-width:900px;margin:0 auto;padding:14px 16px 50px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.n{font-size:56px;font-weight:900;color:var(--blu);line-height:1}
.di{font-size:20px;color:#555}
.bar{height:16px;background:#e6dcc0;border-radius:8px;overflow:hidden;margin:10px 0 14px}.bar div{height:100%;background:var(--verde)}
.testo{font-size:30px;line-height:1.6;margin:8px 0 14px;font-weight:700}
.testo b{color:var(--blu);background:#fff3b0;padding:0 6px;border-radius:6px}
.disegno{background:#fff;border:3px solid #ccc;border-radius:14px;padding:10px}
.disegno svg{width:100%;height:auto;display:block}
.copia{display:block;width:100%;background:var(--giallo);color:#222;font-size:26px;font-weight:900;border:0;border-radius:14px;padding:16px;margin:12px 0;cursor:pointer}
.vedi{background:#e8f6ec;border-left:10px solid var(--verde);padding:12px 14px;border-radius:10px;font-size:24px;line-height:1.5;margin:12px 0}
.nav{display:flex;gap:10px;margin-top:14px}
.nav button{flex:1;font-size:26px;font-weight:900;border:0;border-radius:14px;padding:18px;cursor:pointer}
.fatto{background:var(--verde);color:#fff}.indietro{background:#ddd;color:#222;flex:.5!important}
.ascolta{background:var(--blu);color:#fff;font-size:22px;font-weight:800;border:0;border-radius:12px;padding:10px 18px;cursor:pointer}
.aiuto{font-size:22px;margin-top:10px}.aiuto summary{cursor:pointer;color:var(--rosso);font-weight:900}
.aiuto div{padding:8px 0;line-height:1.5}
.ver{color:#888;font-size:14px;margin-top:18px}
</style></head><body><div class="w">
<div class="top"><span class="n" id="num"></span><span class="di" id="di"></span><button class="ascolta" onclick="leggi()">ASCOLTA</button></div>
<div class="bar"><div id="bar"></div></div>
<div class="testo" id="testo"></div>
<div id="cp"></div>
<div class="disegno" id="dis"></div>
<div class="vedi"><b>DEVI VEDERE:</b> <span id="vedi"></span></div>
<details class="aiuto" id="aiuto"><summary>NON MI TORNA</summary><div id="aiutot"></div></details>
<div class="nav"><button class="indietro" onclick="vai(-1)">&larr;</button><button class="fatto" onclick="vai(1)">FATTO &rarr;</button></div>
<div class="ver">Il mio primo sito — versione facile con le immagini · Versione 1.0 · Il prof è vicino a te: chiamalo quando vuoi.</div>
</div>
<script>

 nome: pagina(scritta(40,100,'Crea un nuovo repository',28)+scritta(40,160,'Nome del repository *',20,'#9da7b3')+casella(40,175,420,'mio-sito')+scritta(40,260,'✔ mio-sito è disponibile',20,'#3fb950')+cerchio(250,198,120)),

 commit: pagina(scritta(40,110,'mio-sito / index.html',22,'#9da7b3')+bottone(520,75,250,'Commit changes...')+cerchio(645,100,150)+'<rect x="160" y="170" width="480" height="180" rx="10" fill="#161b22" stroke="#30363d"/>'+scritta(190,215,'poi, nella finestrella:',20,'#9da7b3')+bottone(380,280,240,'Commit changes')),

 sito: '<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="Verdana,Arial"><rect width="800" height="380" rx="10" fill="#add8e6"/><text x="400" y="80" font-size="34" font-weight="bold" fill="darkblue" text-anchor="middle">Ciao, sono ...</text><rect x="200" y="110" width="400" height="240" rx="14" fill="#fff"/><text x="230" y="160" font-size="24" fill="teal" font-weight="bold">Chi sono</text><text x="230" y="230" font-size="24" fill="teal" font-weight="bold">Le mie passioni</text><text x="230" y="300" font-size="24" fill="teal" font-weight="bold">Il mio sogno</text></svg>',
 prof: '<svg viewBox="0 0 800 240" xmlns="http://www.w3.org/2000/svg" font-family="Verdana,Arial"><rect width="800" height="240" rx="10" fill="#e8f6ec"/><text x="400" y="110" font-size="40" font-weight="bold" fill="#1f883d" text-anchor="middle">BRAVO! Il sito è TUO</text><text x="400" y="170" font-size="26" fill="#1b1b1b" text-anchor="middle">Chiama il prof e mostraglielo</text></svg>'

/* ---------- i passi: una sola azione per passo ---------- */
var P=[
 {t:'Nella casella <b>Nome del repository</b> cancella tutto e scrivi <b>mio-sito</b>.',c:'mio-sito',d:D.nome,v:'sotto la casella c\'è un segno verde.',h:'Scritta rossa? Il nome c\'è già: scrivi mio-sito2.'},
 {t:'Trova la riga <b>Aggiungi README</b>. Clicca l\'interruttore: deve diventare <b>Acceso</b>.',d:D.readme,v:'l\'interruttore è verde.',h:''},
 {t:'Vai in fondo alla pagina. Clicca il bottone verde <b>Crea repository</b>.',d:D.crea,v:'la pagina del tuo repository mio-sito, con il file README.',h:'Non trovi il bottone? Scorri in basso con la rotellina del mouse.'},
 {t:'Clicca <b>Aggiungi file</b>, poi <b>Crea nuovo file</b>.',d:D.aggiungi,v:'una pagina con una casella in alto e un grande riquadro.',h:'Se è in inglese: Add file, poi Create new file.'},
 {t:'Clicca nella casella in alto. Premi il bottone giallo <b>COPIA</b>, poi premi <b>Ctrl + V</b>.',c:'index.html',d:D.nomefile('index.html'),v:'nella casella c\'è scritto index.html.',h:''},
 {t:'Premi il bottone giallo <b>COPIA</b>. Poi clicca nel grande riquadro e premi <b>Ctrl + V</b>.',c:HTML,d:D.incolla,v:'il codice nel riquadro, che inizia con &lt;!DOCTYPE html&gt;.',h:'Il riquadro è vuoto? Clicca dentro e premi di nuovo Ctrl + V.'},

 {t:'Cambia <b>Passione 1, 2, 3</b> con 3 cose che ti piacciono. Cambia anche <b>Il mio sogno</b>.',d:D.nome2,v:'le tue 3 passioni e il tuo sogno.',h:'Lascia &lt;li&gt; e &lt;/li&gt;: scrivi solo in mezzo.'},

 {t:'Di nuovo: clicca <b>Aggiungi file</b>, poi <b>Crea nuovo file</b>.',d:D.aggiungi,v:'la casella in alto e il grande riquadro.',h:''},
 {t:'Clicca nella casella in alto. Premi il bottone giallo <b>COPIA</b>, poi <b>Ctrl + V</b>.',c:'style.css',d:D.nomefile('style.css'),v:'nella casella c\'è scritto style.css.',h:''},

 {t:'Clicca <b>Commit changes</b>. Nella finestrella clicca di nuovo <b>Commit changes</b>.',d:D.commit,v:'3 file: README, index.html, style.css.',h:''},

 {t:'<b>FATTO!</b> Chiama il prof e mostragli il tuo sito.',d:D.prof,v:'il prof che guarda il tuo sito.',h:''}
];
var K="facile-primo-sito",i=0;try{i=parseInt(localStorage.getItem(K)||"0")||0}catch(e){}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function mostra(){if(i<0)i=0;if(i>=P.length)i=P.length-1;var p=P[i];
 document.getElementById("num").textContent=(i+1);document.getElementById("di").textContent="di "+P.length;
 document.getElementById("bar").style.width=Math.round(100*(i+1)/P.length)+"%";
 document.getElementById("testo").innerHTML=p.t;
 document.getElementById("cp").innerHTML=p.c?'<button class="copia" onclick="copia()">COPIA</button>':"";
 document.getElementById("dis").innerHTML=p.d;document.getElementById("vedi").innerHTML=p.v;
 var h=document.getElementById("aiuto");h.style.display=p.h?"block":"none";h.open=false;document.getElementById("aiutot").textContent=p.h;
 try{localStorage.setItem(K,i)}catch(e){}}
function vai(d){if(window.speechSynthesis)speechSynthesis.cancel();i+=d;mostra();window.scrollTo(0,0)}
function copia(){var t=P[i].c;function ok(){var b=document.querySelector(".copia");b.textContent="COPIATO! Ora Ctrl + V";setTimeout(function(){b.textContent="COPIA"},3000)}
 try{navigator.clipboard.writeText(t).then(ok,function(){fb(t);ok()})}catch(e){fb(t);ok()}}
function fb(t){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove()}
function leggi(){if(!window.speechSynthesis)return;speechSynthesis.cancel();var d=document.createElement("div");d.innerHTML=P[i].t+" . Devi vedere: "+P[i].v;
 var u=new SpeechSynthesisUtterance(d.textContent.replace(/Ctrl \+ V/g,"control V"));u.lang="it-IT";u.rate=0.85;speechSynthesis.speak(u)}
