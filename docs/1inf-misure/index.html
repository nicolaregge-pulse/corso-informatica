 else{el.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');el.className='timer'}})}

 }catch(x){ultimi.r2=()=>{const r=document.getElementById('r2');r.innerHTML='<span class="ko">'+t('err')+'</span>'+timbro();r.classList.add('on')}}

 (function g(){k++;if(performance.now()-a<1500)return requestAnimationFrame(g);
