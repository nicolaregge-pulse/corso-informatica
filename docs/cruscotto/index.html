<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cruscotto della lezione</title>
<style>
/* 26/10/2026 (Nicola): un solo indirizzo per il cruscotto, per allievi e docente, con il calendario per rivedere ogni giorno */
:root{--bg:#f4f6f9;--card:#fff;--txt:#1b1f24;--mu:#5b6573;--bordo:#d5dbe3;--blu:#1f6feb}
body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--card);border-bottom:1px solid var(--bordo);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:19px;margin:0 12px 0 0}
label{font-size:14px;color:var(--mu);display:flex;align-items:center;gap:6px}
select,input[type=date]{font-size:16px;padding:6px 8px;border:1px solid var(--bordo);border-radius:8px;background:#fff}
.ruolo{display:flex;gap:6px}
.ruolo button{font-size:16px;padding:7px 14px;border:1px solid var(--bordo);border-radius:8px;background:#fff;cursor:pointer}
.ruolo button.on{background:var(--blu);color:#fff;border-color:var(--blu)}
#nota{font-size:14px;color:var(--mu);padding:6px 16px;margin:0}
/* 28/10/2026: leva del ritmo dello script, solo per il docente (dopo il codice) */
#leva{display:none;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 16px;font-size:14px;color:var(--mu)}
#leva button{font-size:14px;padding:5px 10px;border:1px solid var(--bordo);border-radius:8px;background:#fff;cursor:pointer}
#leva button.on{background:var(--blu);color:#fff;border-color:var(--blu)}
#levaMsg{flex-basis:100%}
iframe{display:block;width:100%;height:calc(100vh - 110px);border:0;background:#fff}
</style>
</head>
<body>
<header>
  <h1>Cruscotto della lezione</h1>
  <label>Classe <select id="classe"><option>1INF</option><option selected>2INF</option><option>3INF</option></select></label>
  <label>Giorno <input type="date" id="giorno"></label>
  <div class="ruolo"><button id="allievo" class="on">Allievo</button><button id="docente">Docente</button></div>
</header>
<p id="nota"></p>
<p id="script" style="font-size:14px;margin:0;padding:4px 16px;color:var(--mu)"><span id="stato">Script: controllo in corso…</span><span id="ponte"></span></p>
<div id="leva"><b>Ritmo dello script:</b>
  <button data-m="1">ogni 1 minuto</button><button data-m="5">ogni 5 minuti</button><button data-m="10">ogni 10 minuti</button><button data-m="0">spento</button>
  <span id="levaOra"></span><span id="levaMsg"></span></div>
<iframe id="vista" title="Cruscotto"></iframe>
<script>
// Allievo: la pagina dei ragazzi (Nome C., voto, che cosa manca). Docente: il cruscotto cifrato, chiede la password.
// Giorni passati: i file in avanzamento/archivio/ (indice.json dice quali giorni ci sono per ogni classe).
var OGGI_PAG = {
  '1INF': {allievo: '../1inf-oggi/', docente: '../avanzamento/1inf-oggi.html'},
  '2INF': {allievo: '../2inf-oggi/', docente: '../avanzamento/git-2inf.html'},
  '3INF': {allievo: '../3inf-oggi/', docente: '../avanzamento/3inf-oggi.html'}
};
// Pagine docente speciali per un giorno preciso (classe:AAAA-MM-GG); gli altri giorni restano come sopra.
var GIORNO_PAG = {'2INF:2026-10-28': '../avanzamento/2inf-sicurezza-oggi.html',
  // 28/10/2026 3INF: Hello World in Lazarus e in Java (consegna del Documento su Classroom)
  '3INF:2026-10-28': {docente: '../avanzamento/3inf-lazarus-oggi.html', allievo: '../3inf-lazarus/', nota: 'Oggi, dal vivo: Hello World in Lazarus e in Java.'}};
var IND = {}, ruolo = 'allievo';
var $ = function (id) { return document.getElementById(id); };
function oggi() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function salva() { try { localStorage.setItem('cruscotto', JSON.stringify({c: $('classe').value, r: ruolo})); } catch (e) {} }
function mostra() {
  var c = $('classe').value, g = $('giorno').value || oggi(), giorni = IND[c] || [], src;
  if (g !== oggi() && giorni.indexOf(g) >= 0) {
    var f = 'archivio/' + c.toLowerCase() + '-' + g + (ruolo === 'allievo' ? '-allievi' : '') + '.json';
    src = OGGI_PAG[c][ruolo] + '?f=' + encodeURIComponent(f);
    $('nota').textContent = 'Stai guardando il ' + g.split('-').reverse().join('/') + ' (giorno salvato).';
  } else if (g === oggi() && typeof GIORNO_PAG[c + ':' + g] === 'object') {
    src = GIORNO_PAG[c + ':' + g][ruolo];
    $('nota').textContent = GIORNO_PAG[c + ':' + g].nota;
  } else if (c === '2INF' && ruolo === 'docente' && g === oggi() && GIORNO_PAG['2INF:' + g]) {
    // 28/10/2026: oggi la 2INF fa il recupero dei quiz di sicurezza, il docente vede il monitor dedicato
    src = GIORNO_PAG['2INF:' + g];
    $('nota').textContent = 'Oggi, dal vivo: monitor dei quiz di sicurezza.';
  } else {
    src = OGGI_PAG[c][ruolo];
    $('nota').textContent = g === oggi() ? 'Oggi, dal vivo.' :
      'Per questo giorno non c\'è un cruscotto salvato: mostro quello di oggi.' + (giorni.length ? ' Giorni salvati: ' + giorni.map(function (x) { return x.split('-').reverse().join('/'); }).join(', ') + '.' : '');
  }
  if ($('vista').getAttribute('src') !== src) $('vista').setAttribute('src', src);
  salva();
}
function scegli(r) { ruolo = r; if (typeof controllaCodice === 'function') setTimeout(controllaCodice, 0); $('allievo').className = r === 'allievo' ? 'on' : ''; $('docente').className = r === 'docente' ? 'on' : ''; mostra(); }
$('allievo').onclick = function () { scegli('allievo'); };
$('docente').onclick = function () { scegli('docente'); };
$('classe').onchange = mostra; $('giorno').onchange = mostra;
try { var s = JSON.parse(localStorage.getItem('cruscotto') || '{}'); if (s.c) $('classe').value = s.c; if (s.r) ruolo = s.r; } catch (e) {}
var q = new URLSearchParams(location.search);
if (q.get('classe') && OGGI_PAG[q.get('classe').toUpperCase()]) $('classe').value = q.get('classe').toUpperCase();
if (q.get('ruolo') === 'docente' || q.get('ruolo') === 'allievo') ruolo = q.get('ruolo');
$('giorno').value = q.get('giorno') || oggi(); $('giorno').max = oggi();
fetch('../avanzamento/archivio/indice.json?t=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.ok ? r.json() : {}; })
  .catch(function () { return {}; }).then(function (d) { IND = d || {}; scegli(ruolo); });

// 27/10/2026 (Nicola): lo stato dello script in alto: giri fatti oggi, ritmo, massimo e quando si azzera.
window.statoScript = function (s) {
  var rit = s.ritmo ? 'ogni ' + s.ritmo + (s.ritmo === 1 ? ' minuto' : ' minuti') : 'SPENTO';
  var t = s.timer ? '' : ' · timer FERMO';
  var gh = s.github_rimaste !== '' ? ' · GitHub: ' + s.github_rimaste + ' richieste rimaste su ' + s.github_limite_ora + ' l\'ora' + (s.github_reset ? ', si azzera alle ' + new Date(s.github_reset).toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}) : '') : '';
  STATO = s; levaAggiorna();
  var el = document.getElementById('stato');
  el.textContent = 'Script v' + s.versione + ': ' + rit + t + ' · giri oggi ' + s.giri_oggi + ' · chiamate oggi ' + s.chiamate_oggi + ' su ' + s.limite_google_giorno + ' (si azzera ogni giorno)' + gh;
  document.getElementById('script').style.color = (!s.timer || !s.ritmo || (s.github_rimaste !== '' && +s.github_rimaste < 500)) ? '#c0392b' : '';
};
fetch('../verifica/config.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (c) {
  if (!c || !c.invio) return;
  var sc = document.createElement('script'); sc.src = c.invio + (c.invio.indexOf('?') < 0 ? '?' : '&') + 'ping=1&callback=statoScript';
  INVIO = c.invio;
  sc.onerror = function () { document.getElementById('stato').textContent = 'Script: non risponde.'; document.getElementById('script').style.color = '#c0392b'; };
  document.body.appendChild(sc);
}).catch(function () {});

// 28/10/2026 (orario/da-fare-cruscotto.md punto 7): comandi del ponte di oggi, da docs/cruscotto/ponte.json (solo numeri e ore).
fetch('ponte.json?t=' + Date.now(), {cache: 'no-store'}).then(function (r) { return r.ok ? r.json() : null; }).then(function (p) {
  if (!p) return;
  var quando = p.oggi === oggi() ? 'oggi' : 'il ' + p.oggi.split('-').reverse().join('/');
  document.getElementById('ponte').textContent = ' · ponte ' + quando + ': ' + p.eseguiti_oggi + ' comandi eseguiti' +
    (p.errori_oggi ? ', ' + p.errori_oggi + ' con errore' : '') + (p.ultimo_eseguito ? ' (ultimo alle ' + p.ultimo_eseguito + ')' : '') +
    ', ' + p.da_eseguire + ' da eseguire' + (p.da_eseguire_dal ? ' (in attesa dalle ' + p.da_eseguire_dal + ')' : '') +
    (p.in_attesa_altro ? ', ' + p.in_attesa_altro + ' fermi in attesa del docente' : '') + ' · conteggio delle ' + p.aggiornato;
}).catch(function () {});

// 28/10/2026 (orario/da-fare-cruscotto.md punto 2): la leva del ritmo. Compare SOLO in modalità Docente e solo con il
// codice del docente giusto (lo stesso delle pagine docente: sessionStorage «tokmon», verificato decifrando chiave.json).
// Lo script v8.3 NON accetta il ritmo dal web: i bottoni dicono di chiederlo a Claude (che scrive il comando «script.ritmo»
// nel ponte). Quando il ping dirà leva_ritmo (v8.4, strumenti/automazione-corso-v8.4-ritmo.patch.gs) aprono <invio>?ritmo=N&k=codice.
var STATO = null, INVIO = '', TOK_OK = '', CLIC = false;
function b64(x) { return Uint8Array.from(atob(x), function (c) { return c.charCodeAt(0); }); }
async function provaCodice(tok) {
  var d = await (await fetch('chiave.json', {cache: 'no-store'})).json();
  var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(tok), 'PBKDF2', false, ['deriveKey']);
  var k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(d.salt), iterations: d.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(d.iv)}, k, b64(d.ct)))).ok === 1;
}
var provato = '';
function controllaCodice() {
  if (ruolo !== 'docente') { levaAggiorna(); return; }
  var t = ''; try { t = sessionStorage.getItem('tokmon') || ''; } catch (e) {}
  if (!t || t === TOK_OK || t === provato) { levaAggiorna(); return; }
  provato = t;
  provaCodice(t).then(function (ok) { if (ok) TOK_OK = t; levaAggiorna(); }).catch(function () { levaAggiorna(); });
}
setInterval(controllaCodice, 3000);   // il codice si scrive nella pagina docente qui sotto (stessa scheda): lo vedo da qui
function hhmm(d) { return d.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Rome'}); }
function quandoParte() {
  // Il cambio passa dal ponte: vale al prossimo giro dello script (che legge comandi/). Giro = battito + ritmo.
  var s = STATO; if (!s) return '';
  if (!s.ritmo) return 'Lo script è SPENTO: il ponte non gira, quindi un comando non lo riaccende. Per riaccenderlo: Apps Script, menu delle funzioni «ritmo5», «Esegui».';
  var ora = s.ora ? new Date(s.ora) : new Date(), b = String(s.battito || ''), t = Date.parse(b);
  if (isNaN(t)) t = Date.parse(b.replace(/\s*\(.*\)\s*$/, ''));
  if (!s.inOrario) {
    var d = new Date(ora); d.setHours(7, 0, 0, 0); if (d <= ora) d.setDate(d.getDate() + 1);
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    return 'Fuori orario (lun-ven 7-15) lo script dorme: il cambio parte al primo giro utile, ' + d.toLocaleDateString('it-IT', {weekday: 'long'}) + ' verso le ' + hhmm(new Date(d.getTime() + s.ritmo * 60000)) + '.';
  }
  var prossimo = isNaN(t) ? null : new Date(t + s.ritmo * 60000);
  if (prossimo && prossimo > ora) {
    var min = Math.max(1, Math.ceil((prossimo - ora) / 60000));
    return 'Il nuovo ritmo parte al prossimo giro dello script: entro ' + min + (min === 1 ? ' minuto' : ' minuti') + ', cioè verso le ' + hhmm(prossimo) + ' (più il minuto che serve a Claude per scrivere il comando).';
  }
  return 'Il nuovo ritmo parte al prossimo giro dello script: entro ' + s.ritmo + (s.ritmo === 1 ? ' minuto' : ' minuti') + ', cioè entro le ' + hhmm(new Date(ora.getTime() + s.ritmo * 60000)) + '.';
}
function levaAggiorna() {
  var vis = ruolo === 'docente' && !!TOK_OK;
  document.getElementById('leva').style.display = vis ? 'flex' : 'none';
  if (!vis) return;
  var r = STATO ? +STATO.ritmo : -1;
  Array.prototype.forEach.call(document.querySelectorAll('#leva button'), function (b) { b.className = +b.dataset.m === r ? 'on' : ''; });
  document.getElementById('levaMsg').textContent = (CLIC ? 'Per ora il ritmo si cambia chiedendolo a Claude in chat. ' : '') + (STATO && STATO.leva_ritmo ? 'Il cambio vale da subito.' : quandoParte());
  document.getElementById('levaOra').textContent = STATO ? 'adesso: ' + (r ? 'ogni ' + r + (r === 1 ? ' minuto' : ' minuti') : 'spento') : 'adesso: non so (lo script non ha risposto)';
}
Array.prototype.forEach.call(document.querySelectorAll('#leva button'), function (b) {
  b.onclick = function () {
    var m = +b.dataset.m, msg = document.getElementById('levaMsg');
    if (STATO && STATO.leva_ritmo && INVIO) {   // v8.4: il cambio vale subito
      window.open(INVIO + (INVIO.indexOf('?') < 0 ? '?' : '&') + 'ritmo=' + m + '&k=' + encodeURIComponent(TOK_OK), '_blank', 'noopener');
      msg.textContent = 'Ho aperto la pagina dello script: il nuovo ritmo vale da subito. Ricarica il cruscotto per vederlo qui.';
      return;
    }
    CLIC = true; levaAggiorna();
  };
});
</script>
</body>
</html>
