<style>
:root{--bg:#f6f7f9;--fg:#1c2430;--mut:#5b6675;--card:#fff;--line:#c9d0da;--bl:#1d4ed8;--no:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--fg:#e6ebf2;--mut:#9aa6b6;--card:#18202b;--line:#2c3746;--bl:#6c9bff;--no:#ff9a8f}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:1.25rem;margin:0 0 4px}
p{margin:0 0 16px;color:var(--mut)}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{width:100%;margin-top:12px;font-size:16px;font-weight:600;padding:12px;border:0;border-radius:8px;background:var(--bl);color:#fff;cursor:pointer;min-height:44px}
button[disabled]{opacity:.6}
.mostra{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.9rem;color:var(--mut)}

</form>
