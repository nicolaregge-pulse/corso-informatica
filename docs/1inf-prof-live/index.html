<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cruscotto 1INF (docente)</title><style>
:root{--bg:#fbfaf7;--card:#fff;--tx:#111;--mu:#555;--ln:#ddd;--acc:#1f6feb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#9aa4ae;--ln:#30363d;--acc:#58a6ff}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#9aa4ae;--ln:#30363d;--acc:#58a6ff}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,Segoe UI,Arial,sans-serif}.w{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 2px}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 16px;margin:10px 0;overflow-x:auto}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi div{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:26px}
table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid var(--ln);padding:6px 9px;text-align:left}th{background:var(--acc);color:#fff}
.ok{color:#2f9e57;font-weight:800}.no{color:#e0413a;font-weight:800}tr.fuori td{background:rgba(224,65,58,.12)}tr.attesa td{background:rgba(224,180,0,.10)}
input{font:inherit;font-size:17px;padding:8px 12px;border-radius:8px;border:2px solid var(--ln);background:var(--card);color:var(--tx)}
button{font:inherit;font-weight:800;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}
</style></head><body><div class="w">
<h1>Cruscotto 1INF — area docente</h1>
<div class="card" id="log"><b>Solo docente.</b> Scrivi la password e premi Apri. <input id="pw" type="password" placeholder="password"> <button id="b">Apri</button> <span id="err" class="no"></span></div>
<div id="out" hidden>
<p class="mu" id="sotto"></p><div class="kpi" id="kpi"></div>
<h2>Classe (cognomi)</h2><div class="card"><table id="tab"></table></div>
<p class="mu">Assenti oggi: <span id="ass"></span>. Si aggiorna da solo ogni 30 secondi.</p>
</div></div><script>
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
var PW='';
async function apri(X,pw){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(X.salt),iterations:X.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(X.iv)},k,b64(X.ct))))}
function dis(d){document.getElementById('out').hidden=false;document.getElementById('log').style.display='none';
 document.getElementById('sotto').textContent=d.classe+' · '+d.data+' · dati delle '+d.aggiornato+' · ultimo giro Veyon '+d.giro;
 document.getElementById('ass').textContent=(d.assenti||[]).join(', ');
 var fu=d.righe.filter(function(r){return r.fuori}).length;
 document.getElementById('kpi').innerHTML='<div>Verifica consegnata<b>'+d.n_verifica+' / '+d.righe.length+'</b></div><div>Fuori compito (ultimo giro)<b class="'+(fu?'no':'ok')+'">'+fu+'</b></div>';
 document.getElementById('tab').innerHTML='<thead><tr><th>Cognome</th><th>Voto attuale</th><th>Verifica di oggi</th><th>Monitor (ultimo giro)</th></tr></thead><tbody>'+d.righe.map(function(r){return '<tr class="'+(r.fuori?'fuori':(r.consegnata?'':'attesa'))+'"><td><b>'+e(r.cognome)+'</b></td><td class="v">'+e(r.voto)+'</td><td class="'+(r.consegnata?'ok':'no')+'">'+e(r.verifica)+'</td><td>'+e(r.monitor)+'</td></tr>'}).join('')+'</tbody>'}
function carica(){fetch('dati.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(X){return apri(X,PW)}).then(dis).catch(function(){})}
document.getElementById('b').onclick=function(){PW=document.getElementById('pw').value;
 fetch('dati.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(X){return apri(X,PW)}).then(function(d){dis(d);setInterval(carica,30000)}).catch(function(){document.getElementById('err').textContent='password sbagliata o dati non pronti'})}
document.getElementById('pw').addEventListener('keydown',function(ev){if(ev.key==='Enter')document.getElementById('b').click()})
</script></body></html>
