<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Versioni e Git 1INF</title><style>body{margin:0;background:#fbfaf7;color:#111;font:19px/1.5 system-ui,Segoe UI,Arial,sans-serif}@media (prefers-color-scheme:dark){body{background:#0d1117;color:#e6edf3}}p{max-width:820px;margin:40px auto;padding:0 16px}</style></head>
<body><p id="m">Carico la versione più recente…</p>
<script>
/* Questa pagina non cambia mai: scarica ogni volta l'ultima versione di pagina.html, saltando la memoria del browser. */
fetch('pagina.html?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(h){document.open();document.write(h);document.close()})
.catch(function(){location.replace('pagina.html?t='+Date.now())});
</script></body></html>
