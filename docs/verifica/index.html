<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="robots" content="noindex">
<title>Ripasso e verifica</title>
<style>
:root{--bg:#f4f7fb;--fg:#1a2330;--mu:#5b6573;--card:#fff;--bd:#d6e0ea;--blu:#1f6feb;--verde:#1a7f37;--rosso:#c0392b;--giallo:#fff4b8;--viola:#6f42c1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--fg:#eee;--mu:#a9a9a9;--card:#1f2227;--bd:#353a42;--giallo:#4a4214}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
.w{max-width:840px;margin:0 auto;padding:16px 16px 60px}h1{font-size:26px;margin:6px 0 2px}h2{font-size:21px;margin:4px 0 8px}.mu{color:var(--mu);font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:14px 0}
.no-sel{user-select:none;-webkit-user-select:none}
input,textarea{font:inherit;width:100%;padding:10px 12px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:190px;resize:vertical;user-select:text;-webkit-user-select:text}
.bt{display:inline-block;font:inherit;font-weight:800;border:0;border-radius:12px;padding:13px 20px;color:#fff;background:var(--blu);cursor:pointer;margin:6px 8px 0 0;text-decoration:none}
.bt.v{background:var(--verde)}.bt.g{background:#5b6573}.bt:disabled,.bt.off{opacity:.45;cursor:default;pointer-events:none}
.op{display:block;width:100%;text-align:left;font:inherit;background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:10px;padding:12px 14px;margin:8px 0 0;cursor:pointer}
.op.sel{border-color:var(--blu);background:rgba(31,111,235,.12)}.op.giusta{border-color:var(--verde);background:rgba(26,127,55,.12)}.op.sbagliata{border-color:var(--rosso);background:rgba(192,57,43,.1)}
.barra{position:sticky;top:0;z-index:5;background:#12467a;color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:700;flex-wrap:wrap}
.pallini{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.pallini button{width:36px;height:36px;border-radius:50%;border:2px solid var(--bd);background:var(--card);color:var(--fg);font-weight:700;cursor:pointer}
.pallini button.fatto{background:var(--blu);color:#fff;border-color:var(--blu)}.pallini button.qui{outline:3px solid #ffb000}
.avviso{background:var(--giallo);border-left:5px solid #d4a000;border-radius:10px;padding:10px 14px;margin:10px 0}
.err{background:rgba(192,57,43,.12);border-left:5px solid var(--rosso);border-radius:10px;padding:10px 14px;margin:10px 0}
.ok{border-left:5px solid var(--verde)}.ko{border-left:5px solid var(--rosso)}.attesa{border-left:5px solid #d4a000}
.scala{display:flex;gap:8px;flex-wrap:wrap}.scala button{flex:1;min-width:52px;font:inherit;font-weight:800;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}.scala button.sel{background:var(--blu);color:#fff;border-color:var(--blu)}
.conta{font-size:14px;color:var(--mu);text-align:right}.area{font-size:13px;font-weight:700;color:var(--viola);text-transform:uppercase;letter-spacing:.04em}
.mie{border-left:5px solid var(--viola)}
.probl{margin-top:14px;font-size:15px}.probl summary{cursor:pointer;color:var(--mu)}
.tappe{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tappe a{flex:1;min-width:150px;text-decoration:none;color:var(--fg);background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px 12px}
.strumenti{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}.strumenti a{display:inline-block;color:#fff;font-weight:700;padding:8px 14px;border-radius:10px;text-decoration:none;font-size:15px}
.tappe a b{display:block;font-size:17px}.tappe a.qui{border-color:var(--blu);background:rgba(31,111,235,.10)}.tappe a.chiusa{opacity:.55;pointer-events:none}.tappe a.fatta{border-color:var(--verde)}
.andamento{position:sticky;bottom:0;z-index:6;margin-top:16px;background:#0f2a5c;color:#fff;border-radius:12px;padding:10px 14px;font-size:15px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.andamento b{font-size:17px}.giudizio{background:#fff;color:#0f2a5c;border-radius:99px;padding:3px 12px;font-weight:800}
svg text{fill:var(--fg)}
[hidden]{display:none!important}
</style></head><body><div class="w">
<h1 id="titolo">Ripasso e verifica</h1><div class="mu" id="sotto"></div>
<div id="errore" class="err" hidden></div>
<div class="tappe" id="tappe" hidden></div>
<div class="strumenti" id="strumenti" hidden></div>
<div id="app"></div>
<div class="andamento" id="andamento" hidden></div>
</div>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, APP = $('app');
  var qs = new URLSearchParams(location.search), idB = (qs.get('b') || '').replace(/[^a-z0-9-]/gi, ''), MODO = qs.get('modo') || 'ripasso', ANTE = qs.has('anteprima'), CODICE = qs.get('anteprima') || '';
  function errore(t) { $('errore').hidden = false; $('errore').textContent = t; }
  if (!idB) { errore('Manca il nome nell\'indirizzo (?b=...).'); return; }
  var sc = document.createElement('script'); sc.src = 'banche/' + idB + '.js?v=' + Date.now();
  sc.onerror = function () { errore('Non trovato: ' + idB); }; sc.onload = function () { B = window.BANCA; carica(); }; document.head.appendChild(sc);

  function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function mescola(a, r) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
  function e(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function parole(t) { t = String(t || ''); var cjk = (t.match(/[\u3400-\u9fff\uf900-\ufaff]/g) || []).length; return (t.replace(/[\u3400-\u9fff\uf900-\ufaff\u3000-\u303f\uff00-\uffef]/g, ' ').trim().match(/\S+/g) || []).length + cjk; }   // 29/10: in cinese ogni carattere conta come una parola (prima tutta la frase valeva 1)
  function mmss(s) { s = Math.round(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  function senzaTag(s) { return String(s).replace(/<[^>]+>/g, ''); }
  function prendi(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (x) { return null; } }
  function metti(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (x) {} }

  var B, STATO = {}, BACK = [], NOME = '', D = [], cur = 0, T0 = 0, finita = false, permesso = false, fuoriDa = 0;
  var LOG = { uscite_consentite: 0, uscite: 0, fuori_sec: 0, incolla: 0, copia: 0, tasto_destro: 0, schermo_intero_uscito: 0 };
  var CONF = {}, KS = function (m) { return 'inviata-' + B.id + '-' + m; };
  // CONSEGNA CON UN CLIC (13/10/2026): il risultato va da solo all'applicazione web dello script, che lo salva su Git
  function inviaAlProf(R) {
    if (!CONF.invio) return false;
    var f = document.createElement('form'); f.method = 'POST'; f.action = CONF.invio; f.target = '_blank'; f.style.display = 'none';
    var i = document.createElement('input'); i.type = 'hidden'; i.name = 'd'; i.value = JSON.stringify(R); f.appendChild(i);
    document.body.appendChild(f); f.submit(); f.remove();
    metti(KS(R.modo), { ora: new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) });
    return true;
  }
  var KN = function () { return 'nome-' + B.id; }, KR = function (m) { return 'esito-' + B.id + '-' + m; }, KI = function (m) { return 'incorso-' + B.id + '-' + m; }, MODOP = '';
  function salvaProva() { if (MODOP && !finita && D.length) metti(KI(MODOP), { D: D, T0: T0, cur: cur, LOG: LOG }); }
  window.addEventListener('beforeunload', function (ev) { if (MODOP && !finita && D.length) { salvaProva(); ev.preventDefault(); ev.returnValue = ''; } });

  function carica() {
    document.title = B.titolo; $('titolo').textContent = B.titolo; $('sotto').textContent = B.sotto || '';
    NOME = prendi(KN()) || '';
    var attese = [leggiStato(), fetch('config.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (c) { CONF = c || {}; }).catch(function () { CONF = {}; })];
    if (B.backlog) attese.push(fetch(B.backlog + '?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) { BACK = d.voci || []; }).catch(function () {}));
    attese.push(leggiRisultati());
    Promise.all(attese).then(function () { if (ANTE && B.anteprima && String(hash(CODICE)) !== String(B.anteprima)) { errore('Anteprima solo per il prof: codice sbagliato.'); return; } if (ANTE) return anteprima(); tappe(MODO); if (MODO === 'ripasso') ripasso(); else if (MODO === 'teoria') teoria(); else prova(MODO); mostraAndamento(); });
  }
  function leggiStato() {
    if (!B.stato) return Promise.resolve();
    return fetch(B.stato + '?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (s) { STATO = s || {}; }).catch(function () { STATO = {}; });
  }
  function aperta(modo) {
    if (modo === 'verifica') return STATO.verifica === 'aperta';
    if (modo === 'recupero') { var pv0 = prendi(KR('verifica')); if (STATO.verifica === 'aperta' && pv0 && (pv0.aperte || []).some(function (a) { return a.area !== 'parere' && (a.parole || 0) < 15; })) return true; if (STATO.recupero !== 'aperto') return false; var l = STATO.recupero_per || 'tutti'; return l === 'tutti' || (NOME && l.map(function (x) { return x.toLowerCase(); }).indexOf(sigla(NOME).toLowerCase()) >= 0); }
    return true;
  }
  function sigla(n) { var p = n.trim().split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length - 1].charAt(0).toUpperCase() + '.' : n; }
  function miePR() {
    if (!NOME) return [];
    var s = sigla(NOME).toLowerCase(), nome = NOME.split(/\s+/)[0].toLowerCase();
    var esatte = BACK.filter(function (x) { return (x.alunno || '').toLowerCase() === s; });
    return esatte.length ? esatte : BACK.filter(function (x) { return (x.alunno || '').toLowerCase().split(' ')[0] === nome; });
  }
  function boxMiePR() {
    var m = miePR(); if (!m.length) return '<div class="card mie"><b>Le tue Pull Request di lunedì</b><p class="mu">Non le trovo con il nome che hai scritto. Va bene lo stesso: pensa a quello che hai fatto tu lunedì.</p></div>';
    return '<div class="card mie"><b>Le tue Pull Request di lunedì</b> <span class="mu">(per aiutarti a ricordare)</span><ol>' + m.map(function (x) {
      return '<li><b>' + e((x.ora || '').slice(-5)) + '</b> · ' + e(x.richiesta) + ' · ' + (x.fatto ? '<b style="color:var(--verde)">FATTO ' + e(x.fatto) + '</b>' : x.no ? '<b style="color:var(--rosso)">NO</b>: ' + e(x.no) : 'in coda') + '</li>'; }).join('') + '</ol></div>';
  }
  function chiediNome(dopo) {
    APP.innerHTML = '<section class="card"><label for="nome"><b>Il tuo nome e cognome</b></label><input id="nome" autocomplete="off" maxlength="60" placeholder="Nome Cognome" value="' + e(NOME) + '"><button class="bt v" id="okn">Continua</button></section>';
    $('okn').onclick = function () { var n = $('nome').value.trim().replace(/\s+/g, ' '); if (n.split(' ').length < 2) { alert('Scrivi nome e cognome.'); return; } NOME = n; metti(KN(), n); dopo(); };
  }

  /* ================= PERCORSO: le tre tappe e l'andamento ================= */
  var KA = function () { return 'andamento-' + B.id; }, AND = null, RIS = null;
  function andamento() { AND = AND || prendi(KA()) || { pratica: {}, }; return AND; }
  function tappe(qui) {
    var v = prendi(KR('verifica')), r = prendi(KR('recupero')), T = [
      { m: 'teoria', n: '0. Teoria', s: 'da leggere', ok: true },
      { m: 'ripasso', n: '1. Ripasso', s: 'domande, sempre aperto', ok: true },
      { m: 'verifica', n: '2. Verifica', s: v ? 'consegnata' : aperta('verifica') ? 'aperta' : 'la apre il prof', ok: !!v || aperta('verifica'), fatta: !!v },
      { m: 'recupero', n: '3. Recupero', s: r ? 'consegnato' : aperta('recupero') ? 'aperto' : 'si apre per chi ne ha bisogno', ok: !!r || aperta('recupero'), fatta: !!r }];
    $('tappe').hidden = false;
    $('tappe').innerHTML = T.map(function (t) { return '<a href="?b=' + idB + (t.m === 'ripasso' ? '' : '&modo=' + t.m) + '" class="' + (t.m === qui ? 'qui ' : '') + (t.ok ? '' : 'chiusa ') + (t.fatta ? 'fatta' : '') + '"><b>' + t.n + '</b><span class="mu">' + t.s + '</span></a>'; }).join('');
    // AUTOREGOLAZIONE: i ragazzi vedono sempre il monitor e i risultati, per regolarsi da soli
    var S = (B.strumenti || []).concat([{ t: 'I risultati della verifica', u: 'risultati.html?b=' + idB, c: '#1a7f37' }]);
    $('strumenti').hidden = false;
    $('strumenti').innerHTML = '<span class="mu" style="align-self:center">Per regolarti da solo:</span> ' + S.map(function (x) { return '<a target="_blank" href="' + e(x.u) + '" style="background:' + (x.c || '#6e40c9') + '">' + e(x.t) + '</a>'; }).join(' ');
    // 22/10/2026: il controllo del progetto di ognuno (es. Lazarus su GitHub), in alto alla teoria, per tutti
    if (B.controllo && !$('controllo')) {
      if (!window.bannerCaricamento) { var sj = document.createElement('script'); sj.src = '../2inf-monitor/caricamento.js'; document.head.appendChild(sj); }
      var cbox = document.createElement('div'); cbox.id = 'controllo'; cbox.className = 'card'; $('strumenti').parentNode.insertBefore(cbox, $('strumenti').nextSibling);
      var leggiC = function () { fetch(B.controllo + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (!d) return;
        cbox.innerHTML = (window.bannerCaricamento ? bannerCaricamento(d) : '') + '<h2 style="margin-top:0">Il controllo del tuo progetto (' + e(d.ora) + ', cartella «' + e(d.cartella) + '»)</h2><div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:14px"><tr><th style="text-align:left">Alunno</th><th>Cartella</th><th>Pezzi</th><th>Salvataggi</th><th style="text-align:left">Cosa fare adesso</th></tr>' +
          d.righe.map(function (r) { return '<tr style="border-top:1px solid #ccc' + (r.fuori ? ';background:rgba(224,65,58,.12)' : '') + '"><td><b>' + e(r.alunno) + '</b></td><td>' + (r.cartella_ok ? '✔' : '✘') + '</td><td>' + (d.pezzi_nomi || ['Form', 'FOR', 'WHILE', 'sfida']).map(function (x) { return (r.pezzi.indexOf(x) >= 0 ? '✔' : '○') + ' ' + x; }).join(' ') + '</td><td>' + e(r.salvataggi) + (r.ultimo ? ' (' + e(r.ultimo) + ')' : '') + '</td><td>' + e(r.messaggio) + (r.fuori ? ' <b style="color:#e0413a">Veyon: fuori lezione ' + e(r.fuori) + ' volte</b>' : '') + '</td></tr>'; }).join('') + '</table></div>'; }).catch(function () {}); };
      leggiC(); setInterval(leggiC, 60000);
    }
  }
  function orologioConsegna() {
    if (!STATO.scadenza) return '';
    var fine = new Date(STATO.scadenza), resta = (fine - Date.now()) / 1000, ora = fine.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    return resta > 0 ? 'Consegna entro le <b>' + ora + '</b> · mancano <b>' + mmss(resta) + '</b>' : '<b style="color:#ffb3a8">Tempo scaduto: consegna adesso</b>';
  }
  setInterval(function () { var t = document.getElementById('timer'); if (t) t.innerHTML = orologioConsegna(); }, 1000);
  function giudizio(p) { return p >= .85 ? 'ottimo' : p >= .7 ? 'bene' : p >= .55 ? 'ci sei quasi' : p > 0 ? 'continua: ce la fai' : 'comincia'; }
  function mostraAndamento() {
    if (!NOME) return; var A = andamento(), k = Object.keys(A.pratica), primo = k.filter(function (x) { return A.pratica[x] === 1; }).length;
    var storia = (B.prepara || []).filter(function (q, i) { var P = prendi('prepara-' + B.id) || {}; return parole(P[i] || '') >= (q.min || 15); }).length;
    var tot = (B.allenamento || []).length + (B.via ? 1 : 0), v = prendi(KR('verifica')), parti = [];
    parti.push('<span>Ripasso: <b>' + k.length + '/' + tot + '</b> risposte · <b>' + primo + '</b> giuste al primo colpo</span>');
    if ((B.prepara || []).length) parti.push('<span>La tua storia: <b>' + storia + '/' + B.prepara.length + '</b></span>');
    var p = k.length ? (primo / k.length) * .7 + (B.prepara && B.prepara.length ? storia / B.prepara.length * .3 : .3) : 0;
    if (v) { var pa = perArea(v), g = 0, n = 0; Object.keys(pa).forEach(function (x) { g += pa[x].giuste; n += pa[x].su; }); p = n ? g / n : p; parti.push('<span>Verifica: <b>' + g + '/' + n + '</b> crocette giuste · scritte: le valuta il prof</span>'); }
    var mio = RIS && (RIS.allievi || []).filter(function (a) { return (a.allievo || '').toLowerCase() === sigla(NOME).toLowerCase(); }).pop();
    if (mio && mio.voto) parti.push('<span>Voto del prof: <b>' + e(mio.voto) + '</b></span>');
    parti.push('<span>Andamento: <span class="giudizio">' + (mio && mio.voto ? 'voto ' + e(mio.voto) : giudizio(p)) + '</span></span>');
    $('andamento').hidden = false; $('andamento').innerHTML = '<span><b>Il mio andamento</b> · ' + e(NOME) + '</span>' + parti.join('') + (STATO.scadenza ? '<span id="timer">' + orologioConsegna() + '</span>' : '');
  }
  function leggiRisultati() { if (!B.risultati) return Promise.resolve(); return fetch('risultati/' + idB + '.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) { RIS = d; }).catch(function () {}); }

  /* ================= RIPASSO ================= */
  /* TEORIA (20/10/2026, chiesto dai ragazzi): un link solo per leggere, distinto dal ripasso con le domande.
     B.ripasso_n = quante schede iniziali ripassano lezioni passate; le altre sono la teoria nuova. */
  function sezione(i) {
    var n = +B.ripasso_n || 0; if (!n) return '';
    if (i === 0) return '<h2 class="sez" style="margin:22px 0 6px;color:#6e40c9">RIPASSO · quello che hai già studiato</h2>';
    if (i === n) return '<h2 class="sez" style="margin:22px 0 6px;color:#1f6feb">TEORIA NUOVA · quello che impari oggi</h2>';
    return '';
  }
  function teoria() {
    var h = '<div class="card"><h2>Teoria</h2><p>Qui leggi soltanto, senza domande. Quando hai letto, vai al <a href="?b=' + idB + '"><b>Ripasso</b></a>: lì ci sono le domande con la correzione subito.</p></div>';
    (B.schede || []).forEach(function (sc, i) { h += sezione(i) + '<div class="card"><h2>' + e(sc.titolo) + '</h2><p>' + sc.testo + '</p></div>'; });
    h += '<div class="card"><a class="bt v" href="?b=' + idB + '">Vai al ripasso con le domande</a></div>';
    APP.innerHTML = h;
  }
  function ripasso() {
    if (!NOME) return chiediNome(ripasso);
    var TOT_SC = (B.schede || []).length, maxSc = 0, lastSent = -1, nRisp = 0;
    function pingAvz(force) {
      if (!CONF.invio || !NOME || (maxSc === lastSent && !force)) return; lastSent = maxSc;
      var sc = (B.schede || [])[Math.max(0, maxSc - 1)] || {};
      var d = { id: 'avz-' + B.id, modo: 'avanzamento', classe: B.classe || '', nome: NOME, scheda: maxSc, totale: TOT_SC, risposte: nRisp, titolo: (sc.titolo || '').replace(/^\d+[.)]?\s*/, ''), quando: new Date().toISOString() };
      try { fetch(CONF.invio, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'd=' + encodeURIComponent(JSON.stringify(d)) }); } catch (x) {}
    }
    function segnaRisposta(scheda) { nRisp++; var n = +scheda || 0; if (n > maxSc) maxSc = n; pingAvz(true); }
    var h = '<div class="mu">Ciao <b>' + e(NOME) + '</b> · <a href="#" id="cambia">non sei tu?</a></div>';
