<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Frau Doktor Bonomi — Tresor</title>
<style>
  :root{
    --page:#17181b; --page2:#101013;
    --ink:#efe7d4; --soft:#b9ad92; --dim:#7c7361;
    --black1:#2b2c30; --black2:#121316; --black3:#1b1c20;
    --steelA:#eef1f4; --steelB:#aeb7c0; --steelC:#dfe4e9; --steelD:#868f99; --steelE:#c6cdd4;
    --brassA:#f7e7ab; --brassB:#d3ad55; --brassC:#b8860b; --brassD:#e9cd77; --brassE:#8c6712;
    --engrave:#2c220a;
    --ok:#6fbf7f; --bad:#d9736a;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
    --silver:linear-gradient(145deg,var(--steelA) 0%,var(--steelB) 24%,var(--steelC) 46%,var(--steelD) 72%,var(--steelE) 100%);
    --brass:linear-gradient(145deg,var(--brassA) 0%,var(--brassB) 30%,var(--brassC) 56%,var(--brassD) 80%,var(--brassE) 100%);
    --blackmetal:linear-gradient(150deg,#3a2f1d,#160f06 58%,#2a2010);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{
    font-family:var(--sans); color:var(--ink);
    background:radial-gradient(120% 80% at 50% -10%, #26251f, transparent 60%), var(--page);
    min-height:100dvh; line-height:1.5; -webkit-text-size-adjust:100%;
    padding:max(18px,env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:460px; margin:0 auto}

  /* ================= THE SAFE ================= */
  .safe{position:relative; margin:8px 0 30px; border-radius:30px; padding:16px 15px 20px;
    background:var(--blackmetal);
    border:1px solid #3a3b40;
    box-shadow:
      0 0 0 3px #100a02,
      0 0 0 6px var(--brassC),
      0 0 0 9px #100a02,
      inset 0 2px 3px rgba(255,255,255,.10), inset 0 -20px 40px rgba(0,0,0,.55),
      0 30px 60px rgba(0,0,0,.6);}
  /* corner rivets */
  .rivet{position:absolute; width:13px; height:13px; border-radius:50%; background:var(--brass);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -1px 2px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.5); z-index:4}
  .rivet.tl{top:12px; left:12px} .rivet.tr{top:12px; right:12px}
  .rivet.bl{bottom:14px; left:12px} .rivet.br{bottom:14px; right:12px}
  /* feet */
  .feet{position:absolute; bottom:-14px; left:0; right:0; display:flex; justify-content:space-between; padding:0 26px; z-index:-1}
  .foot{width:52px; height:18px; border-radius:0 0 8px 8px; background:linear-gradient(180deg,var(--steelD),#2c2f33 70%,#17181b);
    box-shadow:0 6px 10px rgba(0,0,0,.55), inset 0 2px 2px rgba(255,255,255,.25)}

  /* ornate brass crest (frontone) */
  .crest{position:relative; margin:2px auto 15px; max-width:356px; padding:15px 18px 11px; text-align:center;
    background:var(--brass); border:1px solid #7c5a10;
    border-radius:48% 48% 10px 10px / 64% 64% 10px 10px;
    box-shadow:inset 0 2px 2px rgba(255,255,255,.6), inset 0 -4px 9px rgba(90,60,0,.5), 0 3px 5px rgba(0,0,0,.55)}
  .crest .gauge{position:absolute; top:11px; width:27px; height:27px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  .crest .gauge.l{left:16px} .crest .gauge.r{right:16px}
  .crest .gauge .face{fill:#f2e6c4; stroke:#6e5210; stroke-width:2}
  .crest .gauge .nd{stroke:#3a2c08; stroke-width:1.6; stroke-linecap:round}
  .crest .gauge .pin{fill:#3a2c08}
  .crest .sup{font-family:var(--mono); font-size:.52rem; letter-spacing:.32em; color:var(--engrave); opacity:.8}
  .crest h1{margin:3px 0 1px; font-family:var(--serif); font-weight:700; font-size:clamp(1.3rem,6.3vw,1.82rem); letter-spacing:.01em; line-height:1.02; text-wrap:balance;
    color:#4a3a12; text-shadow:0 1px 0 rgba(255,245,210,.55), 0 -1px 1px rgba(60,40,0,.5)}
  .crest .est{font-family:var(--mono); font-size:.5rem; letter-spacing:.2em; color:var(--engrave); opacity:.72}

  /* dial (round chrome key look) */
  .stage{position:relative; height:210px; margin:4px auto 12px; display:grid; place-items:center;
    background:radial-gradient(60% 60% at 50% 42%, rgba(0,0,0,.55), transparent 72%); border-radius:16px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.03)}
  .dialwrap{position:relative; width:176px; height:176px; filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
  .wheel{width:100%; height:100%; display:block}
  .wheel .w-rim{fill:none; stroke:url(#brs); stroke-width:10}
  .wheel .w-rim-d{fill:none; stroke:rgba(0,0,0,.5); stroke-width:2}
  .wheel .w-plate{fill:radial-gradient; fill:#241b0c}
  .wheel .arm{fill:url(#brs); stroke:#5c4410; stroke-width:1.4}
  .wheel .w-hub{fill:url(#brs); stroke:#5c4410; stroke-width:1.6}
  .wheel .w-hub-d{fill:#221907; stroke:#7c5a10; stroke-width:1.2}
  .w-spin{transform-box:fill-box; transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinR{to{transform:rotate(-360deg)}}
  .s-wheel .w-spin{animation:spin 1.25s cubic-bezier(.4,.05,.6,.95) infinite}
  .cog-deco{position:absolute; z-index:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.55)); transform-origin:center}
  .cog-deco.a{width:50px; height:50px; left:24px; top:40px}
  .cog-deco.b{width:36px; height:36px; right:30px; bottom:36px}
  .cog-deco .r{fill:none; stroke:#b8860b; stroke-width:7; stroke-dasharray:3 4.6; stroke-linecap:butt}
  .cog-deco .h{fill:#1a1408; stroke:#d3ad55; stroke-width:2}
  .busy .cog-deco.a{animation:spin 3s linear infinite}
  /* the lever (leva) */
  .lever{position:absolute; right:16px; bottom:26px; width:26px; height:94px; z-index:2; transform-origin:50% calc(100% - 6px); transform:rotate(-15deg); filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
  .lever .rod{position:absolute; left:50%; bottom:6px; width:9px; height:84px; margin-left:-4.5px; border-radius:5px; background:linear-gradient(90deg,#7c5a10,#f2d98a 45%,#7c5a10)}
  .lever .knob{position:absolute; left:50%; top:-3px; width:25px; height:25px; margin-left:-12.5px; border-radius:50%; background:var(--brass); box-shadow:inset 0 1px 2px rgba(255,255,255,.6), inset 0 -3px 6px rgba(90,60,0,.5), 0 2px 3px rgba(0,0,0,.5)}
  .lever .base{position:absolute; left:50%; bottom:-5px; width:28px; height:15px; margin-left:-14px; border-radius:5px; background:var(--brass); box-shadow:inset 0 1px 1px rgba(255,255,255,.5), inset 0 -3px 6px rgba(90,60,0,.5), 0 2px 3px rgba(0,0,0,.5)}
  @keyframes pullonce{0%{transform:rotate(-15deg)} 48%{transform:rotate(35deg)} 100%{transform:rotate(-15deg)}}
  .s-lever .lever{animation:pullonce .6s ease-in-out}
  /* steam puff on done */
  .steam{position:absolute; top:2px; left:50%; z-index:5; pointer-events:none; width:0; height:0}
  .steam span{position:absolute; bottom:0; width:30px; height:30px; margin-left:-15px; border-radius:50%;
    background:radial-gradient(circle, rgba(238,240,246,.9), rgba(238,240,246,0) 68%); opacity:0}
  @keyframes puff{0%{opacity:0; transform:translateY(14px) scale(.35)} 25%{opacity:.9} 100%{opacity:0; transform:translateY(-66px) scale(2)}}
  .done .steam span:nth-child(1){left:-16px; animation:puff 1.4s ease-out 0s}
  .done .steam span:nth-child(2){left:2px; animation:puff 1.6s ease-out .12s}
  .done .steam span:nth-child(3){left:18px; animation:puff 1.25s ease-out .3s}

  .doc{position:absolute; top:6px; left:50%; width:56px; transform:translateX(-50%); transition:transform .9s cubic-bezier(.5,0,.4,1), opacity .5s; z-index:2; text-align:center}
  .doc svg{width:34px; height:42px; display:block; margin:0 auto; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
  .doc .dnm{font-family:var(--mono); font-size:.6rem; color:var(--soft); margin-top:3px; max-width:92px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .stage:not(.hasfile) .doc{display:none}
  .busy .doc,.done .doc{transform:translate(-50%,80px) scale(.2); opacity:0}

  .token{position:absolute; bottom:8px; left:50%; transform:translateX(-50%) scale(.6); opacity:0; transition:transform .45s cubic-bezier(.2,1.3,.4,1), opacity .3s; z-index:3;
    display:inline-flex; align-items:center; gap:1px; font-family:var(--mono); font-size:.9rem; font-weight:700; letter-spacing:.02em; max-width:94%;
    color:var(--engrave); background:var(--brass); border:1px solid #7c5a10; border-radius:7px; padding:6px 11px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 4px rgba(90,60,0,.4), 0 2px 4px rgba(0,0,0,.5)}
  .token .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .done .token{transform:translateX(-50%) scale(1); opacity:1}

  /* segmented tabs — engraved metal */
  .seg{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:14px}
  .seg button{appearance:none; border:1px solid #050506; cursor:pointer; font:inherit; font-family:var(--mono); font-weight:700; font-size:.82rem; letter-spacing:.1em; text-transform:uppercase; padding:11px 6px; border-radius:9px;
    color:var(--soft); background:linear-gradient(180deg,#242529,#0e0f12);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.5); transition:.16s}
  .seg button[aria-selected="true"]{color:var(--engrave); background:var(--brass);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -3px 6px rgba(90,60,0,.4), 0 1px 2px rgba(0,0,0,.5)}
  .seg button:focus-visible{outline:2px solid var(--brassD); outline-offset:2px}

  label.field{display:block; margin-top:14px}
  .lbl{display:block; font-family:var(--mono); font-size:.65rem; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); margin-bottom:6px; padding-left:2px}

  .well{background:linear-gradient(180deg,#0b0906,#181206); border:1px solid #4a3a12; border-radius:10px;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.8), inset 0 0 0 1.5px rgba(184,134,11,.35), 0 1px 0 rgba(255,220,140,.12)}
  .drop{padding:15px; text-align:center; cursor:pointer; position:relative; border-radius:10px}
  .drop.drag{box-shadow:inset 0 0 0 1px var(--brassC), inset 0 2px 5px rgba(0,0,0,.7)}
  .drop:focus-within{outline:2px solid var(--brassD); outline-offset:2px}
  .drop .big{font-weight:600; font-size:.92rem; color:var(--ink)}
  .drop .small{color:var(--soft); font-size:.8rem; margin-top:2px; font-family:var(--mono)}
  .drop input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer}
  .filepill{display:flex; align-items:center; gap:10px; text-align:left; padding:11px 12px}
  .filepill .nm{font-family:var(--mono); font-size:.82rem; color:var(--ink); word-break:break-all; flex:1; min-width:0}
  .filepill .sz{font-family:var(--mono); font-size:.75rem; color:var(--soft); white-space:nowrap; font-variant-numeric:tabular-nums}
  .filepill .x{appearance:none; border:0; background:transparent; color:var(--soft); cursor:pointer; font-size:1.15rem; line-height:1; padding:2px 4px; position:relative; z-index:2}
  .filepill .x:hover{color:var(--bad)}

  .pw{position:relative}
  .pw input{width:100%; font-family:var(--mono); font-size:1rem; color:var(--ink); background:transparent; border:0; border-radius:10px; padding:13px 44px 13px 13px; letter-spacing:.06em}
  .pw input::placeholder{color:var(--dim)}
  .pw input:focus{outline:none}
  .pw:focus-within{box-shadow:inset 0 0 0 1px var(--brassC), inset 0 2px 5px rgba(0,0,0,.7); border-radius:10px}
  .eye{position:absolute; right:6px; top:50%; transform:translateY(-50%); appearance:none; border:0; background:transparent; cursor:pointer; color:var(--soft); padding:8px; border-radius:8px; display:grid; place-items:center}
  .eye:hover{color:var(--brassD)} .eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
  .eye:focus-visible{outline:2px solid var(--brassD)}

  .go{width:100%; margin-top:18px; appearance:none; border:1px solid #6e5210; cursor:pointer; font:inherit; font-family:var(--mono); font-weight:800; font-size:.95rem; letter-spacing:.1em; text-transform:uppercase; color:var(--engrave);
    background:var(--brass); padding:15px 16px; border-radius:12px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,.7), inset 0 -5px 10px rgba(90,60,0,.45), 0 3px 6px rgba(0,0,0,.55); transition:filter .15s, transform .05s}
  .go:hover{filter:brightness(1.05)} .go:active{transform:translateY(1px); box-shadow:inset 0 1px 1px rgba(255,255,255,.5), inset 0 3px 8px rgba(90,60,0,.55)}
  .go:disabled{opacity:.45; cursor:not-allowed; filter:grayscale(.5)}
  .go:focus-visible{outline:2px solid #fff; outline-offset:2px}

  .msg{margin-top:14px; border-radius:10px; padding:12px 14px; font-size:.88rem; display:none; font-family:var(--mono); background:linear-gradient(180deg,#0d0e10,#151619); border:1px solid #050506; box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
  .msg.show{display:block}
  .msg.ok{color:var(--ink); border-color:#2a4a30}
  .msg.bad{color:var(--ink); border-color:#4a2a28}
  .msg strong{color:var(--brassD)} .msg code{color:var(--brassD)}
  .dl{display:inline-flex; align-items:center; gap:8px; margin-top:10px; font-family:var(--mono); font-weight:800; color:var(--engrave); text-decoration:none; font-size:.86rem; border-radius:9px; padding:9px 13px; background:var(--brass); border:1px solid #6e5210; box-shadow:inset 0 1px 1px rgba(255,255,255,.6), 0 2px 4px rgba(0,0,0,.5)}
  .dl:focus-visible{outline:2px solid #fff; outline-offset:2px}

  .foot{margin:6px auto 0; max-width:40ch; text-align:center; color:var(--soft); font-size:.76rem; font-family:var(--mono)}
  .foot .shield{display:inline; font-weight:600; color:var(--brassD)}
  .foot .shield svg{width:14px;height:14px;stroke:var(--brassC);fill:none;stroke-width:1.9; vertical-align:-2px; margin-right:5px}
  .foot p{margin:7px 0 0; color:var(--dim)}
  .tip{margin-top:11px; border-top:1px solid #2a2b2f; padding-top:10px; color:var(--soft)}
  .tip b{color:var(--ink)}
  .vaultnote{margin-top:15px; text-align:center; font-family:var(--mono); font-size:.7rem; color:var(--soft); border-top:1px solid #3a2f18; padding-top:12px}
  .vaultnote .shield{font-weight:600; color:var(--brassD)}
  .vaultnote .shield svg{width:14px;height:14px;stroke:var(--brassC);fill:none;stroke-width:1.9;vertical-align:-2px;margin-right:4px}
  .vaultnote p{margin:6px 0 0; color:var(--dim); line-height:1.5}
  .vaultnote b{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){*{transition:none!important} .busy .knob,.busy .spokes{animation:none!important} .doc{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="safe">
    <span class="rivet tl"></span><span class="rivet tr"></span><span class="rivet bl"></span><span class="rivet br"></span>
    <span class="feet"><span class="foot"></span><span class="foot"></span></span>

    <div class="crest">
      <svg class="gauge l" viewBox="0 0 27 27" aria-hidden="true"><circle class="face" cx="13.5" cy="13.5" r="11"/><line class="nd" x1="13.5" y1="13.5" x2="19" y2="8.5"/><circle class="pin" cx="13.5" cy="13.5" r="1.6"/></svg>
      <svg class="gauge r" viewBox="0 0 27 27" aria-hidden="true"><circle class="face" cx="13.5" cy="13.5" r="11"/><line class="nd" x1="13.5" y1="13.5" x2="8.5" y2="9.5"/><circle class="pin" cx="13.5" cy="13.5" r="1.6"/></svg>
      <div class="sup">STEAMWORKS · TRESOR</div>
      <h1>Frau Doktor Bonomi</h1>
      <div class="est">· MECHANISCHER TRESOR · EST. 2077 ·</div>
    </div>

    <div class="seg" role="tablist" aria-label="Cosa vuoi fare">
      <button role="tab" id="tab-lock" aria-selected="true" aria-controls="panel">Proteggi</button>
      <button role="tab" id="tab-open" aria-selected="false" aria-controls="panel">Apri</button>
    </div>

    <div id="panel" role="tabpanel">
      <div class="stage" id="stage" aria-hidden="true">
        <div class="doc" id="doc">
          <svg viewBox="0 0 34 42"><path d="M4 2h16l10 10v28a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="#e9e2d0" stroke="#b8b0a0" stroke-width="1.4"/><path d="M20 2v10h10" fill="none" stroke="#b8b0a0" stroke-width="1.4"/><line x1="8" y1="20" x2="24" y2="20" stroke="#8c8676" stroke-width="1.8"/><line x1="8" y1="27" x2="24" y2="27" stroke="#8c8676" stroke-width="1.8"/><line x1="8" y1="34" x2="18" y2="34" stroke="#8c8676" stroke-width="1.8"/></svg>
          <div class="dnm" id="docName">file</div>
        </div>

        <svg class="cog-deco a" viewBox="0 0 40 40" aria-hidden="true"><circle class="r" cx="20" cy="20" r="13"/><circle class="h" cx="20" cy="20" r="6"/></svg>
        <div class="lever" aria-hidden="true"><span class="base"></span><span class="rod"></span><span class="knob"></span></div>
        <div class="dialwrap">
          <svg class="wheel" viewBox="0 0 160 160" aria-hidden="true">
            <defs><linearGradient id="brs" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f7e7ab"/><stop offset=".35" stop-color="#d3ad55"/><stop offset=".58" stop-color="#b8860b"/><stop offset=".82" stop-color="#e9cd77"/><stop offset="1" stop-color="#8c6712"/>
            </linearGradient></defs>
            <circle cx="80" cy="80" r="70" fill="#1a1408"/>
            <circle class="w-rim" cx="80" cy="80" r="64"/>
            <circle class="w-rim-d" cx="80" cy="80" r="57"/>
            <g class="w-spin">
              <g transform="rotate(0 80 80)"><rect class="arm" x="75" y="16" width="10" height="50" rx="5"/><circle class="arm" cx="80" cy="16" r="11"/></g>
              <g transform="rotate(120 80 80)"><rect class="arm" x="75" y="16" width="10" height="50" rx="5"/><circle class="arm" cx="80" cy="16" r="11"/></g>
              <g transform="rotate(240 80 80)"><rect class="arm" x="75" y="16" width="10" height="50" rx="5"/><circle class="arm" cx="80" cy="16" r="11"/></g>
              <circle class="w-hub" cx="80" cy="80" r="24"/>
              <circle class="w-hub-d" cx="80" cy="80" r="10"/>
            </g>
          </svg>
        </div>

        <div class="token" id="token"><span>[</span><span class="nm" id="tokenName">file</span><span>]</span></div>
        <div class="steam" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>

      <label class="field">
        <span class="lbl" id="fileLabel">Il file da proteggere</span>
        <div class="well">
          <div class="drop" id="drop" tabindex="0" role="button" aria-labelledby="fileLabel">
            <div id="dropEmpty">
              <div class="big">Tocca per scegliere un file</div>
              <div class="small" id="dropSmall">foto, documento, qualunque cosa</div>
            </div>
            <div class="filepill" id="filePill" hidden>
              <span class="nm" id="fileName"></span>
              <span class="sz" id="fileSize"></span>
              <button type="button" class="x" id="fileClear" aria-label="Togli il file">&times;</button>
            </div>
            <input type="file" id="file">
          </div>
        </div>
      </label>

      <label class="field">
        <span class="lbl">Password</span>
        <div class="well pw">
          <input type="password" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="scegli una password">
          <button type="button" class="eye" id="eye" aria-label="Mostra la password" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/></svg>
          </button>
        </div>
      </label>

      <label class="field" id="confirmField">
        <span class="lbl">Ripeti la password</span>
        <div class="well pw"><input type="password" id="pw2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="la stessa, per sicurezza"></div>
      </label>

      <button class="go" id="go" disabled>Proteggi e scarica</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>

      <div class="vaultnote">

  function setMode(m){

  }
  function showFile(){

  tabLock.onclick=function(){setMode("lock");};
  tabOpen.onclick=function(){setMode("open");};
  fileInput.onchange=function(){ if(fileInput.files[0]) pick(fileInput.files[0]); };
  fileClear.onclick=function(e){ e.stopPropagation(); e.preventDefault(); chosen=null; fileInput.value=""; showFile(); resetStage(); refresh(); };
  drop.onkeydown=function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();fileInput.click();} };
  ["dragover","dragenter"].forEach(function(ev){ drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("drag");}); });
  ["dragleave","drop"].forEach(function(ev){ drop.addEventListener(ev,function(e){e.preventDefault();drop.classList.remove("drag");}); });
  drop.addEventListener("drop",function(e){ if(e.dataTransfer.files[0]) pick(e.dataTransfer.files[0]); });
  pw.oninput=refresh; pw2.oninput=refresh;
  eye.onclick=function(){ var s=pw.type==="text"; pw.type=s?"password":"text"; pw2.type=pw.type; eye.setAttribute("aria-pressed",s?"false":"true"); eye.setAttribute("aria-label",s?"Mostra la password":"Nascondi la password"); };

  function download(blob,name){ var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener"; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500); return url; }

  function deriveKey(password,salt){

      return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);

  }
  function b64enc(u8){ var s="",C=0x8000; for(var i=0;i<u8.length;i+=C){ s+=String.fromCharCode.apply(null,u8.subarray(i,i+C)); } return btoa(s); }
  function buildOpener(b64,name){
    var esc=name.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});
    var HOST="https://nicolaregge-pulse.github.io/corso-godot/cassaforte/";
    var css='*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:radial-gradient(120% 80% at 50% -10%,#26251f,transparent 60%),#17181b;color:#efe7d4}[hidden]{display:none!important}.c{width:100%;max-width:360px;background:linear-gradient(180deg,#1f1a10,#120d06);border:1px solid #7c5a10;border-radius:16px;padding:24px 20px;text-align:center;box-shadow:0 0 0 3px #100a02,0 20px 50px rgba(0,0,0,.6)}.lk{width:44px;height:44px;margin:0 auto 12px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(145deg,#f7e7ab,#b8860b);box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}.lk svg{width:22px;height:22px;stroke:#3a2c08;fill:none;stroke-width:1.9}h1{margin:0;font-size:1.3rem;letter-spacing:.02em;color:#e9cd77}.f{margin:8px 0 16px;font-size:.9rem;color:#b9ad92;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}.f b{color:#efe7d4}input{width:100%;font:1rem ui-monospace,Menlo,Consolas,monospace;color:#efe7d4;background:#0b0906;border:1px solid #4a3a12;border-radius:10px;padding:13px;text-align:center;letter-spacing:.05em}input:focus{outline:none;border-color:#b8860b}button{width:100%;margin-top:14px;border:1px solid #6e5210;cursor:pointer;font:700 1rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase;color:#3a2c08;background:linear-gradient(180deg,#f7e7ab,#b8860b);padding:14px;border-radius:11px;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}button:disabled{opacity:.5}#m{margin-top:14px;font-size:.9rem;font-family:ui-monospace,Menlo,Consolas,monospace;min-height:1.2em}#m.ok{color:#7fdca0}#m.bad{color:#ff9b8f}.sp{display:none;align-items:center;justify-content:center;gap:9px;margin-top:14px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#e9cd77;font-size:.9rem}.sp.on{display:flex}.ring{width:20px;height:20px;border:2px solid rgba(233,205,119,.25);border-top-color:#e9cd77;border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.n{margin-top:16px;font-size:.72rem;color:#7c7361;font-family:ui-monospace,Menlo,Consolas,monospace}.dl{display:inline-block;margin-top:10px;color:#3a2c08;background:#e9cd77;text-decoration:none;font-weight:700;border-radius:9px;padding:11px 16px;font-family:ui-monospace,Menlo,Consolas,monospace}.steps{text-align:left;margin:8px 0 14px;padding-left:20px;font-size:.9rem;line-height:1.55;color:#d8ccb0}.steps b{color:#efe7d4}.ig{font-size:.95rem;color:#e9cd77;margin:2px 0 8px}.url{margin-top:10px;font-size:.68rem;color:#7c7361;font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}';
    return '<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Cassaforte '+esc+'</title><style>'+css+'</style></head><body>'
    +'<div class="c"><div class="lk"><svg viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M7.5 10.5V7.5a4.5 4.5 0 0 1 9 0v3"/></svg></div>'
    +'<h1>Cassaforte</h1><div class="f">File protetto:<br><b>'+esc+'</b></div>'

    +'<p class="ig">Per aprirlo su iPhone</p>'

    +'<a class="dl" href="'+HOST+'">Apri la Cassaforte</a>'
    +'<div class="url">'+HOST+'</div>'
    +'<div class="n">Su Android, PC o Mac invece basta toccarlo: si apre da solo.</div>'
    +'</div>'
    +'<div id="live" hidden>'
    +'<input id="pw" type="password" placeholder="scrivi la password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">'
    +'<button id="go">Apri il file</button>'
    +'<div class="sp" id="sp"><span class="ring"></span><span id="pct">Apro…</span></div>'
    +'<div id="m"></div>'
    +'<div class="n">Tutto avviene qui sul tuo dispositivo. Niente in rete.</div>'
    +'</div></div>'
    +'<script>var D="'+b64+'";(function(){'
    +'if(!(window.crypto&&crypto.subtle))return;'
    +'var live=document.getElementById("live"),ios=document.getElementById("ios");live.hidden=false;ios.hidden=true;'
    +'var m=document.getElementById("m"),pw=document.getElementById("pw"),go=document.getElementById("go"),sp=document.getElementById("sp"),pct=document.getElementById("pct");'
    +'var dec=new TextDecoder();function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}'
    +'go.onclick=function(){m.className="";m.textContent="";sp.className="sp on";pct.textContent="Apro…";go.disabled=true;'

    +'var p=new Uint8Array(ptb),nl=(p[0]<<8)|p[1],nm=dec.decode(p.slice(2,2+nl)),data=p.slice(2+nl);'
    +'var ext=(nm.split(".").pop()||"").toLowerCase(),mm={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",bmp:"image/bmp",pdf:"application/pdf"};'
    +'var blob=new Blob([data],mm[ext]?{type:mm[ext]}:{}),safe=nm.replace(/[<>&]/g,""),isI=/^(png|jpg|jpeg|gif|webp|bmp)$/.test(ext);'

    +'fr.onload=function(){var u=fr.result;sp.className="sp";go.disabled=false;'
    +'var h="<div>Fatto! Ecco <b>"+safe+"</b></div>";'
    +'if(isI){h+="<img src=\\""+u+"\\" style=\\"max-width:100%;border-radius:10px;margin-top:12px;display:block\\"><div class=\\"n\\">Tieni premuto sulla foto per salvarla.</div>";}'
    +'h+="<a class=\\"dl\\" href=\\""+u+"\\" download=\\""+safe+"\\">Apri / Salva il file</a>";'
    +'m.className="ok";m.innerHTML=h;};fr.onerror=function(){sp.className="sp";go.disabled=false;m.className="bad";m.textContent="Errore nel mostrare il file.";};fr.readAsDataURL(blob);'
    +'}).catch(function(){sp.className="sp";go.disabled=false;m.className="bad";m.textContent="Password sbagliata, oppure file danneggiato.";});};'
    +'pw.addEventListener("keydown",function(e){if(e.key==="Enter")go.click();});})();<\/script></body></html>';
  }

  function protect(file,password){
    var salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
    return file.arrayBuffer().then(function(fb){ return deriveKey(password,salt).then(function(key){
      var body=new Uint8Array(fb), nameB=enc.encode(file.name), nl=nameB.length;
      var plain=new Uint8Array(2+nl+body.length); plain[0]=(nl>>8)&255; plain[1]=nl&255; plain.set(nameB,2); plain.set(body,2+nl);
      return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,plain).then(function(ct){
        var c=new Uint8Array(ct), out=new Uint8Array(32+c.length); out.set(MAGIC,0); out.set(salt,4); out.set(iv,20); out.set(c,32);
        return {blob:new Blob([buildOpener(b64enc(out), file.name)],{type:"text/html"}), name:"["+file.name+"].html"};
      });
    }); });
  }
  function openFile(file,password){
    return file.arrayBuffer().then(function(fb){
      var buf=new Uint8Array(fb);
      // se è il file .html che si apre da solo, estrai i dati incorporati
      if(buf.length>20 && buf[0]===0x3C){
        var m=dec.decode(buf).match(/var D="([A-Za-z0-9+/=]+)"/);
        if(m){ var bs=atob(m[1]); buf=new Uint8Array(bs.length); for(var q=0;q<bs.length;q++) buf[q]=bs.charCodeAt(q); }
      }

          return {blob:new Blob([data]), name:name};
        }).catch(function(){ throw new Error("BADPW"); });
      });
    });
  }

  go.onclick=function(){
    if(go.disabled) return; clearMsg();
    if(mode==="lock" && pw.value!==pw2.value){ say("bad","Le due password non sono uguali. Riscrivile identiche."); return; }
    go.disabled=true; resetStage(); ensureAudio();
    var job=mode==="lock"? protect(chosen,pw.value) : openFile(chosen,pw.value);
    stage.classList.add("busy");                                              // 1) rotellina piccola
    var t1=setTimeout(function(){ stage.classList.add("s-wheel"); }, 430);    // 2) maniglione grande

      var r=res[0];
      stage.classList.remove("busy","s-wheel");                              // 3) si fermano
      playClunk();                                                            //    "tac"
      stage.classList.add("s-lever");                                         // 4) si muove la leva
      setTimeout(function(){
        tokenName.textContent = mode==="lock" ? chosen.name : r.name;
        token.querySelectorAll("span").forEach(function(b){ if(b.className!=="nm") b.style.display = mode==="lock" ? "" : "none"; });
        stage.classList.add("done"); playHiss();                             // 5) sbuffo + sfiato
        var url=download(r.blob,r.name);
        if(mode==="lock"){ say("ok","<strong>Chiuso nel tresor.</strong> Hai <code>"+escapeHtml(r.name)+"</code>. Mandalo a chi vuoi (WhatsApp, mail…). Su <b>Android / PC / Mac</b> basta toccarlo: si apre da solo. Su <b>iPhone</b> il file stesso spiega i due passi (Salva su File, poi apri la Cassaforte). Se non si scarica da solo:<br><a class=\"dl\" href=\""+url+"\" download=\""+escapeAttr(r.name)+"\">Scarica</a>"); }
        else{ say("ok","<strong>Aperto.</strong> Ecco il file: <code>"+escapeHtml(r.name)+"</code>. Se non parte da solo, tocca qui.<br><a class=\"dl\" href=\""+url+"\" download=\""+escapeAttr(r.name)+"\">Scarica "+escapeHtml(r.name)+"</a>"); }
        refresh();
      }, 520);
    }).catch(function(err){
      clearTimeout(t1); resetStage();
      if(err&&err.message==="BADPW") say("bad","<strong>Password sbagliata</strong>, oppure il file è danneggiato. Ricontrolla e riprova.");
      else if(err&&err.message==="NOTCSF") say("bad","Questo non è un file protetto qui. Scegli quello col nome <b>tra parentesi quadre</b>.");
      else say("bad","Qualcosa è andato storto. Riprova, magari con un file più piccolo.");
      refresh();
    });
  };
  function escapeHtml(s){return s.replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  if(!(window.crypto&&crypto.subtle)){ say("bad","Questo browser non è aggiornato abbastanza per cifrare in sicurezza. Prova con Safari o Chrome recenti."); go.disabled=true; }
  setMode("lock");
})();
