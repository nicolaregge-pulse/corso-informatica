<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 540" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a5147"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="818" height="538" rx="14" fill="#ffffff" stroke="#e0d8ca"/>
  <text x="410" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2b3f57">La rete di casa</text>

  <!-- Internet -->
  <ellipse cx="410" cy="95" rx="95" ry="34" fill="#eef1f4" stroke="#7a8698" stroke-width="2"/>
  <text x="410" y="101" text-anchor="middle" font-size="16" font-weight="700" fill="#404a5a">Internet</text>

  <!-- Modem -->
  <line x1="410" y1="129" x2="410" y2="158" stroke="#5a5147" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="340" y="160" width="140" height="52" rx="10" fill="#eaf1f8" stroke="#3a6ea5" stroke-width="2"/>
  <text x="410" y="184" text-anchor="middle" font-size="15" font-weight="700" fill="#274b73">Modem</text>
  <text x="410" y="201" text-anchor="middle" font-size="10.5" fill="#3a6ea5">entra la linea</text>

  <!-- Router -->
  <line x1="410" y1="212" x2="410" y2="238" stroke="#5a5147" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="325" y="240" width="170" height="60" rx="10" fill="#e8f3e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="410" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#1e5b22">Router (Wi-Fi)</text>
  <text x="410" y="284" text-anchor="middle" font-size="10.5" fill="#3a6b3d">smista i dati - da gli indirizzi</text>

  <!-- left: cavo -> switch -> 2 PC -->
  <path d="M360,300 C300,330 250,335 210,360" fill="none" stroke="#5a5147" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="250" y="332" text-anchor="middle" font-size="10.5" fill="#5a5147">cavo</text>
  <rect x="120" y="362" width="150" height="50" rx="10" fill="#f2f0ec" stroke="#b8b0a2" stroke-width="2"/>
  <text x="195" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#201b16">Switch</text>
  <line x1="160" y1="412" x2="140" y2="452" stroke="#5a5147" stroke-width="2" marker-end="url(#a)"/>
  <line x1="230" y1="412" x2="250" y2="452" stroke="#5a5147" stroke-width="2" marker-end="url(#a)"/>
  <rect x="75" y="454" width="120" height="46" rx="9" fill="#fbfaf7" stroke="#b8b0a2"/>
  <text x="135" y="482" text-anchor="middle" font-size="13" fill="#201b16">PC 1</text>
  <rect x="205" y="454" width="120" height="46" rx="9" fill="#fbfaf7" stroke="#b8b0a2"/>
  <text x="265" y="482" text-anchor="middle" font-size="13" fill="#201b16">PC 2</text>

  <!-- right: Wi-Fi -> laptop, telefono -->
  <path d="M470,295 C560,320 590,340 615,365" fill="none" stroke="#b8933f" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="585" y="322" text-anchor="middle" font-size="10.5" fill="#8a6d1f">Wi-Fi (senza fili)</text>
  <rect x="560" y="366" width="150" height="46" rx="9" fill="#fbf3e2" stroke="#b8933f"/>
  <text x="635" y="394" text-anchor="middle" font-size="13" fill="#8a6d1f">Portatile</text>
  <rect x="560" y="454" width="150" height="46" rx="9" fill="#fbf3e2" stroke="#b8933f"/>
  <text x="635" y="482" text-anchor="middle" font-size="13" fill="#8a6d1f">Telefono</text>
  <path d="M615,412 C620,430 625,438 630,452" fill="none" stroke="#b8933f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
</svg>
