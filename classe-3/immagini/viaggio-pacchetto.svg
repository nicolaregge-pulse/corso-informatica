<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'DejaVu Sans','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="p" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a5147"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="818" height="468" rx="14" fill="#ffffff" stroke="#e0d8ca"/>
  <text x="410" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#2b3f57">Come viaggia un pacchetto</text>

  <!-- Mittente -->
  <rect x="40" y="180" width="120" height="70" rx="10" fill="#e8f3e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="100" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#1e5b22">Mittente</text>
  <text x="100" y="230" text-anchor="middle" font-size="11" fill="#3a6b3d">il dato di partenza</text>

  <!-- pacchetti (spezzato in 3) -->
  <text x="285" y="120" text-anchor="middle" font-size="11.5" fill="#6a6259">il dato e spezzato in pacchetti,</text>
  <text x="285" y="136" text-anchor="middle" font-size="11.5" fill="#6a6259">ognuno con l'indirizzo di arrivo</text>
  <g font-size="12" font-weight="700">
    <rect x="230" y="150" width="110" height="34" rx="6" fill="#eaf1f8" stroke="#3a6ea5"/>
    <text x="285" y="172" text-anchor="middle" fill="#274b73">pacchetto 1</text>
    <rect x="230" y="198" width="110" height="34" rx="6" fill="#eaf1f8" stroke="#3a6ea5"/>
    <text x="285" y="220" text-anchor="middle" fill="#274b73">pacchetto 2</text>
    <rect x="230" y="246" width="110" height="34" rx="6" fill="#eaf1f8" stroke="#3a6ea5"/>
    <text x="285" y="268" text-anchor="middle" fill="#274b73">pacchetto 3</text>
  </g>
  <line x1="160" y1="215" x2="228" y2="200" stroke="#5a5147" stroke-width="2" marker-end="url(#p)"/>

  <!-- router (rete) -->
  <ellipse cx="500" cy="215" rx="70" ry="52" fill="#f3eef8" stroke="#6a34a8" stroke-width="2"/>
  <text x="500" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#4a2378">Router</text>
  <text x="500" y="224" text-anchor="middle" font-size="10.5" fill="#6a34a8">scelgono la</text>
  <text x="500" y="238" text-anchor="middle" font-size="10.5" fill="#6a34a8">strada</text>
  <path d="M342,167 C400,175 420,190 435,200" fill="none" stroke="#5a5147" stroke-width="2" marker-end="url(#p)"/>
  <path d="M342,215 C380,215 400,215 428,215" fill="none" stroke="#5a5147" stroke-width="2" marker-end="url(#p)"/>
  <path d="M342,263 C400,255 420,240 435,230" fill="none" stroke="#5a5147" stroke-width="2" marker-end="url(#p)"/>

  <!-- destinatario -->
  <rect x="660" y="180" width="120" height="70" rx="10" fill="#fbf3e2" stroke="#b8933f" stroke-width="2"/>
  <text x="720" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#8a6d1f">Destinatario</text>
  <text x="720" y="225" text-anchor="middle" font-size="11" fill="#b8933f">rimette in ordine</text>
  <text x="720" y="240" text-anchor="middle" font-size="11" fill="#b8933f">i pacchetti</text>
  <line x1="570" y1="215" x2="656" y2="215" stroke="#5a5147" stroke-width="2" marker-end="url(#p)"/>

  <text x="410" y="330" text-anchor="middle" font-size="12" fill="#6a6259">Anche per strade diverse, i pacchetti arrivano e il dato si ricompone.</text>
  <text x="410" y="360" text-anchor="middle" font-size="11.5" font-style="italic" fill="#8a7f6f">Come spedire un libro pagina per pagina, in tante buste separate.</text>
</svg>
