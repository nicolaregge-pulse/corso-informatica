<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-label="Schema: le due domande del client e le cinque risposte del server"><rect width="1000" height="290" fill="#fffdf8"/><rect x="20" y="20" width="300" height="250" rx="14" fill="#eaf3fb" stroke="#0b5fa5" stroke-width="3"/><text x="170" y="55" font-size="26" fill="#0b5fa5" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">Il client chiede</text><rect x="40" y="80" width="260" height="70" rx="10" fill="#fff" stroke="#0b5fa5" stroke-width="3"/><text x="170" y="111" font-size="25" fill="#1d1d1f" text-anchor="middle" font-family="Consolas,Courier New,monospace" font-weight="700">STATO;nome</text><text x="170" y="138" font-size="17" fill="#5d5a52" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">come va la partita?</text><rect x="40" y="170" width="260" height="80" rx="10" fill="#fff" stroke="#0b5fa5" stroke-width="3"/><text x="170" y="200" font-size="25" fill="#1d1d1f" text-anchor="middle" font-family="Consolas,Courier New,monospace" font-weight="700">GUESS;nome;1234</text><text x="170" y="232" font-size="17" fill="#5d5a52" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">ecco il mio tentativo</text><rect x="480" y="20" width="500" height="250" rx="14" fill="#fbeee1" stroke="#a24a00" stroke-width="3"/><text x="730" y="55" font-size="26" fill="#a24a00" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">Il server risponde</text><text x="500" y="94" font-size="22" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">STATO;GIOCO;...</text><text x="710" y="94" font-size="16" fill="#5d5a52" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">la classifica (gioco acceso o fermo)</text><text x="500" y="134" font-size="22" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">WAIT</text><text x="710" y="134" font-size="16" fill="#5d5a52" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">aspetta: il Prof non ha detto Via</text><text x="500" y="174" font-size="22" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">RESULT;n;b;...</text><text x="710" y="174" font-size="16" fill="#5d5a52" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">neri, bianchi e classifica</text><text x="500" y="214" font-size="22" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">WIN;nome;...</text><text x="710" y="214" font-size="16" fill="#5d5a52" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">hai vinto!</text><text x="500" y="254" font-size="22" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">ERR;motivo</text><text x="710" y="254" font-size="16" fill="#5d5a52" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">qualcosa non va</text><line x1="325" y1="115" x2="470" y2="115" stroke="#0b5fa5" stroke-width="5"/><polygon points="470,115 455.5928463623572,121.95944854577968 455.5928463623572,108.04055145422032" fill="#0b5fa5"/><line x1="470" y1="205" x2="325" y2="205" stroke="#a24a00" stroke-width="5"/><polygon points="325,205 339.4071536376428,198.04055145422032 339.4071536376428,211.95944854577968" fill="#a24a00"/><text x="8" y="14" font-size="11" fill="#9a9384" font-family="system-ui,Segoe UI,Arial,sans-serif">schema disegnato</text></svg>