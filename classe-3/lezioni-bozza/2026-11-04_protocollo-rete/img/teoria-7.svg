<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-label="Tabella: ogni riga del server fa partire un evento"><rect width="1000" height="400" fill="#fffdf8"/><rect x="20" y="20" width="960" height="46" rx="8" fill="#e9e3d3" stroke="#cfc8b8" stroke-width="2"/><text x="40" y="51" font-size="21" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">riga che arriva</text><text x="330" y="51" font-size="21" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">evento</text><text x="520" y="51" font-size="20" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">cosa fa la finestra</text><rect x="20" y="72" width="960" height="46" rx="8" fill="#fff" stroke="#cfc8b8" stroke-width="2"/><text x="40" y="103" font-size="21" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace">STATO;...</text><text x="330" y="103" font-size="21" fill="#0b5fa5" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">OnStato</text><text x="520" y="103" font-size="20" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">scrive GIOCO o ATTESA e la classifica</text><rect x="20" y="124" width="960" height="46" rx="8" fill="#fff" stroke="#cfc8b8" stroke-width="2"/><text x="40" y="155" font-size="21" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace">WAIT</text><text x="330" y="155" font-size="21" fill="#0b5fa5" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">OnAttesa</text><text x="520" y="155" font-size="20" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">scrive: aspetta il Via</text><rect x="20" y="176" width="960" height="46" rx="8" fill="#fff" stroke="#cfc8b8" stroke-width="2"/><text x="40" y="207" font-size="21" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace">RESULT;n;b;...</text><text x="330" y="207" font-size="21" fill="#0b5fa5" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">OnRisultato</text><text x="520" y="207" font-size="20" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">disegna i piolini neri e bianchi</text><rect x="20" y="228" width="960" height="46" rx="8" fill="#fff" stroke="#cfc8b8" stroke-width="2"/><text x="40" y="259" font-size="21" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace">WIN;...</text><text x="330" y="259" font-size="21" fill="#0b5fa5" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">OnVittoria</text><text x="520" y="259" font-size="20" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">HAI VINTO + 4 piolini neri</text><rect x="20" y="280" width="960" height="46" rx="8" fill="#fff" stroke="#cfc8b8" stroke-width="2"/><text x="40" y="311" font-size="21" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace">ERR;...</text><text x="330" y="311" font-size="21" fill="#0b5fa5" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">OnRifiuto</text><text x="520" y="311" font-size="20" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">scrive il motivo</text><rect x="20" y="332" width="960" height="46" rx="8" fill="#fff" stroke="#cfc8b8" stroke-width="2"/><text x="40" y="363" font-size="21" fill="#1d1d1f" text-anchor="start" font-family="Consolas,Courier New,monospace">(rete rotta)</text><text x="330" y="363" font-size="21" fill="#0b5fa5" text-anchor="start" font-family="Consolas,Courier New,monospace" font-weight="700">OnErrore</text><text x="520" y="363" font-size="20" fill="#1d1d1f" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">scrive cosa non va</text><text x="8" y="14" fon