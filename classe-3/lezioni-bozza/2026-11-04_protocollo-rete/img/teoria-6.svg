<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-label="Schema: UnitInterfaccia chiama UnitRete e UnitRete avvisa con eventi; UnitRete parla con il server"><rect width="1000" height="390" fill="#fffdf8"/><rect x="40" y="20" width="440" height="130" rx="14" fill="#eaf3fb" stroke="#0b5fa5" stroke-width="3"/><text x="260" y="62" font-size="30" fill="#0b5fa5" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">UnitInterfaccia</text><text x="260" y="96" font-size="20" fill="#5d5a52" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">finestra, disegni, bottoni, pioli</text><text x="260" y="126" font-size="19" fill="#1d1d1f" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">niente rete qui dentro</text><rect x="40" y="230" width="440" height="130" rx="14" fill="#fff" stroke="#1d1d1f" stroke-width="3"/><text x="260" y="272" font-size="30" fill="#1d1d1f" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">UnitRete</text><text x="260" y="306" font-size="20" fill="#5d5a52" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">collegarsi, scrivere una riga,</text><text x="260" y="332" font-size="20" fill="#5d5a52" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">leggere una riga, il protocollo</text><line x1="150" y1="155" x2="150" y2="225" stroke="#0b5fa5" stroke-width="6"/><polygon points="150,225 142.17062038599786,208.79195215765182 157.82937961400214,208.79195215765182" fill="#0b5fa5"/><text x="162" y="196" font-size="18" fill="#0b5fa5" text-anchor="start" font-family="system-ui,Segoe UI,Arial,sans-serif">chiama: ChiediStato, InviaTentativo</text><line x1="380" y1="225" x2="380" y2="155" stroke="#c47a00" stroke-width="6"/><polygon points="380,155 387.82937961400216,171.20804784234818 372.17062038599784,171.20804784234818" fill="#c47a00"/><text x="368" y="196" font-size="18" fill="#c47a00" text-anchor="end" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">EVENTO: OnRisultato...</text><rect x="600" y="230" width="360" height="130" rx="14" fill="#fbeee1" stroke="#a24a00" stroke-width="3"/><text x="780" y="285" font-size="30" fill="#a24a00" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">Il server</text><text x="780" y="322" font-size="22" fill="#5d5a52" text-anchor="middle" font-family="Consolas,Courier New,monospace">porta 5050</text><line x1="485" y1="295" x2="595" y2="295" stroke="#1d1d1f" stroke-width="5"/><polygon points="595,295 580.5928463623571,301.9594485457797 580.5928463623571,288.0405514542203" fill="#1d1d1f"/><line x1="595" y1="325" x2="485" y2="325" stroke="#1d1d1f" stroke-width="5"/><polygon points="485,325 499.4071536376428,318.0405514542203 499.4071536376428,331.9594485457797" fill="#1d1d1f"/><text x="540" y="280" font-size="17" fill="#5d5a52" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">righe</text><rect x="560" y="40" width="400" height="110" rx="10" fill="#fffbe6" stroke="#d4a017" stroke-width="3"/><text x="760" y="80" font-size="21" fill="#1d1d1f" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif" font-weight="700">Come OnClick di un bottone:</text><text x="760" y="112" font-size="21" fill="#1d1d1f" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">quando succede qualcosa,</text><text x="760" y="138" font-size="21" fill="#1d1d1f" text-anchor="middle" font-family="system-ui,Segoe UI,Arial,sans-serif">la rete AVVISA la finestra</text><text x="8" y="14" font-size="11" fill="#9a9384" font-family="system-ui,Segoe UI,Arial,sans-serif">schema disegnato</text></svg>