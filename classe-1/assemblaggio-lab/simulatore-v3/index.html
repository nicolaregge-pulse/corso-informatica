<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monta il PC — sfida</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--tx:#17202a;--mu:#5a6572;--ln:#d5dbe2;--acc:#1f6feb;--ok:#2f9e57;--no:#e0413a;--board:#214a33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#9aa4ae;--ln:#30363d;--acc:#58a6ff;--ok:#3fb950;--no:#f85149;--board:#17331f}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#9aa4ae;--ln:#30363d;--acc:#58a6ff;--ok:#3fb950;--no:#f85149;--board:#17331f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Segoe UI,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
.w{max-width:1080px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:clamp(20px,5vw,28px);margin:4px 0}
.mu{color:var(--mu)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
button,.lang b{font:inherit;font-weight:800;cursor:pointer;border-radius:9px;border:2px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 13px}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.go{background:var(--ok);color:#fff;border-color:var(--ok)}
input{font:inherit;padding:7px 11px;border-radius:9px;border:2px solid var(--ln);background:var(--card);color:var(--tx);max-width:180px}
.timer{margin-left:auto;font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;background:var(--card);border:2px solid var(--ln);border-radius:10px;padding:5px 12px}
.pcbadge{font-weight:800;background:#1f6feb;color:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.lay{display:flex;gap:14px;flex-wrap:wrap}
.boardwrap{flex:1 1 560px;min-width:300px}
.side{flex:1 1 230px;min-width:220px}
.board{position:relative;width:100%;aspect-ratio:600/430;background:linear-gradient(135deg,var(--board),#14301f);border:3px solid #0c2416;border-radius:14px;overflow:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.35)}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.trace{position:absolute;background:rgba(255,255,255,.06)}
.slot{position:absolute;border:2px dashed rgba(255,255,255,.45);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;color:#d7ead9;font-size:11px;font-weight:700;padding:2px;line-height:1.1;z-index:2}
/* i connettori = PRESE: rettangolo pieno con i "pin" */
.slot.cable{border-style:solid;border-color:#caa23a;background:repeating-linear-gradient(90deg,#3a3320 0 3px,#4a4026 3px 6px);border-radius:3px;color:#ffe9b0;font-size:9px}
.slot.full{opacity:0}
/* dispositivo-sorgente del cavo (ventola, bottone…): da qui parte il filo */
.srcdev{position:absolute;border-radius:8px;background:#223129;border:1.5px solid rgba(255,255,255,.35);color:#d7ead9;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;line-height:1.05;pointer-events:none;z-index:3;box-shadow:inset 0 0 0 3px rgba(0,0,0,.18)}
.chip{position:absolute;border-radius:7px;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 5px;line-height:1.05;white-space:pre-line;box-shadow:0 3px 7px rgba(0,0,0,.3);border:1px solid rgba(0,0,0,.25);touch-action:none;z-index:4}
.chip.mobo{z-index:0;background:rgba(47,158,87,.10)!important;border:3px solid #2f9e57;border-radius:12px;align-items:flex-end;justify-content:flex-start;color:#9fe3bb;font-size:12px;padding:8px}
.chip.ram{font-size:9.5px;line-height:1.15;background:#7a5ba6}
.chip.placed{cursor:default}
.chip.drag{z-index:999;transform:scale(1.06);box-shadow:0 10px 22px rgba(0,0,0,.4)}
/* cavo piazzato = SPINOTTO che riempie la presa (niente scatola vuota) */
.chip.plug{border-radius:3px;border:2px solid rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.45);font-size:8px;z-index:5;overflow:hidden;line-height:1.02}
/* zona CPU concentrica (come lo schizzo): dissipatore (fuori) ⊃ CPU (dentro, tratteggiata) ⊃ ventola (cerchio) */
.chip.cpu{z-index:4;background:transparent!important;border:2px dashed #e7b45a;align-items:flex-start;justify-content:center;color:#f0d49a;font-size:11px;padding-top:4px}
.chip.cooler{z-index:5;background:transparent!important;border:3px solid #8aa6c8;align-items:flex-end;justify-content:center;color:#cfe0f2;font-size:11px;padding-bottom:4px}
.chip.fan{z-index:6;background:transparent!important;border:3px solid #cfe0f2;border-radius:50%;color:#eaf2fb;font-size:10px}
.tray{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;min-height:90px}
.tray h2{font-size:15px;margin:2px 0 8px}
.traybox{display:flex;flex-wrap:wrap;gap:8px;position:relative;min-height:60px}
.tray .chip{position:static;min-width:76px;height:42px;cursor:grab}
.tray .chip.cable{border-radius:999px;height:34px;min-width:98px;padding-left:24px;position:relative}
.tray .chip.cable::before{content:"";position:absolute;left:8px;top:50%;transform:translateY(-50%);width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.tray .chip.cable::after{content:"";position:absolute;left:-7px;top:50%;transform:translateY(-50%);width:9px;height:4px;border-radius:3px;background:currentColor;opacity:.55}
.tray.over{outline:3px dashed var(--acc);outline-offset:3px;border-radius:12px}
.list{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-top:12px}
.list h2{font-size:15px;margin:2px 0 6px}
.list li{margin:3px 0;list-style:none;padding-left:22px;position:relative;font-size:14.5px}
.list li::before{content:"○";position:absolute;left:2px;color:var(--mu)}
.list li.done{color:var(--ok)}.list li.done::before{content:"✓";color:var(--ok);font-weight:900}
.msg{margin:10px 0;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--ln);font-weight:700;min-height:20px}
.msg.ok{border-color:var(--ok);color:var(--ok)}.msg.no{border-color:var(--no);color:var(--no)}
.win{display:none;text-align:center;background:linear-gradient(135deg,#1f6feb,#2f9e57);color:#fff;border-radius:14px;padding:16px;margin-top:12px;font-weight:800;font-size:19px}
.win.show{display:block;animation:pop .4s}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.lang{display:flex;gap:4px}
.lang b{padding:6px 9px;font-size:13px;opacity:.55}
.lang b.on{opacity:1;border-color:var(--acc);color:var(--acc)}
.ar{direction:rtl}
.leg{font-size:12.5px;color:var(--mu);margin:2px 0 6px;display:flex;gap:16px;flex-wrap:wrap}
.leg span{display:inline-flex;align-items:center;gap:6px}.leg i{display:inline-block;width:22px;height:12px;border-radius:3px;background:#7a5ba6}.leg i.c{height:4px;width:26px;background:#1f6feb}
.rank{font-size:14px}.rank table{border-collapse:collapse;width:100%}.rank td{padding:3px 6px;border-bottom:1px solid var(--ln)}.rank td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
</style></head>
<body><div class="w">
<h1 id="t_title">Monta il PC — la sfida</h1>
<p class="mu" id="t_sub">Scrivi il tuo COGNOME e nome, poi monta il PC il più in fretta possibile. Ogni volta esce un PC diverso.</p>
<div class="leg"><span><i></i> <b id="t_dev">Dispositivo</b></span><span><i class="c"></i> <b id="t_cab">Cavo</b> (filo)</span></div>

<div class="bar">
  <input id="pcname" placeholder="Cognome e nome…" maxlength="28">
  <button id="m_mount" class="on">🔧 <span id="t_mount">Rimonta</span></button>
  <button id="m_un">↩︎ <span id="t_un">Smonta</span></button>
  <button id="newpc">🎲 <span id="t_new">Nuovo PC</span></button>
  <div class="lang"><b data-l="it" class="on">IT</b><b data-l="ar">عربي</b><b data-l="zh">中文</b></div>
  <div class="timer" id="timer">0.0s</div>
</div>
<div class="bar"><span class="pcbadge" id="pcbadge">PC 1</span><span id="mystats" style="font-size:13px;margin-left:10px"></span></div>

<div class="msg" id="msg">—</div>

<div class="lay">
  <div class="boardwrap"><div class="board" id="board"></div></div>
  <div class="side">
    <div class="tray" id="tray"><h2 id="t_tray">Pezzi e cavi</h2><div class="traybox" id="traybox"></div></div>
    <div class="list"><h2 id="t_todo">Da fare</h2><ul id="todo"></ul></div>
    <div class="list rank"><h2 id="t_rank">Classifica (tempo medio)</h2><div id="rankbox"><p class="mu" id="t_rankempty">Ancora nessun tempo.</p></div></div>
  </div>
</div>

<div class="win" id="win"></div>
</div>

  el.style.left=s.x+'%';el.style.top=s.y+'%';el.style.width=s.w+'%';el.style.height=s.h+'%';el.textContent=s[L]||s.it;board.appendChild(el);
 }
 PARTS.forEach(function(p){if(!p.src)return;var m=document.createElement('div');m.className='srcdev';m.style.left=p.src.x+'%';m.style.top=p.src.y+'%';m.style.width=p.src.w+'%';m.style.height=p.src.h+'%';m.textContent=p.src[L]||p.src.it;board.appendChild(m)});
}
function wirePath(a,b){var dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1,off=Math.min(16,len*0.3);var mx=(a.x+b.x)/2-dy/len*off,my=(a.y+b.y)/2+dx/len*off;return 'M'+a.x+' '+a.y+' Q'+mx+' '+my+' '+b.x+' '+b.y}
function edgePt(p){var s=SLOTS[p.slot],cx=cxf(s),cy=cyf(s),a=p.from,dx=a.x-cx,dy=a.y-cy,L=Math.sqrt(dx*dx+dy*dy)||1;return {x:cx+dx/L*(s.w*0.5),y:cy+dy/L*(s.h*0.5)}}
function drawWire(p){var svg=document.getElementById('wires');if(!svg)return;clearWire(p.id);var b=edgePt(p),a=p.from;
 var g=document.createElementNS(SVGNS,'g');g.id='wire_'+p.id;
 var pa=document.createElementNS(SVGNS,'path');pa.setAttribute('d',wirePath(a,b));pa.setAttribute('fill','none');pa.setAttribute('stroke',p.color);pa.setAttribute('stroke-width','3.2');pa.setAttribute('stroke-linecap','round');pa.setAttribute('vector-effect','non-scaling-stroke');g.appendChild(pa);
 var c=document.createElementNS(SVGNS,'circle');c.setAttribute('cx',a.x);c.setAttribute('cy',a.y);c.setAttribute('r','1.8');c.setAttribute('fill',p.color);c.setAttribute('stroke','#fff');c.setAttribute('stroke-width','0.5');g.appendChild(c);
 svg.appendChild(g)}
function clearWire(id){var g=document.getElementById('wire_'+id);if(g)g.parentNode.removeChild(g)}
function makeChip(p){var c=document.createElement('div');c.className='chip'+(p.cable?' cable':'')+(p.cls?(' '+p.cls):'');c.id='chip_'+p.id;c.dataset.id=p.id;if(!p.outline)c.style.background=p.color;c.textContent=p[L]||p.it;c.addEventListener('pointerdown',startDrag);return c}
function placeOnBoard(p){var c=document.getElementById('chip_'+p.id)||makeChip(p);c.classList.add('placed');c.style.position='absolute';c.style.fontSize='';
 if(p.cable){var ep=edgePt(p),nw=4.2,nh=3.0;c.classList.add('plug');c.textContent='';
  c.style.left=(ep.x-nw/2)+'%';c.style.top=(ep.y-nh/2)+'%';c.style.width=nw+'%';c.style.height=nh+'%';
  board.appendChild(c);drawWire(p);return}
 var s=p.box||SLOTS[p.slot];c.style.left=s.x+'%';c.style.top=s.y+'%';c.style.width=s.w+'%';c.style.height=s.h+'%';board.appendChild(c);
 var sl=document.getElementById('slot_'+p.slot);if(sl)sl.classList.add('full')}

function reset(){placed={};drawBoard();tray.innerHTML='';win.className='win';win.innerHTML='';stopTimer();setTime(0);
 if(MODE==='mount'){PARTS.forEach(function(p){tray.appendChild(makeChip(p))});setMsg(T('start'))}
 else{PARTS.forEach(function(p){placed[p.id]=true;placeOnBoard(p)});setMsg(T('unstart'))}
 renderTodo()}
function renderTodo(){todo.innerHTML='';PARTS.forEach(function(p){var li=document.createElement('li');li.textContent=p[L]||p.it;var done=(MODE==='mount')?placed[p.id]:!placed[p.id];if(done)li.className='done';todo.appendChild(li)});
 var allIn=PARTS.every(function(p){return placed[p.id]});if(MODE==='mount'&&allIn)finish();
 if(MODE==='un'){var allOut=PARTS.every(function(p){return !placed[p.id]});if(allOut&&tRun)finishUn()}}

/* ---- cronometro ---- */
function setTime(ms){document.getElementById('timer').textContent=(ms/1000).toFixed(1)+'s'}
function startTimer(){if(tRun)return;tRun=true;t0=Date.now();tInt=setInterval(function(){setTime(Date.now()-t0)},100)}
function stopTimer(){tRun=false;if(tInt){clearInterval(tInt);tInt=null}}
function finish(){stopTimer();var ms=Date.now()-t0;setTime(ms);
 var nm=document.getElementById('pcname').value.trim();
 win.className='win show';
 win.innerHTML=T('win')+'<b>'+(ms/1000).toFixed(1)+'s</b> — PC '+preset.n+' · '+(preset.tipo||'')+'!<br><span style="font-size:14px;font-weight:600">'+(nm?T('again'):T('noname'))+'</span>';
 if(nm){record(nm,ms,'asm');invia('assemblato',ms);renderRank();renderMy()}
}
function finishUn(){stopTimer();var ms=Date.now()-t0;setTime(ms);
 var nm=document.getElementById('pcname').value.trim();
 win.className='win show';
 win.innerHTML=T('winun')+'<b>'+(ms/1000).toFixed(1)+'s</b>!<br><span style="font-size:14px;font-weight:600">'+(nm?T('again'):T('noname'))+'</span>';
 if(nm){record(nm,ms,'dis');invia('smontato',ms);renderRank();renderMy()}
}

/* ---- punteggio e classifica (montare=1, smontare=0,7) ---- */
function load(){try{var d=JSON.parse(localStorage.getItem('montapc_v3')||'{}');for(var k in d){var e=d[k];if(Array.isArray(e))d[k]={ta:e,td:[],asm:e.length,dis:0};else if(e&&e.t&&!e.ta){d[k]={ta:e.t,td:[],asm:e.asm||e.t.length,dis:e.dis||0}}}return d}catch(e){return {}}}
function save(d){try{localStorage.setItem('montapc_v3',JSON.stringify(d))}catch(e){}}
function record(nm,ms,tipo){var d=load();var e=d[nm]=d[nm]||{ta:[],td:[],asm:0,dis:0};if(tipo==='dis'){e.td.push(ms);if(e.td.length>60)e.td=e.td.slice(-60);e.dis++}else{e.ta.push(ms);if(e.ta.length>60)e.ta=e.ta.slice(-60);e.asm++}save(d)}
function punteggio(e){return e.asm+0.7*e.dis}
function mediaAsm(e){return e.ta&&e.ta.length?e.ta.reduce(function(s,x){return s+x},0)/e.ta.length:0}
function bestAsm(e){return e.ta&&e.ta.length?Math.min.apply(null,e.ta):0}
function fmt(x){return (Math.round(x*10)/10).toString()}
function renderRank(){var d=load(),rows=Object.keys(d).map(function(n){var e=d[n];return {n:n,avg:mediaAsm(e),best:bestAsm(e),asm:e.asm,dis:e.dis,p:punteggio(e)}});
 rows.sort(function(x,y){return y.p-x.p||(x.best||9e9)-(y.best||9e9)});
 var box=document.getElementById('rankbox');
 if(!rows.length){box.innerHTML='<p class="mu">'+T('rankempty')+'</p>';return}
 box.innerHTML='<table><tbody>'+rows.slice(0,12).map(function(r,i){return '<tr><td>'+(i+1)+'. '+esc(r.n)+'<br><span class="mu" style="font-size:11px">🔧'+r.asm+' · ↩'+r.dis+' · medio '+(r.avg/1000).toFixed(0)+'s · record '+(r.best?(r.best/1000).toFixed(1)+'s':'–')+'</span></td><td>'+fmt(r.p)+' pt</td></tr>'}).join('')+'</tbody></table>'}
function renderMy(){var el=document.getElementById('mystats');if(!el)return;var nm=document.getElementById('pcname').value.trim();if(!nm){el.textContent='';return}var d=load(),e=d[nm];if(!e||(!e.asm&&!e.dis)){el.innerHTML='<span class="mu">Ancora niente a tuo nome.</span>';return}var avg=mediaAsm(e),best=bestAsm(e);el.innerHTML='<b>'+esc(nm)+'</b> · 🔧 '+e.asm+' assemblati · ↩ '+e.dis+' smontati · tempo medio <b>'+(avg?(avg/1000).toFixed(1)+'s':'–')+'</b> · record <b>'+(best?(best/1000).toFixed(1)+'s':'–')+'</b> · <b>'+fmt(punteggio(e))+' pt</b>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* ---- invio al centro (per il cruscotto del prof) ---- */
var EXEC='';try{fetch('../verifica/config.json?t='+Date.now()).then(function(r){return r.json()}).then(function(c){EXEC=(c&&c.invio)||''}).catch(function(){})}catch(ex){}
function invia(tipo,ms){var nm=document.getElementById('pcname').value.trim();if(!nm||!EXEC)return;var ev={id:'monta-pc-lab',modo:'evento',classe:'1INF',nome:nm,tipo:tipo,formato:(preset.tipo||'')+' '+((FORMATO[preset.tipo]||{}).ff||''),ms:ms,quando:new Date().toLocaleString('it-IT')};try{fetch(EXEC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'d='+encodeURIComponent(JSON.stringify(ev))})}catch(e){}}

/* ---- drag ---- */
var drag=null;
function startDrag(ev){var id=this.dataset.id,p=byId(id);
 if(MODE==='mount'&&placed[id])return;
 if(MODE==='un'){if(!placed[id])return;if(!p.cable&&cableStillOn(id)){setMsg(T('removecable'),'no');return}}
 ev.preventDefault();var chip=this,r=chip.getBoundingClientRect();
 drag={id:id,p:p,chip:chip,dx:ev.clientX-r.left,dy:ev.clientY-r.top};
 chip.classList.add('drag');chip.style.position='fixed';chip.style.width=r.width+'px';chip.style.height=r.height+'px';
 if(p.cable)clearWire(id);moveDrag(ev);
 document.addEventListener('pointermove',moveDrag);document.addEventListener('pointerup',endDrag);
 if(MODE==='un')traywrap.classList.add('over')}
function moveDrag(ev){if(!drag)return;drag.chip.style.left=(ev.clientX-drag.dx)+'px';drag.chip.style.top=(ev.clientY-drag.dy)+'px'}
function endDrag(ev){if(!drag)return;document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointerup',endDrag);traywrap.classList.remove('over');var d=drag;drag=null;d.chip.classList.remove('drag');if(MODE==='mount')dropMount(d,ev);else dropUn(d,ev)}
function dropMount(d,ev){var slot=document.getElementById('slot_'+d.p.slot);
 if(d.p.id!=='mobo'&&PARTS.some(function(x){return x.id==='mobo'})&&!placed['mobo']){backToTray(d);setMsg(T('needmobo'),'no');return}
 if(slot&&overlap(d.chip,slot)){var miss=(d.p.needs||[]).filter(function(n){return !placed[n]});
  if(miss.length){backToTray(d);setMsg(d.p.id==='cooler'?T('needcpu'):T('need'),'no');return}
  startTimer();placed[d.p.id]=true;placeOnBoard(d.p);setMsg(T('ok'),'ok');renderTodo();return}
 backToTray(d);setMsg(T('bad'),'no')}
function dropUn(d,ev){if(overlap(d.chip,traywrap)){startTimer();placed[d.p.id]=false;if(d.p.cable)clearWire(d.p.id);var sl=document.getElementById('slot_'+d.p.slot);if(sl)sl.classList.remove('full');backToTray(d);setMsg(T('ok'),'ok');renderTodo();return}placeOnBoard(d.p)}
function backToTray(d){var chip=d.chip,p=d.p;chip.classList.remove('placed','plug');chip.style.position='static';chip.style.left='';chip.style.top='';chip.style.width='';chip.style.height='';chip.style.fontSize='';if(p.cable)chip.textContent=p[L]||p.it;tray.appendChild(chip)}
function cableStillOn(id){return PARTS.some(function(p){return p.cable&&placed[p.id]&&(p.needs||[]).indexOf(id)>=0})}
function overlap(a,b){var r=a.getBoundingClientRect(),s=b.getBoundingClientRect();var X=r.left+r.width/2,Y=r.top+r.height/2;return X>=s.left&&X<=s.right&&Y>=s.top&&Y<=s.bottom}

function applyLang(){document.documentElement.lang=L;document.body.classList.toggle('ar',L==='ar');
 ['title','sub','mount','un','tray','todo','rank','dev','cab'].forEach(function(k){var e=document.getElementById('t_'+k);if(e)e.textContent=T(k)});
 var nw=document.getElementById('t_new');if(nw)nw.textContent=T('neu');
 document.getElementById('pcname').placeholder=T('name');reset();renderRank();renderMy()}
function inCorso(){return tRun}
document.querySelectorAll('.lang b').forEach(function(b){b.onclick=function(){L=b.dataset.l;document.querySelectorAll('.lang b').forEach(function(x){x.classList.toggle('on',x===b)});applyLang()}});
document.getElementById('m_mount').onclick=function(){if(inCorso()){setMsg(T('finisci'),'no');return}MODE='mount';this.classList.add('on');document.getElementById('m_un').classList.remove('on');reset()};
document.getElementById('m_un').onclick=function(){if(inCorso()){setMsg(T('finisci'),'no');return}MODE='un';this.classList.add('on');document.getElementById('m_mount').classList.remove('on');reset()};
document.getElementById('newpc').onclick=function(){if(inCorso()){setMsg(T('finisci'),'no');return}MODE='mount';document.getElementById('m_mount').classList.add('on');document.getElementById('m_un').classList.remove('on');pickPC(0)};
document.getElementById('pcname').addEventListener('input',renderMy);

var _pc=parseInt((location.search.match(/[?&]pc=(\d)/)||[])[1],10);
pickPC(_pc>=1&&_pc<=3?_pc:0);renderRank();renderMy();
</script>
