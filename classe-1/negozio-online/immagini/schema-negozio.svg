<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a5147"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="468" rx="14" fill="#ffffff" stroke="#e0d8ca"/>
  <text x="410" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#2b3f57">Com'è fatto il tuo negozio</text>
  <text x="410" y="68" text-anchor="middle" font-size="14" fill="#6a6259">tre pezzi che lavorano insieme</text>

  <!-- CLIENTE -->
  <g>
    <rect x="40" y="205" width="170" height="110" rx="12" fill="#f2f0ec" stroke="#b8b0a2"/>
    <text x="125" y="250" text-anchor="middle" font-size="34">📱</text>
    <text x="125" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#201b16">Il cliente</text>
    <text x="125" y="305" text-anchor="middle" font-size="12" fill="#6a6259">chi guarda e ordina</text>
  </g>

  <!-- VETRINA / SITO (centro) -->
  <g>
    <rect x="315" y="185" width="210" height="150" rx="14" fill="#e8f3e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="420" y="230" text-anchor="middle" font-size="34">🛒</text>
    <text x="420" y="268" text-anchor="middle" font-size="17" font-weight="700" fill="#1e5b22">La vetrina (il sito)</text>
    <text x="420" y="290" text-anchor="middle" font-size="12" fill="#3a6b3d">i prodotti e il carrello</text>
    <text x="420" y="312" text-anchor="middle" font-size="11.5" fill="#6a6259">pubblicata su GitHub Pages</text>
  </g>

  <!-- DATABASE (alto a destra) -->
  <g>
    <rect x="630" y="60" width="160" height="115" rx="12" fill="#eaf1f8" stroke="#3a6ea5" stroke-width="2"/>
    <text x="710" y="102" text-anchor="middle" font-size="30">🗄️</text>
    <text x="710" y="133" text-anchor="middle" font-size="15" font-weight="700" fill="#274b73">Il database</text>
    <text x="710" y="153" text-anchor="middle" font-size="12" fill="#3a6ea5">il magazzino dei prodotti</text>
  </g>

  <!-- EMAIL (basso a destra) -->
  <g>
    <rect x="630" y="345" width="160" height="115" rx="12" fill="#fbf3e2" stroke="#b8933f" stroke-width="2"/>
    <text x="710" y="387" text-anchor="middle" font-size="30">📧</text>
    <text x="710" y="418" text-anchor="middle" font-size="15" font-weight="700" fill="#8a6d1f">L'email</text>
    <text x="710" y="438" text-anchor="middle" font-size="12" fill="#b8933f">l'avviso dell'ordine</text>
  </g>

  <!-- Arrows -->
  <!-- cliente -> vetrina -->
  <line x1="212" y1="260" x2="309" y2="260" stroke="#5a5147" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="260" y="248" text-anchor="middle" font-size="12" fill="#5a5147">apre il sito</text>

  <!-- database -> vetrina (i prodotti) -->
  <path d="M628,140 C560,170 540,185 527,210" fill="none" stroke="#3a6ea5" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="548" y="176" text-anchor="middle" font-size="12" fill="#274b73">manda i prodotti</text>

  <!-- vetrina -> email (l'ordine) -->
  <path d="M527,308 C560,335 575,355 628,388" fill="none" stroke="#b8933f" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="548" y="360" text-anchor="middle" font-size="12" fill="#8a6d1f">invia l'ordine</text>
</svg>
