name: Pubblica il sito (docs) su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # R9 04/11/2026: il ponte scrive live.json ogni 2 minuti; il deploy in corso finisce, resta in coda solo il piu recente

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configura Pages
        uses: actions/configure-pages@v5
      - name: Carica la cartella docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
